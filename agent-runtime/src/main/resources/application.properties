# Quarkus application name
quarkus.application.name=agent-runtime

# Jackson configuration — tolerate unknown JSON fields (use_rag, use_tools, systemPrompt)
# sent by homelab-pilot but not in ChatRequest record
quarkus.jackson.fail-on-unknown-properties=false

# LangChain4j Ollama configuration — defaults only.
# The operator generates /app/config/application.properties (ordinal 260) from
# Model/ModelProvider CRs, overriding these in-jar defaults (ordinal 250).
quarkus.langchain4j.ollama.base-url=${QUARKUS_LANGCHAIN4J_OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${QUARKUS_LANGCHAIN4J_OLLAMA_CHAT_MODEL_MODEL_ID:qwen3:32b}
quarkus.langchain4j.ollama.chat-model.temperature=0.3
quarkus.langchain4j.ollama.chat-model.num-predict=4096
# Per-call Ollama timeout. MUST stay BELOW the tool-loop wall-clock cap (300s):
# a single stuck inference has to fail fast so the loop/agent can react (stand
# aside) — if it equals the loop cap, one cold/contended call eats the whole
# budget and, on a num_parallel=1 GPU serializing the subcommittee, backs the
# coordinator up into SUBMITTED zombies and thread_found timeouts (regression
# 2026-06-02, reverted). The cold-load tail is handled by admission control
# (see [[Same-GPU Cold-Load Admission Control]]), NOT by widening this timeout.
quarkus.langchain4j.ollama.timeout=${QUARKUS_LANGCHAIN4J_OLLAMA_TIMEOUT:120s}
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false

# Server configuration
quarkus.http.port=8080
quarkus.shutdown.timeout=30s

# Health and metrics
quarkus.smallrye-health.ui.enabled=false
quarkus.micrometer.export.prometheus.enabled=true

quarkus.native.additional-build-args=--initialize-at-run-time=io.nats.client.support.RandomUtils

# Logging (JSON format)
quarkus.log.console.format={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","level":"%p","logger":"%c","message":"%m"}%n
quarkus.log.category."ai.kubemoot".level=INFO
quarkus.log.category."dev.langchain4j".level=INFO

# Env var mappings for non-standard env var names
# (all other kubemoot.* properties auto-map from KUBEMOOT_* env vars via SmallRye)
kubemoot.nats.url=${NATS_URL:}
kubemoot.onboarding.gap-detection-timeout-seconds=${KUBEMOOT_ONBOARDING_GAP_TIMEOUT:10}
# Map KUBEMOOT_CHAT_MODEL_ID to the model metadata property
# (AgentProperties.Model.model() returns this in chat responses)
kubemoot.model.model=${KUBEMOOT_CHAT_MODEL_ID:qwen3:32b}
# Triage model — lightweight model for quick "should I contribute?" checks.
# Uses direct HTTP to Ollama API (bypasses LangChain4j to avoid native build issues).
# AgentProperties reads these for the triage endpoint/model config.
kubemoot.triage-model.model-id=${KUBEMOOT_TRIAGE_MODEL_ID:}
kubemoot.triage-model.endpoint=${KUBEMOOT_TRIAGE_MODEL_ENDPOINT:}
# Triage prompt template — overridable via env var or agent policy ConfigMap.
# Supports {agent_name} and {tool_names} placeholders.
kubemoot.discuss.triage-prompt=${KUBEMOOT_DISCUSS_TRIAGE_PROMPT:}
