name: CI Dashboard

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/dashboard

permissions:
  contents: read

jobs:
  # The favicons and the sidebar lockup are copies of github.com/kubemoot/.github brand/
  # files; brand.lock pins the commit and each copy's sha256. Both jobs below need it.
  brand:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check the brand copies against brand.lock
        run: dashboard/scripts/brand-sync.sh check && dashboard/scripts/brand-sync.test.sh

  # Pull requests (including forks) build the image on a GitHub-hosted runner without
  # pushing, so the gates inside the Dockerfile still run and no cluster is reached.
  validate:
    needs: brand
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build dashboard image (no push)
        run: docker build --file dashboard/Dockerfile dashboard

  build:
    needs: brand
    if: github.event_name != 'pull_request'
    runs-on: homelab-runners

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # No Node toolchain on the runner: the multistage Dockerfile runs npm ci,
      # npm run check, npm test, and npm run build inside node:26-alpine, so the
      # image build is the single source of truth and the runner needs neither
      # Node 26 nor libatomic. Kaniko builds and pushes it below.

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Ensure Harbor project exists
        run: |
          curl -s -X POST "http://${{ env.REGISTRY }}/api/v2.0/projects" \
            -H "Content-Type: application/json" \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            -d '{"project_name": "kubemoot", "public": false}' \
            --fail-with-body || true

      # Builds the multistage Dockerfile (npm ci + check + test + build run inside
      # the image) and pushes it to Harbor.
      - name: Build dashboard image with Kaniko
        run: |
          SHA="${{ github.sha }}"
          JOB_NAME="kaniko-$(echo ${SHA} | cut -c1-8)-${GITHUB_RUN_NUMBER}"

          PUSH_ARGS='"--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'"${SHA}"'", "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"'

          tar -C dashboard -czf /tmp/context.tar.gz .

          kubectl run ${JOB_NAME} \
            --rm -i \
            --restart=Never \
            --namespace=arc-runners \
            --image=gcr.io/kaniko-project/executor:latest \
            --overrides='{
              "spec": {
                "hostAliases": [{"ip": "${{ vars.REGISTRY_HOST_IP }}", "hostnames": ["${{ vars.REGISTRY }}"]}],
                "containers": [{
                  "name": "kaniko",
                  "image": "gcr.io/kaniko-project/executor:latest",
                  "stdin": true,
                  "stdinOnce": true,
                  "args": [
                    "--context=tar://stdin",
                    "--dockerfile=Dockerfile",
                    "--label=org.opencontainers.image.source=https://github.com/kubemoot/kubemoot",
                    "--label=org.opencontainers.image.licenses=Apache-2.0",
                    "--label=org.opencontainers.image.revision='"${SHA}"'",
                    '"${PUSH_ARGS}"',
                    "--insecure",
                    "--skip-tls-verify",
                    "--cache=false"
                  ],
                  "volumeMounts": [{"name": "docker-config", "mountPath": "/kaniko/.docker"}]
                }],
                "volumes": [{"name": "docker-config", "secret": {"secretName": "kaniko-docker-config", "items": [{"key": "config.json", "path": "config.json"}]}}]
              }
            }' < /tmp/context.tar.gz
