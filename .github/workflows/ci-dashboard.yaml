name: CI Dashboard

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/buildah/**'
      - '.github/scripts/build-image-buildah.sh'
      - '.github/scripts/build-image-lib.sh'
      - '.github/workflows/build-dockerfile-image.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # The favicons and the sidebar lockup are copies of github.com/kubemoot/.github brand/
  # files; brand.lock pins the commit and each copy's sha256. Both jobs below need it.
  brand:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the brand copies against brand.lock
        run: dashboard/scripts/brand-sync.sh check && dashboard/scripts/brand-sync.test.sh

  # Pull requests (including forks) build the image on a GitHub-hosted runner without
  # pushing, so the gates inside the Dockerfile still run and no cluster is reached.
  validate:
    needs: brand
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build dashboard image (no push)
        run: docker build --file dashboard/Dockerfile dashboard

  # No Node toolchain on the runner: the multistage Dockerfile runs npm ci,
  # npm run check, npm run lint, npm test, and npm run build inside node:26-alpine,
  # so the image build is the single source of truth.
  build-image:
    needs: brand
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-dockerfile-image.yaml
    with:
      name: dashboard
      context: dashboard
