# Release Status: a daily check that a Kubemoot release covers every public repository.
#
# Runs .github/scripts/release-status.sh (the umbrella scripts/release-status.sh wraps it) over the six
# public repositories and keeps one issue in this repository: opened or updated while a
# repository has held an unpublished breaking change for more than a day, closed when none
# does (.github/scripts/release-status-issue.sh). The public repositories are read with the
# workflow's own token, which reads any public repository; no stored token is involved, and
# the only write permission is issues, on this repository.
#
# It also lists any component release workflow whose latest run on main failed
# (.github/scripts/check-release-workflow-runs.sh) and fails the job, since a release
# workflow runs only when its component changes and a broken one stays red unnoticed.
#
# GitHub disables a scheduled workflow after 60 days without activity in the repository.
# Kubemoot merges to main daily, which keeps this one alive; if main goes quiet that long, the
# check stops silently and needs enabling again (Actions tab, Release Status, Enable workflow).
name: Release Status

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

concurrency:
  group: release-status
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'kubemoot/kubemoot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the latest run of each release workflow
      issues: write # open, update and close the one release status issue
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/workflows
          persist-credentials: false

      - name: Check the public repositories
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # A breaking change merged today is not late yet: the issue waits a day.
          RELEASE_STATUS_MIN_AGE_HOURS: '24'
        run: |
          status=0
          bash .github/scripts/release-status.sh --markdown > "${RUNNER_TEMP}/report.md" || status=$?
          {
            echo '### Release status of the public repositories'
            echo
            cat "${RUNNER_TEMP}/report.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          # Above 3 the script itself did not run (a bad option, a crash): fail the job.
          if [ "$status" -gt 3 ]; then
            echo "::error title=Release status check did not run::release-status.sh exited ${status}."
            exit 1
          fi

      # Runs after a failed check too: the script then leaves the issue alone and fails.
      - name: Keep the issue in step with the status
        if: ${{ !cancelled() && steps.check.outputs.status != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        run: bash .github/scripts/release-status-issue.sh "$STATUS" "${RUNNER_TEMP}/report.md"

      # Last, so a failure here never skips the issue step above.
      - name: Check the latest run of every release workflow
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          bash .github/scripts/check-release-workflow-runs.sh > "${RUNNER_TEMP}/runs.md" || status=$?
          {
            echo '### Latest run of each release workflow on main'
            echo
            cat "${RUNNER_TEMP}/runs.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/runs.md"
          if [ "$status" -ne 0 ]; then
            echo "::error title=A release workflow is failing on main::check-release-workflow-runs.sh exited ${status}; see the summary."
            exit 1
          fi
