name: CI Query Service

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'query-service/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/query-service

permissions:
  contents: read

jobs:
  build:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: query-service
        run: pip install --require-hashes -r requirements.txt -r requirements-lint.txt

      # Ruff with query-service/ruff.toml, pinned by requirements-lint.txt.
      - name: Lint
        working-directory: query-service
        run: ruff check .

      - name: Run tests
        working-directory: query-service
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Install kubectl
        if: github.event_name != 'pull_request'
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Build and push with Kaniko
        if: github.event_name != 'pull_request'
        run: |
          SHA="${{ github.sha }}"
          JOB_NAME="kaniko-query-service-${SHA:0:8}-${GITHUB_RUN_NUMBER}"

          tar -C query-service -czf /tmp/context.tar.gz .

          kubectl run "${JOB_NAME}" \
            --rm -i \
            --restart=Never \
            --namespace=arc-runners \
            --image=gcr.io/kaniko-project/executor:latest \
            --overrides='{
              "spec": {
                "hostAliases": [{"ip": "${{ vars.REGISTRY_HOST_IP }}", "hostnames": ["${{ vars.REGISTRY }}"]}],
                "containers": [{
                  "name": "kaniko",
                  "image": "gcr.io/kaniko-project/executor:latest",
                  "stdin": true,
                  "stdinOnce": true,
                  "args": [
                    "--context=tar://stdin",
                    "--dockerfile=Dockerfile",
                    "--label=org.opencontainers.image.source=https://github.com/kubemoot/kubemoot",
                    "--label=org.opencontainers.image.licenses=Apache-2.0",
                    "--label=org.opencontainers.image.revision='"${SHA}"'",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'"${SHA}"'",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
                    "--insecure",
                    "--skip-tls-verify",
                    "--cache=false"
                  ],
                  "volumeMounts": [{"name": "docker-config", "mountPath": "/kaniko/.docker"}]
                }],
                "volumes": [{"name": "docker-config", "secret": {"secretName": "kaniko-docker-config", "items": [{"key": "config.json", "path": "config.json"}]}}]
              }
            }' < /tmp/context.tar.gz
