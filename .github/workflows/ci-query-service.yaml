name: CI Query Service

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'query-service/**'
      - '.github/workflows/build-dockerfile-image.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: query-service
        run: pip install --require-hashes -r requirements.txt -r requirements-lint.txt

      # Ruff with query-service/ruff.toml, pinned by requirements-lint.txt.
      - name: Lint
        working-directory: query-service
        run: ruff check .

      - name: Run tests
        working-directory: query-service
        run: python -m unittest discover -s . -p 'test_*.py' -v

  build-image:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-dockerfile-image.yaml
    with:
      name: query-service
      context: query-service
