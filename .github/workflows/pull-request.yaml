# The required check for pull requests: waits for every other check on the pull
# request's commit and passes only when all of them passed or were skipped. Auto-merge
# waits on it. The shared definition lives in kubemoot/release-actions.
name: Pull Request

on:
  pull_request:

permissions:
  checks: read

jobs:
  all-checks:
    uses: kubemoot/release-actions/.github/workflows/all-checks.yaml@46be10555367466d5add34c0f37dc2ae86c40af6 # v0.12.0
