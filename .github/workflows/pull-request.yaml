# The required check for pull requests: waits for every other check on the pull
# request's commit and passes only when all of them passed or were skipped. Auto-merge
# waits on it. The shared definition lives in kubemoot/release-actions.
name: Pull Request

# merge_group: the merge queue asks for this check on the queue's commit, the exact result
# that will land on main.
on:
  pull_request:
  merge_group:

permissions:
  checks: read
  statuses: read

jobs:
  all-checks:
    uses: kubemoot/release-actions/.github/workflows/all-checks.yaml@899dec57c20fafcccae4120d20bfd88e454f0a0f # v0.12.2
