name: CI Indexer

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'indexer/**'
      - 'config/checkstyle/**'
      - '.github/buildpacks/**'
      - '.github/scripts/build-image-buildpacks.sh'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/indexer

permissions:
  contents: read

jobs:
  test:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        working-directory: indexer
        run: ./gradlew build

      # The image packages this tested jar; the build pod does not compile again.
      - name: Keep the tested jar for the image build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexer-jar
          path: |
            indexer/build/libs/*.jar
            !indexer/build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 3

  build-image:
    needs: test
    runs-on: homelab-runners
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.37.1
          KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
        run: |
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Fetch the tested jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: indexer-jar
          path: ${{ runner.temp }}/indexer-jar

      # Buildpacks build a Spring Boot app from its exploded jar.
      - name: Explode the jar
        run: |
          jars=("${RUNNER_TEMP}"/indexer-jar/*.jar)
          [ "${#jars[@]}" -eq 1 ] || { echo "want one boot jar, found: ${jars[*]}"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/indexer-app"
          unzip -q "${jars[0]}" -d "${RUNNER_TEMP}/indexer-app"

      # main pushes :<sha>, which the release retags, and :latest; any other ref pushes
      # only :branch-<sha> (build-image-buildpacks.sh decides the tags per ref).
      - name: Build and push with Paketo buildpacks
        env:
          REGISTRY_HOST_IP: ${{ vars.REGISTRY_HOST_IP }}
          SHA: ${{ github.sha }}
        run: |
          .github/scripts/build-image-buildpacks.sh \
            --pod "buildpacks-indexer-${SHA:0:8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --sha "${SHA}" --ref "${GITHUB_REF}" \
            --builder builder-java-tiny --run-image run-tiny \
            --env BP_JVM_VERSION=25 \
            --env BP_OCI_SOURCE=https://github.com/kubemoot/kubemoot \
            --env BP_OCI_LICENSES=Apache-2.0 \
            --env "BP_OCI_REVISION=${SHA}" \
            "${RUNNER_TEMP}/indexer-app" "${REGISTRY}/${IMAGE_NAME}"
