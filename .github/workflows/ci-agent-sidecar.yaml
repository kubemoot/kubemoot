name: CI Agent Sidecar

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'agent-sidecar/**'
      # The sidecar builds against the operator's bus contract and the shared mesh package.
      - 'operator/pkg/bus/**'
      - 'operator/pkg/mesh/**'
      - '.golangci.yml'
      - '.github/scripts/golangci-lint.sh'
      - 'operator/Makefile'
      - '.github/scripts/go-build-static.sh'
      - '.github/workflows/build-go-binary-image.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent-sidecar/go.mod
          cache-dependency-path: agent-sidecar/go.sum

      - name: Check go.mod and go.sum are tidy
        working-directory: agent-sidecar
        env:
          GOTOOLCHAIN: local
        run: go mod tidy -diff

      - name: Vet
        working-directory: agent-sidecar
        run: go vet ./...

      # golangci-lint with the shared root .golangci.yml at the operator/Makefile pin.
      - name: Lint
        working-directory: agent-sidecar
        run: ../.github/scripts/golangci-lint.sh

      - name: Run tests
        working-directory: agent-sidecar
        run: go test -race ./...

      # The image packages this tested binary; the build pod does not compile again.
      - name: Build the static binary
        working-directory: agent-sidecar
        run: ../.github/scripts/go-build-static.sh kubemoot-agent-sidecar ./cmd/agent-sidecar/

      - name: Keep the tested binary for the image build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-sidecar-binary
          path: agent-sidecar/kubemoot-agent-sidecar
          if-no-files-found: error
          retention-days: 3

  # The operator starts the image through its entrypoint with --config; it names no binary.
  build-image:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-go-binary-image.yaml
    with:
      name: agent-sidecar
      binary: kubemoot-agent-sidecar
