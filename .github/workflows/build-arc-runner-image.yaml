name: Build ARC Runner Image

# Builds the custom homelab-runners image (stock actions-runner + libatomic1/make/jq)
# with Buildah in the cluster (build-dockerfile-image.yaml), the push path to Harbor that
# stays off Cloudflare. The homelab OpenTofu arc-runner-scale-set references the
# <runner version>-homelab tag, read from the Dockerfile's FROM line, so a base bump is a
# one-line Dockerfile change. main pushes that tag with :<sha> and :latest; a dispatch
# on another branch pushes only :branch-<sha>.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'arc-runner-image/**'
      - '.github/workflows/build-arc-runner-image.yaml'
      - '.github/workflows/build-dockerfile-image.yaml'

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      runner_tag: ${{ steps.tag.outputs.runner_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive image tag from the Dockerfile
        id: tag
        run: |
          RUNNER_VERSION=$(sed -n 's|^FROM ghcr.io/actions/actions-runner:\([^ @]*\).*|\1|p' arc-runner-image/Dockerfile | head -n 1)
          if ! echo "${RUNNER_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=arc-runner-image/Dockerfile::expected FROM ghcr.io/actions/actions-runner:<X.Y.Z>, got '${RUNNER_VERSION}'"
            exit 1
          fi
          echo "runner_tag=${RUNNER_VERSION}-homelab" >> "${GITHUB_OUTPUT}"
          echo "Image tag: ${RUNNER_VERSION}-homelab"

  build-image:
    needs: tag
    uses: ./.github/workflows/build-dockerfile-image.yaml
    with:
      name: actions-runner
      context: arc-runner-image
      license: ''
      extra_tag: ${{ needs.tag.outputs.runner_tag }}
