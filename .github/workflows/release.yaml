name: Release

on:
  push:
    branches: [main]
    paths:
      - 'operator/**'
      - '!operator/**.md'
      - '.github/scripts/retag-image.sh'
      - '.github/scripts/go-build-static.sh'
      - '.github/workflows/build-go-binary-image.yaml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

# One operator release at a time. The operator chart is not built here: Release
# Operator Chart (release-chart.yaml) runs when this workflow finishes and packages
# the chart with this release's image tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/kubemoot-operator

permissions:
  contents: read

jobs:
  # The operator's lint and tests already ran on the pull request that merged this commit. When
  # that pull request's head has exactly the files pushed here and its checks succeeded, CI does
  # not repeat them and says which pull request it relied on; in every other case (main moved,
  # no pull request, a check missing or failed, an API error) the release tests as before.
  tested:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      reason: ${{ steps.find.outputs.tested == 'true' && steps.find.outputs.reason || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the pull request that tested this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A lookup that fails says so and leaves the output empty, so the tests run.
          if out="$(bash .github/scripts/find-tested-commit.sh "${GITHUB_SHA}")"; then
            printf '%s\n' "$out" | tee -a "$GITHUB_OUTPUT"
          else
            echo "::warning::the tested-commit lookup failed; running the tests"
          fi

  ci:
    needs: tested
    uses: ./.github/workflows/ci.yaml
    with:
      tested_commit_reason: ${{ needs.tested.outputs.reason }}
    secrets: inherit

  release:
    needs: ci
    runs-on: homelab-runners
    outputs:
      release_created: ${{ steps.version.outputs.release_created }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credential is stored; the release token is minted at the step that pushes.
          persist-credentials: false
          # fetch-depth: 0 + filter=blob:none: paulhatch/semantic-version
          # needs full commit history + all tags but only reads commit
          # metadata (messages, hashes, tags), never file blobs. blob-filter
          # gives the metadata immediately and lazy-fetches file content
          # only when later steps read specific files. On the homelab ARC
          # runner this cuts the checkout from ~270s to ~10s, a ~4-min
          # saving per release run. fetch-tags=true is redundant with
          # depth=0 (which already fetches every tag) so dropped.
          fetch-depth: 0
          filter: blob:none

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@899dec57c20fafcccae4120d20bfd88e454f0a0f # v0.12.2
        with:
          tag_prefix: "v"
          force: ${{ inputs.force_release }}

      - name: Install crane
        if: steps.version.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Retag image with version
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${HARBOR_PASSWORD}" | crane auth login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          .github/scripts/retag-image.sh "${FULL_IMAGE}" "${SHA}" "${VERSION}"

      - name: Mint a release token
        id: app-token
        if: steps.version.outputs.release_created == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: kubemoot
          permission-contents: write
          permission-workflows: write

      - name: Create and push tag
        if: steps.version.outputs.release_created == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${DRY_RUN:-false}" != true ]; then
            if [ -z "${GH_APP_TOKEN:-}" ]; then
              echo "::error::no release token: the mint step did not run" >&2
              exit 1
            fi
            auth="$(printf 'x-access-token:%s' "${GH_APP_TOKEN}" | base64 -w0)"
            echo "::add-mask::${auth}"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          fi
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release candidate $TAG"
            git push origin "$TAG"
          fi
