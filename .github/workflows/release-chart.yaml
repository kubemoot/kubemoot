# Release Operator Chart: the operator chart release candidate, versions from the tags.
#
# Component releases build and tag their images and commit nothing. When one of them
# finishes, this workflow packages the operator chart from the tip of main with every
# version read from the git tags (.github/scripts/release-operator-chart.sh): its own
# next candidate version, the latest candidate of the operator and of every component
# the chart pins, and pushes it to Harbor, where Flux's OCIRepository picks it up. When
# the latest chart candidate already has those versions and chart sources, it builds
# nothing. Then the integration test runs against the deployed chart.
#
# Chart builds run one at a time. A pending run that a newer one replaces loses
# nothing: the newer run reads the tags later, so it includes every image the replaced
# run would have.
name: Release Operator Chart

on:
  workflow_run:
    # Every release whose image the operator chart pins (Release is the operator).
    workflows:
      - Release
      - Release Agent Runtime
      - Release Crew Liaison
      - Release Dashboard
      - Release Discussion Gateway
      - Release Fitness Runner
      - Release Indexer
      - Release MCP Bridge
      - Release MCP Gateway
      - Release Query Service
      - Release Test Runner
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build a chart candidate even when the latest one is current'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  chart:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: homelab-runners
    concurrency:
      group: operator-chart
      cancel-in-progress: false
    permissions:
      contents: write   # pushes the chart candidate tag
    outputs:
      released: ${{ steps.chart.outputs.released }}
      chart_version: ${{ steps.chart.outputs.chart_version }}
      test_runner: ${{ steps.chart.outputs.test_runner }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # RELEASE_TOKEN (contents+workflows write) pushes the tag even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          # Every tag and commit, no file blobs beyond the checkout: the versions come
          # from the tags.
          fetch-depth: 0
          filter: blob:none

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@5f3e78f33afb630a0eb6718dcc659a4e2ef26101 # v0.8.3

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The Harbor push combination of the chart releases: helm v3.14.0 with
          # --insecure-skip-tls-verify (newer helm refuses Harbor's http token realm).
          version: 'v3.14.0'

      - name: Package and push the chart candidate
        id: chart
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          REGISTRY: ${{ vars.REGISTRY }}
          DRY_RUN: 'false'
          FORCE: ${{ inputs.force_release || false }}
        run: |
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/release-operator-chart.sh

  # ==========================================================================
  # Integration tests run AFTER Flux reconciliation, not during the build.
  #
  # Ideally Flux Notification Controller would dispatch via the github
  # provider, but it can't extract a commit hash from OCIRepository
  # revisions (upstream bug: fluxcd/flux2#5148). As a workaround, this
  # workflow dispatches the integration-test workflow after Flux reports
  # that it applied the chart this run pushed.
  # ==========================================================================

  integration-test:
    needs: chart
    if: needs.chart.outputs.released == 'true'
    runs-on: homelab-runners
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Set up kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          # Self-hosted runner: prefer local kubeconfig if it exists and works,
          # fall back to the KUBECONFIG_DATA secret for remote runners.
          # Talos uses self-signed certs so --insecure-skip-tls-verify is needed
          # when the runner's trust store doesn't include the cluster CA.
          if [ -f "$HOME/.kube/config" ] && kubectl cluster-info --insecure-skip-tls-verify >/dev/null 2>&1; then
            kubectl config set-cluster "$(kubectl config current-context)" --insecure-skip-tls-verify=true 2>/dev/null || true
            echo "Using runner's local kubeconfig"
          elif [ -n "${KUBECONFIG_DATA}" ]; then
            mkdir -p ~/.kube
            echo "${KUBECONFIG_DATA}" > ~/.kube/config
            chmod 600 ~/.kube/config
            # Skip TLS verify for self-signed Talos cluster CA
            kubectl config set-cluster "$(kubectl config view -o jsonpath='{.clusters[0].name}')" --insecure-skip-tls-verify=true
            echo "Using KUBECONFIG_DATA secret"
          else
            echo "No kubeconfig available" && exit 1
          fi

      # State, not time: Flux must report the chart version this run pushed, not just
      # Ready, which the previous release also is until Flux sees the new chart. Flux
      # upgrades with wait on, so the workloads have rolled out once it is applied. The
      # timeout inside the script is only a safety net.
      - name: Wait for Flux to apply this chart
        id: flux
        env:
          CHART_VERSION: ${{ needs.chart.outputs.chart_version }}
        run: |
          bash .github/scripts/wait-for-operator-chart.sh "${CHART_VERSION}"

      # A newer chart is already applied: its own run dispatches the test.
      - name: Dispatch integration test
        if: steps.flux.outputs.state == 'applied'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          event-type: flux-reconciliation
          # The test runs the test-runner image this chart pins.
          client-payload: '{"chart_version": "${{ needs.chart.outputs.chart_version }}", "test_runner": "${{ needs.chart.outputs.test_runner }}"}'
