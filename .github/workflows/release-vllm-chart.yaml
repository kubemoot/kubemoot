# Release vLLM Chart: the kubemoot-vllm chart release candidate, its version from the tags.
#
# The chart references no Kubemoot image, so it releases on its own: when its sources
# change on main, this workflow packages vllm/charts/kubemoot-vllm from the tip of main,
# stamps the next vllm-chart-vX.Y.Z-rc.N version read from the git tags
# (.github/scripts/release-vllm-chart.sh), and pushes it to Harbor. When the latest
# candidate already has these chart sources, it builds nothing. Git holds 0.0.0 and
# nothing here commits a version.
#
# Chart builds run one at a time.
name: Release vLLM Chart

on:
  push:
    branches: [main]
    paths:
      - 'vllm/charts/kubemoot-vllm/**'
      - 'vllm/charts/test-kubemoot-vllm.sh'
      - 'vllm/charts/launcher_test.py'
      - '.github/scripts/release-vllm-chart.sh'
      - '.github/scripts/release-chart-lib.sh'
      - '.github/workflows/release-vllm-chart.yaml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Build a chart candidate even when the latest one is current'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  chart:
    runs-on: homelab-runners
    concurrency:
      group: vllm-chart
      cancel-in-progress: false
    permissions:
      contents: write   # pushes the chart candidate tag
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # No credential is stored; the release token is minted at the step that pushes.
          persist-credentials: false
          # Every tag and commit, no file blobs beyond the checkout: the version comes
          # from the tags.
          fetch-depth: 0
          filter: blob:none

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@899dec57c20fafcccae4120d20bfd88e454f0a0f # v0.12.2

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # The Harbor push combination of the chart releases: helm v3.14.0 with
          # --insecure-skip-tls-verify (newer helm refuses Harbor's http token realm).
          version: 'v3.14.0'

      # The plan runs the release script as a dry run, with no push credential in reach, to
      # learn whether a candidate is due; only then is the release token minted.
      - name: Plan the chart candidate
        id: plan
        env:
          DRY_RUN: 'true'
          FORCE: ${{ inputs.force_release || false }}
        run: bash .github/scripts/release-vllm-chart.sh

      - name: Mint a release token
        id: app-token
        if: steps.plan.outputs.will_release == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: kubemoot
          permission-contents: write
          permission-workflows: write

      # helm keeps its Harbor login in its config file, so the push step needs no login of
      # its own, and helm never runs beside the release token before the script moves it.
      - name: Log in to Harbor
        if: steps.plan.outputs.will_release == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          REGISTRY: ${{ vars.REGISTRY }}
        run: echo "${HARBOR_PASSWORD}" | helm registry login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin

      # The script takes GH_APP_TOKEN out of the environment before anything else runs and
      # uses it only for git push (push-token.sh).
      - name: Package and push the chart candidate
        id: chart
        if: steps.plan.outputs.will_release == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # The tag identity, as env, so no git command runs before the script moves the token.
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          REGISTRY: ${{ vars.REGISTRY }}
          DRY_RUN: 'false'
          FORCE: ${{ inputs.force_release || false }}
        run: bash .github/scripts/release-vllm-chart.sh
