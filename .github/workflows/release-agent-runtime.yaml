name: Release Agent Runtime

on:
  push:
    branches: [main]
    paths:
      - 'agent-runtime/**'
      - '!agent-runtime/**.md'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/agent-runtime

jobs:
  ci:
    uses: ./.github/workflows/ci-agent-runtime.yaml
    secrets: inherit

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate semantic version
        id: version
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "agent-runtime-v"
          major_pattern: "(BREAKING CHANGE|feat!|fix!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: true

      - name: Check if release needed
        id: check
        run: |
          echo "Current version: ${{ steps.version.outputs.version }}"
          echo "Changed: ${{ steps.version.outputs.changed }}"

          if [ "${{ steps.version.outputs.changed }}" = "true" ] || [ "${{ inputs.force_release }}" = "true" ]; then
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "Will create release agent-runtime-v${{ steps.version.outputs.version }}"
          else
            echo "release_created=false" >> $GITHUB_OUTPUT
            echo "Skipping release - no version-bumping commits since last tag"
          fi

      - name: Install crane
        if: steps.check.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Retag image with version
        if: steps.check.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${HARBOR_PASSWORD}" | crane auth login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          if crane manifest --insecure "${FULL_IMAGE}:${SHA}" >/dev/null 2>&1; then
            echo "Copying ${FULL_IMAGE}:${SHA} -> ${FULL_IMAGE}:${VERSION}"
            crane copy --insecure "${FULL_IMAGE}:${SHA}" "${FULL_IMAGE}:${VERSION}"
          elif crane manifest --insecure "${FULL_IMAGE}:latest" >/dev/null 2>&1; then
            echo "Copying ${FULL_IMAGE}:latest -> ${FULL_IMAGE}:${VERSION}"
            crane copy --insecure "${FULL_IMAGE}:latest" "${FULL_IMAGE}:${VERSION}"
          fi

      - name: Publish image to the release registry
        if: steps.check.outputs.release_created == 'true' && vars.RELEASE_REGISTRY != ''
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: bash .github/scripts/publish-release-image.sh "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version }}"

      - name: Create and push tag
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="agent-runtime-v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release Agent Runtime $TAG"
            git push origin "$TAG"
          fi

      - name: Install Helm
        if: steps.check.outputs.release_created == 'true'
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.2'

      - name: Update operator chart and push
        if: steps.check.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.version.outputs.version }}
          EDIT_KIND: component
          VALUES_KEY: agentRuntime
          IMAGE_REPO: agent-runtime
          LABEL: agent-runtime
        run: |
          echo "${HARBOR_PASSWORD}" | helm registry login --plain-http "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          bash .github/scripts/bump-operator-chart.sh

      - name: Read framework versions
        id: framework
        if: steps.check.outputs.release_created == 'true'
        run: |
          QUARKUS=$(sed -nE 's/^quarkusPlatformVersion=(.+)$/\1/p' agent-runtime/gradle.properties)
          test -n "${QUARKUS}"
          echo "quarkus=${QUARKUS}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-runtime-v${{ steps.version.outputs.version }}
          name: Kubemoot Agent Runtime v${{ steps.version.outputs.version }}
          body: |
            Kubemoot Agent Runtime v${{ steps.version.outputs.version }}

            GraalVM native image built on:
            - Quarkus ${{ steps.framework.outputs.quarkus }} (GraalVM native image)
            - LangChain4j through the quarkus-langchain4j BOM of the same Quarkus platform release

            Container image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}`

            ## Features
            - Chat completion with configurable Ollama models
            - MCP Gateway integration for tool discovery and execution
            - RAG source integration for context retrieval
            - NATS-based phased discussion protocol (advisory → evaluate → review → synthesize)
            - Kubernetes health/readiness probes

            ## Usage in AgentRuntime CRD
            ```yaml
            apiVersion: kubemoot.ai/v1alpha1
            kind: AgentRuntime
            metadata:
              name: my-agent
            spec:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
