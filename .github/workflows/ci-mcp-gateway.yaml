name: CI MCP Gateway

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'mcp-gateway/**'
      - 'config/checkstyle/**'
      - '.github/scripts/java-toolchain-version.sh'
      - '.github/workflows/build-boot-jar-image.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}
    outputs:
      java-version: ${{ steps.java.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Gradle toolchain is the one place the Java version is written.
      - name: Read the Java toolchain version
        id: java
        run: echo "version=$(.github/scripts/java-toolchain-version.sh mcp-gateway/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        working-directory: mcp-gateway
        run: ./gradlew build

      # The image packages this tested jar; the build pod does not compile again.
      - name: Keep the tested jar for the image build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-gateway-jar
          path: |
            mcp-gateway/build/libs/*.jar
            !mcp-gateway/build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 3
          # A jar is already a zip; compressing it again only costs time.
          compression-level: 0

  build-image:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-boot-jar-image.yaml
    with:
      name: mcp-gateway
      java-version: ${{ needs.test.outputs.java-version }}
