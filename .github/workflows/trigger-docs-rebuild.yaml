# Rebuild the docs site when this repository's docs change.
#
# The site (kubemoot-docs) pulls kubemoot/docs at build time, so a change here needs a
# new site build. This workflow sends kubemoot-docs a repository_dispatch event
# (kubemoot-docs-changed) carrying this commit; its Release Docs Site workflow then
# builds a new release candidate from its own unchanged main, with no commit anywhere,
# and records the kubemoot docs commit it built in the image label and the tag message.
#
# Needs repository secret DOCS_DISPATCH_TOKEN: a token allowed to send dispatch events
# to kubemoot-docs (contents: write on that repository).
name: Trigger docs rebuild

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    # Only a GitHub API call: no cluster or Harbor access, so a hosted runner.
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the docs site build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: kubemoot/kubemoot-docs
          event-type: kubemoot-docs-changed
          client-payload: '{"kubemoot_sha": "${{ github.sha }}"}'
