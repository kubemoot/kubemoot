# Publish Release: publish a tested release candidate as the public release.
#
# Every push to main builds release candidates (X.Y.Z-rc.N) into Harbor, and the
# homelab runs them. When a candidate has passed its tests and measurements, a
# maintainer runs this workflow (Actions tab, Run workflow; dispatch needs write
# access). It publishes the operator chart candidate and every component it pins,
# all together, and with them the kubemoot-vllm chart when it has a candidate that is
# not yet published (signed and attested like the operator chart, with its own tag
# vllm-chart-vX.Y.Z and its own GitHub Release):
#   candidate   exports the candidate (operator chart and the component images the
#               quickstart runs) from Harbor as a workflow artifact, and fixes which
#               candidate this run publishes (.github/scripts/export-quickstart-candidate.sh)
#   quickstart-candidate
#               runs the end-to-end quickstart on a fresh kind cluster against that
#               exported candidate, the bytes publish is about to copy. publish needs it,
#               so a candidate that fails the quickstart is never published
#   publish     copies each image by digest to the release registry under its final
#               version, packages the chart with the final version and the finals of the
#               images the candidate chart in Harbor ran, pushes it to Harbor and the
#               release registry, signs every image it publishes and the chart by
#               digest (cosign, keyless), and tags the candidates' commits with the
#               final versions (.github/scripts/publish-release.sh)
#   attest      records SLSA build provenance for each signed image and the chart, in
#               the release registry and the repository's attestations
#   quickstart  runs the quickstart against the chart just published (a second check, of
#               what the public registry serves)
#   release     writes the GitHub Release from the conventional commits since the
#               previous release, with the provenance of every artifact the release
#               signed attached as kubemoot_<version>.intoto.jsonl: created as a draft,
#               given the file, then published, since releases are immutable once
#               published (.github/scripts/create-github-releases.sh)
#   dispatch    asks kubemoot/crews, kubemoot/kmctl and kubemoot/vscode-crewforge to build
#               new candidates, which take the finals just published (repository_dispatch
#               kubemoot-published); publishing them stays a Publish Release run in each
#   release-status
#               writes the release status of the six public repositories to the run summary
#               and warns for each one that still holds unpublished breaking changes
#               (.github/scripts/release-status.sh); the clients still do right after the
#               dispatch, until their own Publish Release runs
# The candidate and quickstart-candidate jobs also run in a dry run, so the approval to
# publish comes with the quickstart's verdict on the candidate. The exported candidate is
# a workflow artifact kept for 1 day (the images of an unpublished candidate are
# downloadable by anyone who can read the run, so it is not kept longer), overwritten by a
# rerun of the candidate job. "Re-run failed jobs" after a quickstart-candidate failure
# reuses the artifact while it exists; after a day, or when the cause was in the exported
# bytes, re-run all jobs or dispatch again, which exports the candidate afresh.
# The default is a dry run: it plans, reads the registries, packages the charts, and
# shows the release notes in the run summary, and publishes nothing. It signs nothing
# either, but checks that cosign runs and that the job can mint the OIDC token the
# signatures need, and prints the identity they will carry.
#
# Signing is keyless: no key is stored. The certificate of every signature and
# attestation names this workflow on main, and both live in GHCR next to the artifact:
#   cosign verify ghcr.io/kubemoot/<image>:<version> \
#     --certificate-identity https://github.com/kubemoot/kubemoot/.github/workflows/publish-release.yaml@refs/heads/main \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/kubemoot/<image>:<version> --repo kubemoot/kubemoot
# A signing failure stops publish before any tag, so no GitHub Release is written; an
# attest failure stops before the GitHub Release and "Re-run failed jobs" retries it.
#
# The chart and images are public once publish succeeds, before the quickstart runs.
# If quickstart or release fails, fix the cause and use "Re-run failed jobs": the rerun
# keeps publish's outputs and only retries the quickstart and the GitHub Release. A new
# dispatch for the same candidate is refused (its final tag exists). A release that
# fails the quickstart is fixed forward with the next candidate.
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a release-candidate tag on main (normally the operator-chart-vA.B.C-rc.N tag the homelab ran)'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: plan and package only, publish nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Harbor is reachable only in-cluster, so the candidate is exported on a homelab runner
  # and tested on a hosted one. Publishing then takes the candidate tag fixed here, so a
  # newer candidate that lands meanwhile is not published untested.
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    outputs:
      rc_tag: ${{ steps.export.outputs.rc_tag }}
      chart_version: ${{ steps.export.outputs.chart_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install crane
        run: bash .github/scripts/install-crane.sh

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@b78d1a218811e2a0376eed26240451b2f353f367 # v0.11.4

      - name: Test the export scripts
        run: |
          bash .github/scripts/test-quickstart-images.sh
          bash .github/scripts/test-export-quickstart-candidate.sh
          bash .github/scripts/test-install-crane.sh

      - name: Log in to Harbor
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "${HARBOR_PASSWORD}" | crane auth login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin

      - name: Export the candidate
        id: export
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          REGISTRY: ${{ vars.REGISTRY }}
          OUT_DIR: quickstart-candidate
        run: bash .github/scripts/export-quickstart-candidate.sh

      - name: Keep the candidate for the quickstart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickstart-candidate
          path: quickstart-candidate/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  quickstart-candidate:
    needs: candidate
    uses: ./.github/workflows/quickstart.yaml
    with:
      candidate_tag: ${{ needs.candidate.outputs.rc_tag }}
      candidate_artifact: quickstart-candidate
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  publish:
    # Harbor is reachable only in-cluster, so publishing runs on the homelab runners,
    # and only from main, and only a candidate the quickstart passed.
    needs: [candidate, quickstart-candidate]
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
      id-token: write # cosign keyless signing of the published images and chart
    outputs:
      chart_version: ${{ steps.publish.outputs.chart_version }}
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents and workflows write) lets the final tag land on the
          # candidate's commit when workflow files changed on main after it; the default
          # token is refused there. Falls back to the default token.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          filter: blob:none

      - name: Install crane
        run: bash .github/scripts/install-crane.sh

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The Harbor push combination the chart release uses: helm v3.14.0 with
          # --insecure-skip-tls-verify (newer helm refuses Harbor's http token realm).
          version: 'v3.14.0'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@b78d1a218811e2a0376eed26240451b2f353f367 # v0.11.4

      - name: Test the release scripts
        run: |
          bash .github/scripts/test-publish-release.sh
          bash .github/scripts/test-install-crane.sh
          bash .github/scripts/test-release-status.sh

      - name: Log in to the registries
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "${HARBOR_PASSWORD}" | crane auth login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          echo "${GHCR_TOKEN}" | crane auth login "${RELEASE_REGISTRY%%/*}" -u "${GHCR_USERNAME}" --password-stdin

      - name: Publish
        id: publish
        env:
          # The candidate the quickstart passed, not "latest" again.
          RC_TAG: ${{ needs.candidate.outputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY: ${{ vars.REGISTRY }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OUT_DIR: release-files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/publish-release.sh

      - name: Release notes to the run summary
        run: |
          cat release-files/notes.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f release-files/notes-vllm.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat release-files/notes-vllm.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          retention-days: 30

  # One job per signed artifact: actions/attest pushes provenance to the registry only
  # for a single subject. GitHub-hosted, since it needs GHCR and not Harbor.
  attest:
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # sign the provenance attestation keylessly
      attestations: write # store the attestation in the repository
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.publish.outputs.subjects) }}
    steps:
      - name: Log in to the release registry
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login "${RELEASE_REGISTRY%%/*}" -u "${GHCR_USERNAME}" --password-stdin

      - name: Attest the build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true
          create-storage-record: false

      # The release job attaches this bundle to the GitHub Release; the file is named for
      # the digest, which provenance.tsv maps to the release.
      - name: Name the provenance for the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          DIGEST: ${{ matrix.subject.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/provenance"
          cp "${BUNDLE}" "${RUNNER_TEMP}/provenance/${DIGEST//:/-}.jsonl"

      - name: Keep the provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-${{ strategy.job-index }}
          path: ${{ runner.temp }}/provenance/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  quickstart:
    needs: publish
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/quickstart.yaml
    with:
      chart_version: ${{ needs.publish.outputs.chart_version }}
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  release:
    needs: [publish, attest, quickstart]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: provenance-*
          merge-multiple: true
          path: provenance

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/create-github-releases.sh release-files provenance

  # The crew charts, kmctl and CrewForge take Kubemoot's latest finals when a candidate is
  # built, so a new Kubemoot release asks each for a new candidate. Only a GitHub API call,
  # with RELEASE_TOKEN (contents write on each repository); the job's own token needs nothing.
  # Publishing those candidates is a Publish Release run in each repository.
  dispatch:
    needs: [publish, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        repository: [crews, kmctl, vscode-crewforge]
    steps:
      - name: Dispatch the candidate build
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: kubemoot/${{ matrix.repository }}
          event-type: kubemoot-published
          client-payload: '{"chart_version": "${{ needs.publish.outputs.chart_version }}"}'

  # The release status of the six public repositories, in the run summary. Report only: the
  # clients hold unpublished breaking changes until their own Publish Release runs, so a
  # failure here would fail every release. Each such repository gets a warning annotation
  # and the summary names it; a release is done when scripts/release-status.sh of the
  # umbrella repository exits 0. Runs in a dry run too, showing what is still unpublished.
  release-status:
    needs: [publish, dispatch]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Release status to the run summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          report="$(bash .github/scripts/release-status.sh --markdown)" || status=$?
          {
            echo '### Release status of the public repositories'
            echo
            echo "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Unpublished breaking changes::A public repository holds unpublished breaking changes; see the run summary. Publish it with the release."
          fi
