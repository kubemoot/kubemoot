# Publish Release: publish a tested release candidate as the public release.
#
# Every push to main builds release candidates (X.Y.Z-rc.N) into Harbor, and the
# homelab runs them. When a candidate has passed its tests and measurements, a
# maintainer runs this workflow (Actions tab, Run workflow; dispatch needs write
# access). It publishes the operator chart candidate and every component it pins,
# all together:
#   publish     copies each image by digest to the release registry under its final
#               version, packages the chart with the final version and the finals of the
#               images the candidate chart in Harbor ran, pushes it to Harbor and the
#               release registry, signs every image it publishes and the chart by
#               digest (cosign, keyless), and tags the candidates' commits with the
#               final versions (.github/scripts/publish-release.sh)
#   attest      records SLSA build provenance for each signed image and the chart, in
#               the release registry and the repository's attestations
#   quickstart  runs the quickstart against the chart just published
#   release     writes the GitHub Release from the conventional commits since the
#               previous release, with the provenance of every artifact the release
#               signed attached as kubemoot_<version>.intoto.jsonl: created as a draft,
#               given the file, then published, since releases are immutable once
#               published (.github/scripts/create-github-releases.sh)
# The default is a dry run: it plans, reads the registries, packages the charts, and
# shows the release notes in the run summary, and publishes nothing. It signs nothing
# either, but checks that cosign runs and that the job can mint the OIDC token the
# signatures need, and prints the identity they will carry.
#
# Signing is keyless: no key is stored. The certificate of every signature and
# attestation names this workflow on main, and both live in GHCR next to the artifact:
#   cosign verify ghcr.io/kubemoot/<image>:<version> \
#     --certificate-identity https://github.com/kubemoot/kubemoot/.github/workflows/publish-release.yaml@refs/heads/main \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/kubemoot/<image>:<version> --repo kubemoot/kubemoot
# A signing failure stops publish before any tag, so no GitHub Release is written; an
# attest failure stops before the GitHub Release and "Re-run failed jobs" retries it.
#
# The chart and images are public once publish succeeds, before the quickstart runs.
# If quickstart or release fails, fix the cause and use "Re-run failed jobs": the rerun
# keeps publish's outputs and only retries the quickstart and the GitHub Release. A new
# dispatch for the same candidate is refused (its final tag exists). A release that
# fails the quickstart is fixed forward with the next candidate.
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a release-candidate tag on main (normally the operator-chart-vA.B.C-rc.N tag the homelab ran)'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: plan and package only, publish nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    # Harbor is reachable only in-cluster, so publishing runs on the homelab runners,
    # and only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
      id-token: write # cosign keyless signing of the published images and chart
    outputs:
      chart_version: ${{ steps.publish.outputs.chart_version }}
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents and workflows write) lets the final tag land on the
          # candidate's commit when workflow files changed on main after it; the default
          # token is refused there. Falls back to the default token.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          filter: blob:none

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The Harbor push combination the chart release uses: helm v3.14.0 with
          # --insecure-skip-tls-verify (newer helm refuses Harbor's http token realm).
          version: 'v3.14.0'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@916e0bb62dadab8a4ee770ffb2a74e8ae414e40a # v0.9.0

      - name: Test the release scripts
        run: |
          bash .github/scripts/test-publish-release.sh

      - name: Log in to the registries
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "${HARBOR_PASSWORD}" | crane auth login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          echo "${GHCR_TOKEN}" | crane auth login "${RELEASE_REGISTRY%%/*}" -u "${GHCR_USERNAME}" --password-stdin

      - name: Publish
        id: publish
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY: ${{ vars.REGISTRY }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OUT_DIR: release-files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/publish-release.sh

      - name: Release notes to the run summary
        run: cat release-files/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release-files/
          retention-days: 30

  # One job per signed artifact: actions/attest pushes provenance to the registry only
  # for a single subject. GitHub-hosted, since it needs GHCR and not Harbor.
  attest:
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # sign the provenance attestation keylessly
      attestations: write # store the attestation in the repository
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.publish.outputs.subjects) }}
    steps:
      - name: Log in to the release registry
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login "${RELEASE_REGISTRY%%/*}" -u "${GHCR_USERNAME}" --password-stdin

      - name: Attest the build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true
          create-storage-record: false

      # The release job attaches this bundle to the GitHub Release; the file is named for
      # the digest, which provenance.tsv maps to the release.
      - name: Name the provenance for the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          DIGEST: ${{ matrix.subject.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/provenance"
          cp "${BUNDLE}" "${RUNNER_TEMP}/provenance/${DIGEST//:/-}.jsonl"

      - name: Keep the provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ strategy.job-index }}
          path: ${{ runner.temp }}/provenance/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  quickstart:
    needs: publish
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/quickstart.yaml
    with:
      chart_version: ${{ needs.publish.outputs.chart_version }}
    secrets: inherit

  release:
    needs: [publish, attest, quickstart]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release-files

      - name: Download the provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: provenance-*
          merge-multiple: true
          path: provenance

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/create-github-releases.sh release-files provenance
