# Packages a tested Spring Boot jar into an image with Paketo buildpacks and pushes it to
# Harbor. The calling workflow builds and tests the jar and uploads it as an artifact;
# this job explodes it and hands it to .github/scripts/build-image-buildpacks.sh.
name: Build Boot Jar Image

on:
  workflow_call:
    inputs:
      name:
        description: 'Short name of the component, used for the jar artifact and the build pod'
        required: true
        type: string
      java-version:
        description: 'The Java version of the project toolchain (BP_JVM_VERSION)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/${{ inputs.name }}

permissions:
  contents: read

jobs:
  build-image:
    runs-on: homelab-runners

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubectl
        uses: ./.github/actions/install-kubectl

      - name: Fetch the tested jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.name }}-jar
          path: ${{ runner.temp }}/jar

      # Buildpacks build a Spring Boot app from its exploded jar.
      - name: Explode the jar
        run: |
          jars=("${RUNNER_TEMP}"/jar/*.jar)
          [ "${#jars[@]}" -eq 1 ] || { echo "want one boot jar, found: ${jars[*]}"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/app"
          unzip -q "${jars[0]}" -d "${RUNNER_TEMP}/app"

      # main pushes :<sha>, which the release retags, and :latest; any other ref pushes
      # only :branch-<sha> (build-image-buildpacks.sh decides the tags per ref).
      - name: Build and push with Paketo buildpacks
        env:
          REGISTRY_HOST_IP: ${{ vars.REGISTRY_HOST_IP }}
          SHA: ${{ github.sha }}
          NAME: ${{ inputs.name }}
          JAVA_VERSION: ${{ inputs.java-version }}
        run: |
          .github/scripts/build-image-buildpacks.sh \
            --pod "buildpacks-${NAME}-${SHA:0:8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --sha "${SHA}" --ref "${GITHUB_REF}" \
            --builder builder-java-tiny --run-image run-tiny \
            --env "BP_JVM_VERSION=${JAVA_VERSION}" \
            --env BP_OCI_SOURCE=https://github.com/kubemoot/kubemoot \
            --env BP_OCI_LICENSES=Apache-2.0 \
            --env "BP_OCI_REVISION=${SHA}" \
            "${RUNNER_TEMP}/app" "${REGISTRY}/${IMAGE_NAME}"
