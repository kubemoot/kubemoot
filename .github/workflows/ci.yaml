# POLICY: Unit tests and image builds ONLY. No integration tests.
# Integration tests require a running cluster and must run AFTER Flux
# reconciliation — not during the CI/CD build pipeline.
name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'operator/**'
      - '.golangci.yml'
      - '.github/buildpacks/**'
      - '.github/scripts/build-image-buildpacks.sh'
      - '.github/scripts/go-build-static.sh'
      - '.github/workflows/build-go-binary-image.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Check go.mod and go.sum are tidy
        working-directory: operator
        env:
          GOTOOLCHAIN: local
        run: go mod tidy -diff

      # golangci-lint at the Makefile pin with the shared root .golangci.yml.
      - name: Lint
        working-directory: operator
        run: make lint

      - name: Run tests
        working-directory: operator
        run: make test

      # `make test` ran `manifests` and `generate` (operator/Makefile, target test),
      # which regenerate the CRDs and their chart copy, the manager role and its chart
      # copy, and zz_generated.deepcopy.go in this working tree. Generated files are
      # committed by the developer; CI only checks them and never commits.
      # Runs from the repository root: the paths below are repository-relative.
      - name: Verify generated files are committed
        run: |
          GENERATED=(operator/config/crd/bases operator/chart/kubemoot-operator/crds
                     operator/config/rbac/role.yaml operator/chart/kubemoot-operator/templates/rbac.yaml
                     operator/api/v1alpha1/zz_generated.deepcopy.go)
          drift="$(git status --porcelain -- "${GENERATED[@]}")"
          if ! crds="$(diff -rq operator/config/crd/bases operator/chart/kubemoot-operator/crds)"; then
            drift="${drift}"$'\n'"chart crds/ differs from config/crd/bases (stale or extra file?):"$'\n'"${crds}"
          fi
          if [ -z "${drift}" ]; then
            echo "Generated files match the API types"
            exit 0
          fi
          echo "::error::Generated CRDs, RBAC, or deepcopy are out of sync with operator/api. Run 'cd operator && make manifests generate' and commit the result."
          echo "${drift}"
          git diff --stat -- "${GENERATED[@]}"
          exit 1

      # The image packages this tested binary; the build pod does not compile again.
      - name: Build the static binary
        working-directory: operator
        run: ../.github/scripts/go-build-static.sh manager ./cmd/

      - name: Keep the tested binary for the image build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubemoot-operator-binary
          path: operator/manager
          if-no-files-found: error
          retention-days: 3

  fuzz:
    # Runs every Go native fuzz target (func FuzzXxx(f *testing.F)) in the operator for
    # FUZZ_TIME each, beside the tests rather than before the image build: a new input a
    # fuzzer finds fails this job without holding up a release. The seed corpora
    # (f.Add values and testdata/fuzz) already run as plain tests in `make test`.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}
    timeout-minutes: 30
    env:
      FUZZ_TIME: 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      # Targets are discovered, not listed, so a new fuzz test runs here without a
      # workflow change. Go fuzzes one target per invocation.
      - name: Fuzz each target
        working-directory: operator
        run: |
          set -euo pipefail
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "${pkg}" | grep '^Fuzz' || true); do
              echo "::group::${target} (${pkg})"
              go test -run='^$' -fuzz="^${target}\$" -fuzztime="${FUZZ_TIME}" "${pkg}"
              echo "::endgroup::"
            done
          done

      # A failing input is written under the package's testdata/fuzz/<target>/. Keep it
      # so it can be committed as a regression seed beside the fix.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: operator/**/testdata/fuzz/
          if-no-files-found: ignore

  build-image:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-go-binary-image.yaml
    with:
      name: kubemoot-operator
      binary: manager
