# POLICY: Unit tests and image builds ONLY. No integration tests.
# Integration tests require a running cluster and must run AFTER Flux
# reconciliation — not during the CI/CD build pipeline.
name: CI Agent Runtime

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'agent-runtime/**'
      - 'config/checkstyle/**'
      - '.github/buildpacks/**'
      - '.github/scripts/build-image-buildpacks.sh'
      - '.github/scripts/build-image-lib.sh'
      - '.github/scripts/check-native-libs.sh'
      - '.github/workflows/ci-agent-runtime.yaml'
  workflow_dispatch:
    inputs:
      native_check:
        description: 'Build and start the native image on the homelab runners without pushing it (for a branch before merge)'
        required: false
        default: false
        type: boolean
      mcp_endpoint:
        description: 'Required with native_check: an in-cluster MCP server (HTTP+SSE) the native binary connects to directly, e.g. http://<service>.<namespace>:8080'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/agent-runtime

permissions:
  contents: read

jobs:
  test:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: agent-runtime
        run: chmod +x gradlew

      - name: Build and test
        working-directory: agent-runtime
        run: ./gradlew build

  build-image:
    # Runs in parallel with test — pushes SHA-tagged image only.
    # The release job gates on ALL CI jobs passing before creating
    # the version tag that Flux deploys. A failed test means the
    # SHA-tagged image sits unused in Harbor.
    # A dispatch with native_check builds the same native binary and starts it
    # instead of pushing: nothing reaches Harbor and no tag is created.
    runs-on: homelab-runners
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM Community 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'
          native-image-job-reports: 'false'

      - name: Install native toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc zlib1g-dev

      - name: Grant execute permission for gradlew
        working-directory: agent-runtime
        run: chmod +x gradlew

      - name: Install kubectl and crane
        if: ${{ !inputs.native_check }}
        env:
          KUBECTL_VERSION: v1.37.1
          KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
          CRANE_VERSION: v0.20.2
          CRANE_SHA256: c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
        run: |
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -fsSL -o crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz crane && sudo mv crane /usr/local/bin/ && rm crane.tar.gz

      - name: Build native binary
        working-directory: agent-runtime
        run: |
          ./gradlew quarkusBuild \
            -Dquarkus.native.enabled=true \
            -Dquarkus.native.container-build=false \
            -Dquarkus.package.jar.enabled=false

      - name: Start the native binary (native check)
        if: ${{ inputs.native_check }}
        timeout-minutes: 3
        working-directory: agent-runtime
        env:
          MCP_ENDPOINT: ${{ inputs.mcp_endpoint }}
          QUARKUS_HTTP_PORT: '18080'
          KUBEMOOT_AGENT_NAME: native-check
          KUBEMOOT_AGENT_DESCRIPTION: native image check
        # Checks what native compilation can break (startup, MCP SDK JSON and reflection),
        # not NATS or Ollama connectivity: the binary runs without either.
        run: |
          if [ -z "${MCP_ENDPOINT}" ]; then
            echo "::error::native_check needs mcp_endpoint: the MCP client is only exercised against a live server"
            exit 1
          fi
          export KUBEMOOT_MCP_SERVERS_0__NAME=check
          export KUBEMOOT_MCP_SERVERS_0__ENDPOINT="${MCP_ENDPOINT}"
          runner=(build/*-runner)
          "./${runner[0]}" > runner.log 2>&1 &
          pid=$!
          until curl -sf "http://localhost:${QUARKUS_HTTP_PORT}/q/health/live" >/dev/null; do
            if ! kill -0 "${pid}" 2>/dev/null; then
              echo "::error::The native binary exited during startup"
              cat runner.log
              exit 1
            fi
            sleep 1
          done
          # The tools endpoint initializes the MCP client, which connects to MCP_ENDPOINT.
          if ! tools="$(curl -sf "http://localhost:${QUARKUS_HTTP_PORT}/tools")"; then
            echo "::error::The native binary did not answer /tools"
            cat runner.log
            exit 1
          fi
          kill "${pid}"
          cat runner.log
          echo "tools: ${tools}"
          count="$(printf '%s' "${tools}" | grep -o '"count":[0-9]*' | cut -d: -f2)"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::The native binary listed no tools from ${MCP_ENDPOINT}"
            exit 1
          fi
          echo "Native binary started; ${count} MCP tools listed from ${MCP_ENDPOINT}."

      # The run image must hold every shared library the binary links against; the image
      # would build and push without one and the agent pod would fail at startup.
      - name: Check the binary's libraries against the run image
        if: ${{ !inputs.native_check }}
        run: |
          runners=(agent-runtime/build/*-runner)
          [ "${#runners[@]}" -eq 1 ] || { echo "want one native binary, found: ${runners[*]}"; exit 1; }
          .github/scripts/check-native-libs.sh "${runners[0]}" run-tiny

      # The Procfile buildpack packages the binary built and checked above as it is; with
      # BP_DIRECT_PROCESS the launcher runs it without a shell. main pushes :<sha>, which
      # the release retags, and :latest; any other ref pushes only :branch-<sha>
      # (build-image-buildpacks.sh decides the tags per ref).
      - name: Build and push with Paketo buildpacks
        if: ${{ !inputs.native_check }}
        env:
          REGISTRY_HOST_IP: ${{ vars.REGISTRY_HOST_IP }}
          SHA: ${{ github.sha }}
        run: |
          app="${RUNNER_TEMP}/agent-runtime-app"
          mkdir -p "${app}"
          cp agent-runtime/build/*-runner "${app}/application"
          cp agent-runtime/src/main/buildpacks/Procfile "${app}/Procfile"
          .github/scripts/build-image-buildpacks.sh \
            --pod "buildpacks-agent-runtime-${SHA:0:8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --sha "${SHA}" --ref "${GITHUB_REF}" \
            --builder builder-java-tiny --run-image run-tiny \
            --buildpack paketo-buildpacks/procfile --buildpack paketo-buildpacks/image-labels \
            --env BP_DIRECT_PROCESS=true \
            --env BP_OCI_SOURCE=https://github.com/kubemoot/kubemoot \
            --env BP_OCI_LICENSES=Apache-2.0 \
            --env "BP_OCI_REVISION=${SHA}" \
            "${app}" "${REGISTRY}/${IMAGE_NAME}"
