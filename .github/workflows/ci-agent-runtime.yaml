# POLICY: Unit tests and image builds ONLY. No integration tests.
# Integration tests require a running cluster and must run AFTER Flux
# reconciliation - not during the CI/CD build pipeline. (Tests that start their
# own nats-server process on the runner are unit-level and run here.)
name: CI Agent Runtime

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'agent-runtime/**'
      - 'placement-core/**'
      - 'placement-service/**'
      - 'config/checkstyle/**'
      - '.github/scripts/check-native-libs.sh'
      - '.github/scripts/check-native-target.sh'
      - '.github/scripts/run-native-check.sh'
      - '.github/actions/build-agent-runtime-native/**'
      - '.github/scripts/stub-mcp-server.py'
      - '.github/workflows/ci-agent-runtime.yaml'
  workflow_dispatch:
    inputs:
      native_check:
        description: 'Build the native image and run it against a stub MCP server and its self-test, without pushing it (for a branch before merge)'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/agent-runtime

permissions:
  contents: read

jobs:
  test:
    name: agent-runtime-test
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: agent-runtime
        run: chmod +x gradlew

      # CoordinatorResumeIT, CoordinatorLeaseIT and NatsKvConsumerNamesIT run against a real nats-server process on
      # the runner (no cluster); without NATS_SERVER_BIN they skip. The binary is pinned by
      # version and checked against the SHA-256 of the project's published release.
      - name: Install nats-server
        env:
          NATS_SERVER_VERSION: v2.15.1
          NATS_SERVER_SHA256: bf5edc7b1ce98e885c368cb43a886eb148dc5d0551d99f3cf6141fb5e1954c70
        run: |
          curl -fsSL -o nats-server.tar.gz "https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          echo "${NATS_SERVER_SHA256}  nats-server.tar.gz" | sha256sum -c -
          tar -xzf nats-server.tar.gz --strip-components=1 -C "${RUNNER_TEMP}" "nats-server-${NATS_SERVER_VERSION}-linux-amd64/nats-server"
          rm nats-server.tar.gz
          "${RUNNER_TEMP}/nats-server" --version
          echo "NATS_SERVER_BIN=${RUNNER_TEMP}/nats-server" >> "${GITHUB_ENV}"

      - name: Build and test
        working-directory: agent-runtime
        run: ./gradlew build

      # A skipped integration test passes, so a missing binary would hide it. Fail instead.
      - name: Check the nats-server integration tests ran
        working-directory: agent-runtime
        run: |
          for suite in CoordinatorResumeIT CoordinatorLeaseIT NatsKvConsumerNamesIT; do
            report="build/test-results/test/TEST-ai.kubemoot.agent.nats.${suite}.xml"
            if ! grep -Eq 'tests="[1-9][0-9]*" skipped="0" failures="0" errors="0"' "${report}"; then
              echo "::error::${suite} did not run to success against nats-server (skipped, failed or missing)"
              head -c 600 "${report}" 2>/dev/null || true
              exit 1
            fi
            echo "${suite}: $(grep -Eo 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "${report}")"
          done

  # The native image is built and started on pull requests only through the native-check job,
  # and only when the change can break it: the dependencies, the native configuration, the
  # result type detection the chat REST records or the check itself. The scope job decides.
  native-scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || inputs.native_check
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether the native image needs checking
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT}" != "pull_request" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          pattern='^(agent-runtime/(build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradle/|src/main/resources/application\.properties|src/main/resources/META-INF/native-image/|src/main/java/ai/kubemoot/agent/chat/(ChatController|ResultType|NativeSelfTest)\.java)|\.github/actions/build-agent-runtime-native/|\.github/scripts/(run-native-check\.sh|stub-mcp-server\.py|check-native-target\.sh)|\.github/workflows/ci-agent-runtime\.yaml)'
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq "${pattern}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "No dependency, native configuration or self-test change: the native image is not built for this pull request."
          fi

  # Builds the native binary and runs it against a stub MCP server inside the job, with its
  # own self-test, so the check needs no cluster service and no network path to one.
  native-check:
    needs: native-scope
    if: needs.native-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the native binary
        uses: ./.github/actions/build-agent-runtime-native

      # The stub MCP server runs on the runner's Python (standard library only, 3.8 or newer);
      # the version is pinned so a runner image change cannot move it.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Checks what native compilation can break (startup, the MCP SDK's JSON and reflection,
      # result type detection, record binding), not NATS or model server connectivity: the
      # binary runs without either.
      - name: Run the native binary against a stub MCP server
        timeout-minutes: 5
        run: |
          runners=(agent-runtime/build/*-runner)
          [ "${#runners[@]}" -eq 1 ] || { echo "want one native binary, found: ${runners[*]}"; exit 1; }
          .github/scripts/run-native-check.sh "${runners[0]}"

  build-image:
    name: agent-runtime-build-image
    # Runs in parallel with test — pushes SHA-tagged image only.
    # The release job gates on ALL CI jobs passing before creating
    # the version tag that Flux deploys. A failed test means the
    # SHA-tagged image sits unused in Harbor.
    # A dispatch with native_check runs the native-check job instead: nothing
    # reaches Harbor and no tag is created.
    runs-on: homelab-runners
    if: github.event_name != 'pull_request' && !inputs.native_check

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubectl and crane
        env:
          KUBECTL_VERSION: v1.37.1
          KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
          CRANE_VERSION: v0.20.2
          CRANE_SHA256: c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
        run: |
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -fsSL -o crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz crane && sudo mv crane /usr/local/bin/ && rm crane.tar.gz

      - name: Build the native binary
        uses: ./.github/actions/build-agent-runtime-native

      - name: Set up the build helpers
        uses: kubemoot/release-actions/setup@46be10555367466d5add34c0f37dc2ae86c40af6 # v0.12.0

      # The run image must hold every shared library the binary links against; the image
      # would build and push without one and the agent pod would fail at startup. The
      # check reads the run image pin from BUILD_IMAGE_DIR, set by the step above.
      - name: Check the binary's libraries against the run image
        run: |
          runners=(agent-runtime/build/*-runner)
          [ "${#runners[@]}" -eq 1 ] || { echo "want one native binary, found: ${runners[*]}"; exit 1; }
          .github/scripts/check-native-libs.sh "${runners[0]}" run-tiny

      # The Procfile buildpack packages the binary built and checked above as it is; with
      # BP_DIRECT_PROCESS the launcher runs it without a shell. main pushes :<sha>, which
      # the release retags, and :latest; any other ref pushes only :branch-<sha>
      # (build-image-buildpacks.sh decides the tags per ref).
      - name: Build and push with Paketo buildpacks
        env:
          REGISTRY_HOST_IP: ${{ vars.REGISTRY_HOST_IP }}
          SHA: ${{ github.sha }}
        run: |
          app="${RUNNER_TEMP}/agent-runtime-app"
          mkdir -p "${app}"
          cp agent-runtime/build/*-runner "${app}/application"
          cp agent-runtime/src/main/buildpacks/Procfile "${app}/Procfile"
          "${BUILD_IMAGE_DIR}/build-image-buildpacks.sh" \
            --pod "buildpacks-agent-runtime-${SHA:0:8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --sha "${SHA}" --ref "${GITHUB_REF}" \
            --builder builder-java-tiny --run-image run-tiny \
            --buildpack paketo-buildpacks/procfile --buildpack paketo-buildpacks/image-labels \
            --env BP_DIRECT_PROCESS=true \
            --env BP_OCI_SOURCE=https://github.com/kubemoot/kubemoot \
            --env BP_OCI_LICENSES=Apache-2.0 \
            --env "BP_OCI_REVISION=${SHA}" \
            "${app}" "${REGISTRY}/${IMAGE_NAME}"
