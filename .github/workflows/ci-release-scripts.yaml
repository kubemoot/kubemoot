# Tests for the release scripts, the check that no chart or image version
# is typed in git and no workflow commits one, the test Jobs' single RBAC source and
# image placeholder, the brand copies, and the advisory ignores. Also checks that no Go
# module needs a newer Go than the Dockerfile that builds it. Not a release gate.
name: CI Release Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'operator/chart/kubemoot-operator/Chart.yaml'
      - 'operator/chart/kubemoot-operator/values.yaml'
      - 'dashboard/charts/kubemoot-dashboard/Chart.yaml'
      - 'dashboard/charts/kubemoot-dashboard/values.yaml'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '.github/assets/**'
      - 'k8s/tests/job/**'
      - 'k8s/tests/lib.sh'
      - 'k8s/tests/lib.test.sh'
      - 'k8s/tests/lib-ask.sh'
      - 'k8s/tests/lib-modelserver.sh'
      - 'k8s/tests/ask.test.sh'
      - '**/go.mod'
      - '**/Dockerfile*'
      - '**/osv-scanner.toml'
      - 'dashboard/src/lib/server/nats-object-store.ts'
      - 'agent-runtime/src/main/java/ai/kubemoot/agent/nats/DiscussionArtifacts.java'
      - 'discussion-gateway/internal/api/artifacts.go'
      - 'operator/pkg/mesh/names.go'
      - 'workspace-access/internal/envcompat/envcompat.go'
  push:
    branches-ignore: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'operator/chart/kubemoot-operator/Chart.yaml'
      - 'operator/chart/kubemoot-operator/values.yaml'
      - 'dashboard/charts/kubemoot-dashboard/Chart.yaml'
      - 'dashboard/charts/kubemoot-dashboard/values.yaml'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '.github/assets/**'
      - 'k8s/tests/job/**'
      - 'k8s/tests/lib.sh'
      - 'k8s/tests/lib.test.sh'
      - 'k8s/tests/lib-ask.sh'
      - 'k8s/tests/lib-modelserver.sh'
      - 'k8s/tests/ask.test.sh'
      - '**/go.mod'
      - '**/Dockerfile*'
      - '**/osv-scanner.toml'
      - 'dashboard/src/lib/server/nats-object-store.ts'
      - 'agent-runtime/src/main/java/ai/kubemoot/agent/nats/DiscussionArtifacts.java'
      - 'discussion-gateway/internal/api/artifacts.go'
      - 'operator/pkg/mesh/names.go'
      - 'workspace-access/internal/envcompat/envcompat.go'

permissions:
  contents: read

jobs:
  test:
    name: release-scripts-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The README lockups are copies of github.com/kubemoot/.github brand/ files;
      # brand.lock pins the commit and each copy's sha256.
      - name: Check the brand copies against brand.lock
        run: scripts/brand-sync.sh check && scripts/brand-sync.test.sh
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'
      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@b78d1a218811e2a0376eed26240451b2f353f367 # v0.11.4
      - name: Shellcheck
        run: shellcheck -x .github/scripts/*.sh k8s/tests/job/*.sh k8s/tests/lib.test.sh k8s/tests/lib-modelserver.sh k8s/tests/lib-ask.sh k8s/tests/ask.test.sh
      - name: Check every Go module against its Dockerfile builder
        run: bash .github/scripts/check-go-builder-version.sh
      # The stub MCP server test runs python3; pin it as the native check job does.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Tests
        run: |
          bash .github/scripts/test-publish-release.sh
          bash .github/scripts/test-create-github-releases.sh
          bash .github/scripts/test-wait-for-operator-chart.sh
          bash .github/scripts/test-release-vllm-chart.sh
          bash .github/scripts/test-go-build-static.sh
          bash .github/scripts/test-retag-image.sh
          bash .github/scripts/test-release-status.sh
          bash .github/scripts/test-dispatch-clients.sh
          bash .github/scripts/test-release-status-issue.sh
          bash .github/scripts/test-export-quickstart-candidate.sh
          bash .github/scripts/test-quickstart-images.sh
          bash .github/scripts/test-install-crane.sh
          bash .github/scripts/test-check-chart-triggers.sh
          bash .github/scripts/test-check-native-libs.sh
          bash .github/scripts/test-check-native-target.sh
          bash .github/scripts/test-check-go-builder-version.sh
          bash .github/scripts/test-check-release-workflow-runs.sh
          bash .github/scripts/test-stub-mcp-server.sh
          bash .github/scripts/test-run-native-check.sh
          bash .github/scripts/test-java-toolchain-version.sh
          bash .github/scripts/test-bucket-names.sh
          bash k8s/tests/job/run.test.sh
          bash k8s/tests/lib.test.sh
          bash k8s/tests/ask.test.sh
          bash .github/scripts/test-osv-ignores.sh --self
          bash .github/scripts/test-osv-ignores.sh
