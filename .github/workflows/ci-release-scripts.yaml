# Tests for the release scripts, the check that no chart or image version
# is typed in git and no workflow commits one, the test Jobs' single RBAC source and
# image placeholder, the brand copies, and the advisory ignores. Not a release gate.
name: CI Release Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/buildpacks/**'
      - '.github/workflows/**'
      - 'operator/chart/kubemoot-operator/Chart.yaml'
      - 'operator/chart/kubemoot-operator/values.yaml'
      - 'dashboard/charts/kubemoot-dashboard/Chart.yaml'
      - 'dashboard/charts/kubemoot-dashboard/values.yaml'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '.github/assets/**'
      - 'k8s/tests/job/**'
      - '**/go.mod'
      - '**/osv-scanner.toml'
  push:
    branches-ignore: [main]
    paths:
      - '.github/scripts/**'
      - '.github/buildpacks/**'
      - '.github/workflows/**'
      - 'operator/chart/kubemoot-operator/Chart.yaml'
      - 'operator/chart/kubemoot-operator/values.yaml'
      - 'dashboard/charts/kubemoot-dashboard/Chart.yaml'
      - 'dashboard/charts/kubemoot-dashboard/values.yaml'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '.github/assets/**'
      - 'k8s/tests/job/**'
      - '**/go.mod'
      - '**/osv-scanner.toml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The README lockups are copies of github.com/kubemoot/.github brand/ files;
      # brand.lock pins the commit and each copy's sha256.
      - name: Check the brand copies against brand.lock
        run: scripts/brand-sync.sh check && scripts/brand-sync.test.sh
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'
      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@916e0bb62dadab8a4ee770ffb2a74e8ae414e40a # v0.9.0
      - name: Shellcheck
        run: shellcheck -x .github/scripts/*.sh k8s/tests/job/*.sh
      - name: Tests
        run: |
          bash .github/scripts/test-publish-release.sh
          bash .github/scripts/test-create-github-releases.sh
          bash .github/scripts/test-wait-for-operator-chart.sh
          bash .github/scripts/test-build-image-buildpacks.sh
          bash .github/scripts/test-go-build-static.sh
          bash .github/scripts/test-retag-image.sh
          bash .github/scripts/test-java-toolchain-version.sh
          bash k8s/tests/job/run.test.sh
          bash .github/scripts/test-osv-ignores.sh --self
          bash .github/scripts/test-osv-ignores.sh
