# Tests for the release and promotion scripts and the brand copies. Not a release gate.
name: CI Release Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci-release-scripts.yaml'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '.github/assets/**'
  push:
    branches-ignore: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci-release-scripts.yaml'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '.github/assets/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The README lockups are copies of github.com/kubemoot/.github brand/ files;
      # brand.lock pins the commit and each copy's sha256.
      - name: Check the brand copies against brand.lock
        run: scripts/brand-sync.sh check && scripts/brand-sync.test.sh
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@76c35a749b9db4105e73307b91b8f7cf1359b755 # v0.4.0
      - name: Shellcheck
        run: shellcheck -x .github/scripts/*.sh
      - name: Tests
        run: |
          bash .github/scripts/test-promote-release.sh
