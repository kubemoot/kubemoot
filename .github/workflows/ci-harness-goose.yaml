name: CI Harness Goose

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'harness-shim/**'
      # The conformance test drives the shim with the sidecar's own turn client.
      - 'agent-sidecar/internal/a2a/**'
      - '.golangci.yml'
      - '.github/scripts/golangci-lint.sh'
      - 'operator/Makefile'
      - '.github/workflows/build-paketo-image.yaml'
      - '.github/scripts/paketo-build-args.sh'
      - '.github/scripts/go-build-static.sh'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: harness-goose-test
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: harness-shim/go.mod
          # The shim has no dependencies; the conformance test builds in the sidecar module.
          cache-dependency-path: agent-sidecar/go.sum

      - name: Check go.mod is tidy
        working-directory: harness-shim
        env:
          GOTOOLCHAIN: local
        run: go mod tidy -diff

      - name: Vet
        working-directory: harness-shim
        run: go vet ./...

      - name: Lint
        working-directory: harness-shim
        run: ../.github/scripts/golangci-lint.sh

      - name: Run tests
        working-directory: harness-shim
        run: go test ./...

      # The shim, with a fake goose, answers the sidecar's real A2A client.
      - name: Run the conformance test against the sidecar's turn client
        working-directory: agent-sidecar
        run: go test -run 'TheHarnessShim' ./internal/a2a/

      - name: Test the goose download and the image files
        run: bash harness-shim/test-fetch-goose.sh

      # The statically linked shim, the pinned goose release (its sha256 is checked) and
      # the shim's goose configuration: the files the image packages.
      - name: Stage the image files
        run: harness-shim/stage-image.sh "${RUNNER_TEMP}/image-files"

      - name: Keep the staged files for the image build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-goose-image
          path: ${{ runner.temp }}/image-files
          if-no-files-found: error
          retention-days: 3

  # The image is the shim plus the pinned goose release, packaged by the Paketo Procfile
  # buildpack from harness-shim/image/ and the files staged above.
  build-image:
    name: harness-goose-build-image
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-paketo-image.yaml
    with:
      name: harness-goose
      context: harness-shim/image
      artifact: harness-goose-image
      executables: harness-shim goose
      builder: builder-java-tiny
      # A shell and the common tools, for goose's built-in tools (nativeTools declared or
      # all); the Alpine image this replaces had a busybox shell.
      run_image: run-base
      buildpacks: paketo-buildpacks/procfile paketo-buildpacks/image-labels
