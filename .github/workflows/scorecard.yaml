name: Scorecard

# OpenSSF Scorecard rates this repository's supply-chain practices (pinned actions, token
# permissions, branch protection, signed releases, and more). Results go to the code
# scanning tab and to the public Scorecard API, which serves the README badge.
#
# Publishing to the API puts rules on this file: no workflow-level env, defaults, or write
# permissions, id-token: write only on the Scorecard job, a GitHub-hosted Ubuntu runner,
# and only the actions below in that job. https://github.com/ossf/scorecard-action
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the results published to the Scorecard API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # A read-only token (Administration: read) lets the Branch-Protection check read
          # main's protection; set by kubemoot/infra. Without it, the workflow's own token.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Keep the SARIF file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
