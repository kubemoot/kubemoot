name: Release Test Runner

on:
  push:
    branches: [main]
    paths:
      - 'k8s/tests/**'
      - '!k8s/tests/job/**'
      - '!k8s/tests/**.md'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/test-runner

permissions:
  contents: read

jobs:
  build:
    runs-on: homelab-runners
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate the release candidate version
        id: version
        uses: ./.github/actions/release-candidate-version
        with:
          tag_prefix: "test-runner-v"
          force: ${{ inputs.force_release }}

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Build and push with Kaniko
        if: steps.version.outputs.release_created == 'true'
        run: |
          SHA="${{ github.sha }}"
          VERSION="${{ steps.version.outputs.version }}"
          JOB_NAME="kaniko-test-runner-$(echo ${SHA} | cut -c1-8)-${GITHUB_RUN_NUMBER}"

          tar -C k8s/tests -czf /tmp/context.tar.gz .

          kubectl run "${JOB_NAME}" \
            --rm -i \
            --restart=Never \
            --namespace=arc-runners \
            --image=gcr.io/kaniko-project/executor:latest \
            --overrides='{
              "spec": {
                "hostAliases": [{"ip": "${{ vars.REGISTRY_HOST_IP }}", "hostnames": ["${{ vars.REGISTRY }}"]}],
                "containers": [{
                  "name": "kaniko",
                  "image": "gcr.io/kaniko-project/executor:latest",
                  "stdin": true,
                  "stdinOnce": true,
                  "args": [
                    "--context=tar://stdin",
                    "--dockerfile=Dockerfile",
                    "--label=org.opencontainers.image.source=https://github.com/kubemoot/kubemoot",
                    "--label=org.opencontainers.image.licenses=Apache-2.0",
                    "--label=org.opencontainers.image.revision='"${SHA}"'",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'"${VERSION}"'",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'"${SHA}"'",
                    "--insecure",
                    "--skip-tls-verify",
                    "--cache=false"
                  ],
                  "volumeMounts": [{"name": "docker-config", "mountPath": "/kaniko/.docker"}]
                }],
                "volumes": [{"name": "docker-config", "secret": {"secretName": "kaniko-docker-config", "items": [{"key": "config.json", "path": "config.json"}]}}]
              }
            }' < /tmp/context.tar.gz

      - name: Create and push tag
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="test-runner-v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release candidate Test Runner $TAG"
            git push origin "$TAG"
          fi

      # The operator chart pins the test-runner for its verification jobs
      # (verify.image), so each candidate moves that pin and the homelab runs it.
      - name: Install Helm
        if: steps.version.outputs.release_created == 'true'
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.2'

      - name: Update operator chart and push
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.version.outputs.version }}
          EDIT_KIND: component
          VALUES_KEY: image
          IMAGE_REPO: test-runner
          LABEL: test-runner
        run: |
          echo "${HARBOR_PASSWORD}" | helm registry login --plain-http "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          bash .github/scripts/bump-operator-chart.sh
