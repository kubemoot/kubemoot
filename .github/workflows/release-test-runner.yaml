name: Release Test Runner

on:
  push:
    branches: [main]
    paths:
      - 'k8s/tests/**'
      - '!k8s/tests/job/**'
      - '!k8s/tests/**.md'
      - '.github/scripts/retag-image.sh'
      - '.github/workflows/build-dockerfile-image.yaml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/test-runner

permissions:
  contents: read

jobs:
  # A dispatch on another branch builds only :branch-<sha>; the release job runs on main.
  build-image:
    uses: ./.github/workflows/build-dockerfile-image.yaml
    with:
      name: test-runner
      context: k8s/tests

  release:
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@6ba4d559b8ec0fe5b57b101eb7831ab48289c036 # v0.10.2
        with:
          tag_prefix: "test-runner-v"
          force: ${{ inputs.force_release }}

      - name: Install crane
        if: steps.version.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Retag image with version
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${HARBOR_PASSWORD}" | crane auth login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          .github/scripts/retag-image.sh "${FULL_IMAGE}" "${SHA}" "${VERSION}"

      - name: Create and push tag
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="test-runner-v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release candidate Test Runner $TAG"
            git push origin "$TAG"
          fi
