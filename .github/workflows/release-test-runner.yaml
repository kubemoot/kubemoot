name: Release Test Runner

on:
  push:
    branches: [main]
    paths:
      - 'k8s/tests/**'
      - '!k8s/tests/job/**'
      - '!k8s/tests/**.md'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/test-runner

jobs:
  build:
    runs-on: homelab-runners
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate semantic version
        id: version
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "test-runner-v"
          major_pattern: "(BREAKING CHANGE|feat!|fix!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: true

      - name: Check if release needed
        id: check
        run: |
          echo "Current version: ${{ steps.version.outputs.version }}"
          echo "Changed: ${{ steps.version.outputs.changed }}"

          if [ "${{ steps.version.outputs.changed }}" = "true" ] || [ "${{ inputs.force_release }}" = "true" ]; then
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "Will create release test-runner-v${{ steps.version.outputs.version }}"
          else
            echo "release_created=false" >> $GITHUB_OUTPUT
            echo "Skipping release - no version-bumping commits since last tag"
          fi

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Build and push with Kaniko
        if: steps.check.outputs.release_created == 'true'
        run: |
          SHA="${{ github.sha }}"
          VERSION="${{ steps.version.outputs.version }}"
          JOB_NAME="kaniko-test-runner-$(echo ${SHA} | cut -c1-8)-${GITHUB_RUN_NUMBER}"

          tar -C k8s/tests -czf /tmp/context.tar.gz .

          kubectl run ${JOB_NAME} \
            --rm -i \
            --restart=Never \
            --namespace=arc-runners \
            --image=gcr.io/kaniko-project/executor:latest \
            --overrides='{
              "spec": {
                "hostAliases": [{"ip": "${{ vars.REGISTRY_HOST_IP }}", "hostnames": ["${{ vars.REGISTRY }}"]}],
                "containers": [{
                  "name": "kaniko",
                  "image": "gcr.io/kaniko-project/executor:latest",
                  "stdin": true,
                  "stdinOnce": true,
                  "args": [
                    "--context=tar://stdin",
                    "--dockerfile=Dockerfile",
                    "--label=org.opencontainers.image.source=https://github.com/kubemoot/kubemoot",
                    "--label=org.opencontainers.image.licenses=Apache-2.0",
                    "--label=org.opencontainers.image.revision='"${SHA}"'",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'"${VERSION}"'",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'"${SHA}"'",
                    "--insecure",
                    "--skip-tls-verify",
                    "--cache=false"
                  ],
                  "volumeMounts": [{"name": "docker-config", "mountPath": "/kaniko/.docker"}]
                }],
                "volumes": [{"name": "docker-config", "secret": {"secretName": "kaniko-docker-config", "items": [{"key": "config.json", "path": "config.json"}]}}]
              }
            }' < /tmp/context.tar.gz

      - name: Publish image to the release registry
        if: steps.check.outputs.release_created == 'true' && vars.RELEASE_REGISTRY != ''
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: bash .github/scripts/publish-release-image.sh "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version }}"

      - name: Create and push tag
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="test-runner-v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release Test Runner $TAG"
            git push origin "$TAG"
          fi

      - name: Update test job image reference
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"

          # Update job yamls with new image version
          sed -i "s|image: .*/kubemoot/test-runner:.*|image: ghcr.io/kubemoot/test-runner:${VERSION}|" k8s/tests/job/job-smoke.yaml
          sed -i "s|image: .*/kubemoot/test-runner:.*|image: ghcr.io/kubemoot/test-runner:${VERSION}|" k8s/tests/job/job-all.yaml

          # Commit changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/tests/job/job-smoke.yaml k8s/tests/job/job-all.yaml
          git commit -m "chore: update test-runner to v${VERSION} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main || echo "Nothing to push"

      - name: Create GitHub Release
        if: steps.check.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-runner-v${{ steps.version.outputs.version }}
          name: Kubemoot Test Runner v${{ steps.version.outputs.version }}
          body: |
            Kubemoot Test Runner v${{ steps.version.outputs.version }}

            Container image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}`

            ## Usage
            ```bash
            # Run smoke test
            kubectl create -f k8s/tests/job/job-smoke.yaml

            # Run full test suite
            kubectl create -f k8s/tests/job/job-all.yaml
            ```
          draft: false
          prerelease: false
