name: Integration Test

on:
  repository_dispatch:
    types: [flux-reconciliation]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: integration-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: homelab-runners
    timeout-minutes: 10

    steps:
      - name: Log trigger context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Trigger: ${{ toJSON(github.event.client_payload) }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags name the test-runner when the dispatch does not.
          fetch-depth: 0
          filter: blob:none

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@9a88091ef5357ddf4f8d1c8a71b2c72f4cd928c5 # v0.7.0

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl
        run: |
          # Self-hosted runner: prefer local kubeconfig if it exists and works.
          # Talos uses self-signed certs so --insecure-skip-tls-verify is needed
          # when the runner's trust store doesn't include the cluster CA.
          if [ -f "$HOME/.kube/config" ] && kubectl cluster-info --insecure-skip-tls-verify >/dev/null 2>&1; then
            kubectl config set-cluster "$(kubectl config current-context)" --insecure-skip-tls-verify=true 2>/dev/null || true
            echo "Using runner's local kubeconfig"
          elif [ -n "${{ secrets.KUBECONFIG_DATA }}" ]; then
            mkdir -p ~/.kube
            echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
            chmod 600 ~/.kube/config
            # Skip TLS verify for self-signed Talos cluster CA
            kubectl config set-cluster "$(kubectl config view -o jsonpath='{.clusters[0].name}')" --insecure-skip-tls-verify=true
            echo "Using KUBECONFIG_DATA secret"
          else
            echo "No kubeconfig available" && exit 1
          fi

      # The chart under test must be the one Flux applied: a Ready HelmRelease or a
      # finished rollout can still be the previous chart. The chart release dispatches
      # this only after Flux applied its chart, so this normally returns at once; a
      # manual run tests whatever is deployed. TIMEOUT is only a safety net.
      - name: Wait for Flux to apply the chart under test
        if: github.event.client_payload.chart_version != ''
        env:
          CHART_VERSION: ${{ github.event.client_payload.chart_version }}
          TIMEOUT: '120'
        run: bash .github/scripts/wait-for-operator-chart.sh "${CHART_VERSION}"

      - name: Wait for operator rollout
        run: |
          kubectl rollout status deployment/kubemoot-operator -n kubemoot --timeout=120s

      - name: Delete previous smoke test job
        run: |
          kubectl delete job kubemoot-test-smoke -n kubemoot --ignore-not-found

      - name: Run smoke test
        # The public manifest pulls the last released test-runner from GHCR. This cluster
        # runs the release candidate the operator chart pins (verify.image), from Harbor,
        # so rewrite the reference and attach the Harbor pull secret. The chart release
        # sends the tag it pinned; a manual run takes the latest test-runner candidate.
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          TEST_RUNNER: ${{ github.event.client_payload.test_runner }}
        run: |
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          if [ -z "${TEST_RUNNER}" ]; then
            TEST_RUNNER=$(rl_latest_version test-runner-v HEAD rc)
          fi
          rl_is_version "${TEST_RUNNER}" || { echo "test-runner tag [${TEST_RUNNER}] is not a version"; exit 1; }
          pin="test-runner:${TEST_RUNNER}"
          echo "test-runner: ${REGISTRY}/kubemoot/${pin}"
          sed -e "s#image: ghcr.io/kubemoot/test-runner:.*#image: ${REGISTRY}/kubemoot/${pin}#" \
              -e 's#^      serviceAccountName: kubemoot-verify-runner$#&\n      imagePullSecrets:\n        - name: harbor-pull-secret#' \
              k8s/tests/job/job-smoke.yaml | kubectl create -f -

      - name: Wait for smoke test completion
        run: |
          kubectl wait --for=condition=complete job/kubemoot-test-smoke -n kubemoot --timeout=300s

      - name: Collect test logs
        if: always()
        run: |
          echo "=== Smoke Test Logs ==="
          kubectl logs job/kubemoot-test-smoke -n kubemoot || echo "No logs available"

      - name: Check for failure
        if: always()
        run: |
          FAILED=$(kubectl get job kubemoot-test-smoke -n kubemoot -o jsonpath='{.status.failed}' 2>/dev/null || echo "0")
          if [ "$FAILED" != "" ] && [ "$FAILED" != "0" ]; then
            echo "::error::Smoke test job failed"
            exit 1
          fi
