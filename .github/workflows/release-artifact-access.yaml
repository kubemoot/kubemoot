name: Release Artifact Access

on:
  push:
    branches: [main]
    paths:
      - 'artifact-access/**'
      - '!artifact-access/**.md'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: harbor-homelab.dijure.com
  IMAGE_NAME: kubemoot/artifact-access

jobs:
  ci:
    uses: ./.github/workflows/ci-artifact-access.yaml
    secrets: inherit

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate semantic version
        id: version
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "artifact-access-v"
          major_pattern: "(BREAKING CHANGE|feat!|fix!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: true

      - name: Check if release needed
        id: check
        run: |
          if [ "${{ steps.version.outputs.changed }}" = "true" ] || [ "${{ inputs.force_release }}" = "true" ]; then
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "Will create release artifact-access-v${{ steps.version.outputs.version }}"
          else
            echo "release_created=false" >> $GITHUB_OUTPUT
            echo "Skipping release - no version-bumping commits since last tag"
          fi

      - name: Install crane
        if: steps.check.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Retag image with version
        if: steps.check.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${HARBOR_PASSWORD}" | crane auth login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          if crane manifest --insecure "${FULL_IMAGE}:${SHA}" >/dev/null 2>&1; then
            crane copy --insecure "${FULL_IMAGE}:${SHA}" "${FULL_IMAGE}:${VERSION}"
          elif crane manifest --insecure "${FULL_IMAGE}:latest" >/dev/null 2>&1; then
            crane copy --insecure "${FULL_IMAGE}:latest" "${FULL_IMAGE}:${VERSION}"
          fi

      - name: Publish image to the release registry
        if: steps.check.outputs.release_created == 'true' && vars.RELEASE_REGISTRY != ''
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: bash .github/scripts/publish-release-image.sh "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version }}"

      - name: Create and push tag
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="artifact-access-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release Artifact Access $TAG"
            git push origin "$TAG"
          fi

      # NOTE: this image is consumed by the crews chart (code-sandbox sidecar) and
      # pinned via KubemootConfig, NOT the operator chart - so there is no
      # operator-chart bump step here. The consuming chart/KubemootConfig is
      # updated to the new digest at integration time (see the Agent Collaborative
      # Artifact Store card).

      - name: Create GitHub Release
        if: steps.check.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: artifact-access-v${{ steps.version.outputs.version }}
          name: Kubemoot Artifact Access v${{ steps.version.outputs.version }}
          body: |
            Kubemoot Artifact Access v${{ steps.version.outputs.version }}

            Collaborative-artifact data-access component. Materializer sidecar that
            streams referenced NATS Object Store blobs to a local dir for the
            no-network code sandbox; pass-by-reference so bulk data never crosses
            the discussion bus or enters an LLM context.

            Container image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}`
          draft: false
          prerelease: false
