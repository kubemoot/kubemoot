name: CI Code Sandbox

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'code-sandbox/**'
      - '.github/buildah/**'
      - '.github/scripts/build-image-buildah.sh'
      - '.github/scripts/build-image-lib.sh'
      - '.github/workflows/build-dockerfile-image.yaml'
      - '.golangci.yml'
      - '.github/scripts/golangci-lint.sh'
      - 'operator/Makefile'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: code-sandbox/go.mod
          cache-dependency-path: code-sandbox/go.sum

      - name: Check go.mod and go.sum are tidy
        working-directory: code-sandbox
        env:
          GOTOOLCHAIN: local
        run: go mod tidy -diff

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build
        working-directory: code-sandbox
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o code-sandbox ./cmd/code-sandbox/

      - name: Vet
        working-directory: code-sandbox
        run: go vet ./...

      # golangci-lint with the shared root .golangci.yml at the operator/Makefile pin.
      - name: Lint
        working-directory: code-sandbox
        run: ../.github/scripts/golangci-lint.sh

      - name: Run tests
        working-directory: code-sandbox
        run: go test ./...

  build-image:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-dockerfile-image.yaml
    with:
      name: code-sandbox
      context: code-sandbox
