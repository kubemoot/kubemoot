name: CI Code Sandbox

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'code-sandbox/**'
      - '.github/workflows/build-paketo-image.yaml'
      - '.github/scripts/paketo-build-args.sh'
      - '.github/scripts/go-build-static.sh'
      - '.golangci.yml'
      - '.github/scripts/golangci-lint.sh'
      - 'operator/Makefile'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: code-sandbox-test
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: code-sandbox/go.mod
          cache-dependency-path: code-sandbox/go.sum

      - name: Check go.mod and go.sum are tidy
        working-directory: code-sandbox
        env:
          GOTOOLCHAIN: local
        run: go mod tidy -diff

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # The image packages this tested binary; the build pod does not compile again.
      - name: Build the static binary
        working-directory: code-sandbox
        run: ../.github/scripts/go-build-static.sh code-sandbox ./cmd/code-sandbox/

      - name: Vet
        working-directory: code-sandbox
        run: go vet ./...

      # golangci-lint with the shared root .golangci.yml at the operator/Makefile pin.
      - name: Lint
        working-directory: code-sandbox
        run: ../.github/scripts/golangci-lint.sh

      # Ubuntu's AppArmor refuses unprivileged user namespaces, which the confinement tests need.
      # The GitHub-hosted runner allows them for this job and requires the tests to run; the cluster
      # runners are pods without user namespaces, so the confinement tests skip there.
      - name: Allow user namespaces for the confinement tests
        if: github.event_name == 'pull_request'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        working-directory: code-sandbox
        env:
          REQUIRE_CONFINEMENT: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: go test ./...

      # The interpreter above is the Python the image pins (code-sandbox/image/buildpacks.env);
      # the runtime contract tests hold the two to the same minor version.
      - name: Keep the tested binary for the image build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-sandbox-binary
          path: code-sandbox/code-sandbox
          if-no-files-found: error
          retention-days: 3

  # The image is the tested binary on a Paketo Python image: the Python buildpacks add the
  # interpreter from code-sandbox/image/, and tini starts the server as the Procfile says.
  build-image:
    name: code-sandbox-build-image
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-paketo-image.yaml
    with:
      name: code-sandbox
      context: code-sandbox/image
      artifact: code-sandbox-binary
      executables: code-sandbox
      builder: builder
      run_image: run-base
