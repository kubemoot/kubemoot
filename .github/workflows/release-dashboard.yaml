name: Release Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '!dashboard/**.md'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/dashboard

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-dashboard.yaml
    secrets: inherit

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate the release candidate version
        id: version
        uses: ./.github/actions/release-candidate-version
        with:
          tag_prefix: "dashboard-v"
          force: ${{ inputs.force_release }}

      - name: Install crane
        if: steps.version.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Install Helm
        if: steps.version.outputs.release_created == 'true'
        uses: azure/setup-helm@v5
        with:
          version: 'v4.2.2'

      - name: Retag image with version
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${HARBOR_PASSWORD}" | crane auth login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          if crane manifest --insecure "${FULL_IMAGE}:${SHA}" >/dev/null 2>&1; then
            echo "Copying ${FULL_IMAGE}:${SHA} -> ${FULL_IMAGE}:${VERSION}"
            crane copy --insecure "${FULL_IMAGE}:${SHA}" "${FULL_IMAGE}:${VERSION}"
          elif crane manifest --insecure "${FULL_IMAGE}:latest" >/dev/null 2>&1; then
            echo "Copying ${FULL_IMAGE}:latest -> ${FULL_IMAGE}:${VERSION}"
            crane copy --insecure "${FULL_IMAGE}:latest" "${FULL_IMAGE}:${VERSION}"
          fi

      - name: Update Helm chart version
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Helm chart to version: $VERSION"

          sed -i "s/^version:.*/version: $VERSION/" dashboard/charts/kubemoot-dashboard/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: $VERSION/" dashboard/charts/kubemoot-dashboard/Chart.yaml

          echo "Updated Chart.yaml:"
          grep -E "^(version|appVersion):" dashboard/charts/kubemoot-dashboard/Chart.yaml

      - name: Package and push Helm chart
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_REGISTRY="oci://${{ env.REGISTRY }}/kubemoot/charts"

          echo "Packaging Helm chart..."
          helm package dashboard/charts/kubemoot-dashboard

          echo "Logging in to Harbor OCI registry..."
          echo "${HARBOR_PASSWORD}" | helm registry login --plain-http ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          echo "Pushing Helm chart to ${CHART_REGISTRY}..."
          helm push --plain-http kubemoot-dashboard-${VERSION}.tgz ${CHART_REGISTRY}

      - name: Commit the chart version to main and tag it
        # Re-applies only this release's chart version onto fresh main and retries a
        # rejected push (another release bot pushed first), the same pattern as
        # bump-operator-chart.sh. The tag is created only after the commit is on main,
        # so the next version is always computed from a tag main contains. Fails loudly.
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="dashboard-v$VERSION"
          CHART=dashboard/charts/kubemoot-dashboard/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          pushed=false
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            sed -i "s/^version:.*/version: $VERSION/" "$CHART"
            sed -i "s/^appVersion:.*/appVersion: $VERSION/" "$CHART"
            if ! git diff --quiet -- "$CHART"; then
              git add "$CHART"
              git commit -q -m "chore: update dashboard Helm chart to v$VERSION [skip ci]"
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "git push rejected (attempt ${attempt}/8); re-reading origin/main and retrying"
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ] || { echo "::error::could not land the dashboard chart version on main"; exit 1; }

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote"
          else
            git tag -a "$TAG" -m "Release candidate Kubemoot Dashboard $TAG"
            git push origin "refs/tags/$TAG"
          fi

      # The operator chart embeds the dashboard chart as an optional subchart (local
      # file:// dependency). Re-release it from fresh main so the operator chart carries
      # the dashboard chart committed above; the operator chart version moves, no file edit.
      - name: Re-release the operator chart with the new dashboard subchart
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.version.outputs.version }}
          EDIT_KIND: dashboard
        run: |
          echo "${HARBOR_PASSWORD}" | helm registry login --plain-http "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          bash .github/scripts/bump-operator-chart.sh

