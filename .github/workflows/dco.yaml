name: DCO

# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off (git commit -s) matching its author. https://developercertificate.org/
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$c")"
            if ! git show -s --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no 'Signed-off-by: $author'"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "Add a sign-off: git commit --amend -s --no-edit (last commit) or git rebase --signoff $BASE (all), then force-push."
            exit 1
          fi
          echo "Every commit is signed off."
