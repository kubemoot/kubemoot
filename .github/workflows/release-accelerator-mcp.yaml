name: Release Accelerator MCP

# accelerator-mcp is pinned by the operator chart as a core MCP server (acceleratorMcp
# values). Each push builds an accelerator-mcp-vX.Y.Z-rc.N image in Harbor; the chart
# release stamps the latest candidate into the chart, and Publish Release copies the
# candidate the chart was packaged with to GHCR as the final.
on:
  push:
    branches: [main]
    paths:
      - 'accelerator-mcp/**'
      - '!accelerator-mcp/**.md'
      # It builds against the operator's API types: rebuild when they change.
      - 'operator/api/**'
      - 'operator/go.mod'
      - 'operator/go.sum'
      - '.github/scripts/retag-image.sh'
      - '.github/scripts/go-build-static.sh'
      - '.github/workflows/build-go-binary-image.yaml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/accelerator-mcp

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-accelerator-mcp.yaml
    secrets: inherit

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@7accfbc33966d895bab2fc17a2a6c7f2520aaf76 # v0.11.1
        with:
          tag_prefix: "accelerator-mcp-v"
          change_path: "accelerator-mcp"
          force: ${{ inputs.force_release }}

      - name: Install crane
        if: steps.version.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      # The image this run's CI built (tagged with the commit), never another build's.
      - name: Tag the image with the version
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "${HARBOR_PASSWORD}" | crane auth login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          .github/scripts/retag-image.sh "${FULL_IMAGE}" "${GITHUB_SHA}" "${VERSION}"

      - name: Create and push tag
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="accelerator-mcp-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote"
          else
            git tag -a "${TAG}" -m "Release candidate Accelerator MCP ${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi
