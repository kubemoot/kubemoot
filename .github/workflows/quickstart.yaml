# Quickstart: the README's first five minutes, checked by CI so it cannot break unnoticed.
# GitHub-hosted runners, an empty kind cluster, nothing from the homelab: no Harbor, no
# ARC runner, no cluster secrets.
#
# Two checks, because main's release candidates live in Harbor only and a hosted runner
# cannot reach it:
#
#   manifests   every change to the quickstart, the chart or the CRDs: main's own chart
#               and CRDs against main's own quickstart manifests. It installs the
#               CRDs of the chart in the checkout on a kind cluster and has the API
#               server validate everything the quickstart applies and the chart renders
#               (a server-side dry run), so a breaking API change cannot leave the
#               manifests and the chart disagreeing. It runs no images.
#   quickstart  the whole script, end to end, against a published release: the
#               chart and the images the release pins, with the quickstart files as
#               they were at that release (the operator-chart-vX.Y.Z tag), the way a
#               stranger runs them. Publish Release calls this workflow with the chart
#               it just published, before it writes the GitHub Release. A dispatch takes
#               any published chart version (empty: the latest), and a weekly schedule
#               re-tests the latest release.
name: Quickstart

on:
  workflow_call:
    inputs:
      chart_version:
        description: 'Published chart version to test. Empty: the latest published chart.'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'quickstart/**'
      - 'operator/chart/**'
      - 'operator/api/**'
      - '.github/workflows/quickstart.yaml'
  push:
    branches: [main]
    paths:
      - 'quickstart/**'
      - 'operator/chart/**'
      - 'operator/api/**'
      - '.github/workflows/quickstart.yaml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Published chart version to test. Empty: the latest published chart.'
        required: false
        default: ''
        type: string

concurrency:
  group: quickstart-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_REGISTRY: ghcr.io/kubemoot
  # Credentials are needed only while the packages are private; empty after the flip.
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

permissions:
  contents: read

jobs:
  manifests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The chart-version tests read the release tags.
          fetch-depth: 0

      - name: Lint and test the quickstart scripts
        run: |
          shellcheck -x quickstart/quickstart.sh quickstart/chart-version.sh quickstart/chart-version.test.sh quickstart/quickstart-guard.test.sh
          bash quickstart/chart-version.test.sh
          bash quickstart/quickstart-guard.test.sh

      - name: Build the chart's dashboard subchart
        run: helm dependency build operator/chart/kubemoot-operator

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kubemoot

      - name: Install the checkout's CRDs and validate what the quickstart applies
        # A server-side dry run runs the CRD schemas and validation rules of the checkout
        # against the chart's rendered objects (the ModelServer and its catalog Model
        # included) and the hello crew. A kind that does not exist in the CRDs, or a field
        # that moved, fails here, on main, before any release.
        shell: bash
        run: |
          set -euo pipefail
          helm show crds operator/chart/kubemoot-operator | kubectl apply --server-side --force-conflicts -f -
          kubectl wait --for=condition=Established crd --all --timeout=60s
          kubectl create namespace kubemoot
          kubectl create namespace hello
          helm template kubemoot-operator operator/chart/kubemoot-operator --namespace kubemoot \
              --values quickstart/operator-values.yaml \
            | kubectl apply --server-side --dry-run=server -f -
          kubectl apply --server-side --dry-run=server -n hello \
            -f quickstart/crew/promptmodules.yaml -f quickstart/crew/agents.yaml -f quickstart/crew/crew.yaml

      - name: The quickstart crew declares no Models
        run: |
          if grep -rEl '^kind: Model$' quickstart/crew; then
            echo "the quickstart crew ships a Model; models belong in the cluster's catalog (operator-values.yaml)"
            exit 1
          fi

  quickstart:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Log in to the release registry
        if: env.GHCR_TOKEN != ''
        run: |
          echo "$GHCR_TOKEN" | docker login "${RELEASE_REGISTRY%%/*}" -u "$GHCR_USERNAME" --password-stdin
          echo "$GHCR_TOKEN" | helm registry login "${RELEASE_REGISTRY%%/*}" -u "$GHCR_USERNAME" --password-stdin

      - name: Choose the chart
        id: chart
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          ref="oci://${RELEASE_REGISTRY}/charts/kubemoot-operator"
          version="${CHART_VERSION}"
          if [ -z "$version" ]; then
            # helm resolves an OCI chart without --version to its highest final version.
            version=$(helm show chart "$ref" | sed -n 's/^version: //p')
          fi
          [ -n "$version" ] || { echo "no published chart found at $ref"; exit 1; }
          echo "Testing $ref $version"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout the release
        # The quickstart files of the release being tested, so they match its chart.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: operator-chart-v${{ steps.chart.outputs.version }}

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kubemoot

      - name: Pull the released images the chart pins and load them into kind
        # The chart names every component image; the quickstart runs up to five of them. kind
        # nodes cannot pull private packages, so the runner pulls and loads them.
        run: |
          helm template q "${{ steps.chart.outputs.ref }}" --version "${{ steps.chart.outputs.version }}" \
              --values quickstart/operator-values.yaml \
            | grep -oE "${RELEASE_REGISTRY}/(kubemoot-operator|agent-runtime|discussion-gateway|crew-liaison|dashboard):[A-Za-z0-9._-]+" \
            | sort -u | tee images.txt
          # The core three must be pinned; the dashboard and liaison are pulled when the
          # chart being tested pins them (a chart released before the dashboard subchart
          # has no dashboard image).
          for core in kubemoot-operator agent-runtime discussion-gateway; do
            grep -q "/${core}:" images.txt || { echo "the chart pins no ${core} image:"; cat images.txt; exit 1; }
          done
          while read -r image; do
            docker pull "$image"
            kind load docker-image "$image" --name kubemoot
          done < images.txt

      - name: Run the quickstart
        # Explicit bash: the default shell has no pipefail, and the tee would hide a failure.
        shell: bash
        env:
          KUBEMOOT_CHART: ${{ steps.chart.outputs.ref }}
          KUBEMOOT_CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: quickstart/quickstart.sh | tee quickstart.log

      - name: Answer to the job summary
        if: success()
        run: |
          {
            echo '### Quickstart answer'
            echo
            echo '```'
            cat images.txt
            echo '```'
            sed -n '/^--- answer ---$/,/^--------------$/p' quickstart.log | sed '1d;$d'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diag
          kubectl describe nodes > diag/nodes.txt 2>&1 || true
          kubectl get all -A > diag/all.txt 2>&1 || true
          kubectl get modelservers,models,agents,crews,promptmodules -A -o yaml > diag/kubemoot-crs.yaml 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > diag/events.txt 2>&1 || true
          kubectl logs -n kubemoot deployment/kubemoot-operator --tail=-1 > diag/operator.log 2>&1 || true
          kubectl logs -n hello -l kubemoot.ai/crew=hello --all-containers --tail=-1 --prefix > diag/crew.log 2>&1 || true
          kubectl logs -n hello deployment/hello-discussion --tail=-1 > diag/discussion-gateway.log 2>&1 || true
          kubectl logs -n ollama deployment/ollama --tail=-1 > diag/ollama.log 2>&1 || true
          kubectl logs -n kubemoot job/kubemoot-operator-nats-bootstrap > diag/nats-bootstrap.log 2>&1 || true
          kubectl describe pods -A > diag/describe-pods.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickstart-diagnostics
          path: |
            diag/
            quickstart.log
          if-no-files-found: ignore
