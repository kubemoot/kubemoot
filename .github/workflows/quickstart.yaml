# Quickstart: the README's first five minutes, run by CI so it cannot break unnoticed.
# A GitHub-hosted runner, an empty kind cluster, nothing from the homelab: no Harbor, no
# ARC runner, no cluster secrets.
#
# It installs a published chart from the release registry, the way a stranger does, so
# it tests the exact bytes a stranger pulls. main builds release candidates that live in
# Harbor only, so there is nothing public to test until a promotion: Promote Release
# calls this workflow with the chart it just published, before it writes the GitHub
# Release. A push that touches only the quickstart runs it against the latest published
# chart; a dispatch takes any published chart version (empty: the latest).
name: Quickstart

on:
  workflow_call:
    inputs:
      chart_version:
        description: 'Published chart version to test. Empty: the latest published chart.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'quickstart/**'
      - '.github/workflows/quickstart.yaml'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Published chart version to test. Empty: the latest published chart.'
        required: false
        default: ''
        type: string

concurrency:
  group: quickstart-${{ inputs.chart_version || 'latest' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_REGISTRY: ghcr.io/kubemoot
  # Credentials are needed only while the packages are private; empty after the flip.
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint the quickstart script
        run: shellcheck quickstart/quickstart.sh

      - name: Log in to the release registry
        if: env.GHCR_TOKEN != ''
        run: |
          echo "$GHCR_TOKEN" | docker login "${RELEASE_REGISTRY%%/*}" -u "$GHCR_USERNAME" --password-stdin
          echo "$GHCR_TOKEN" | helm registry login "${RELEASE_REGISTRY%%/*}" -u "$GHCR_USERNAME" --password-stdin

      - name: Choose the chart
        id: chart
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          ref="oci://${RELEASE_REGISTRY}/charts/kubemoot-operator"
          version="${CHART_VERSION}"
          if [ -z "$version" ]; then
            # helm resolves an OCI chart without --version to its highest final version.
            version=$(helm show chart "$ref" | sed -n 's/^version: //p')
          fi
          [ -n "$version" ] || { echo "no published chart found at $ref"; exit 1; }
          echo "Testing $ref $version"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubemoot

      - name: Build the chart's dashboard subchart
        # Only a checkout install needs it; a published chart carries the subchart.
        if: steps.chart.outputs.version == ''
        run: helm dependency build operator/chart/kubemoot-operator

      - name: Pull the released images the chart pins and load them into kind
        # The chart names every component image; the quickstart runs up to five of them. kind
        # nodes cannot pull private packages, so the runner pulls and loads them.
        run: |
          version_args=()
          [ -n "${{ steps.chart.outputs.version }}" ] && version_args=(--version "${{ steps.chart.outputs.version }}")
          helm template q "${{ steps.chart.outputs.ref }}" "${version_args[@]}" \
              --values quickstart/operator-values.yaml \
            | grep -oE "${RELEASE_REGISTRY}/(kubemoot-operator|agent-runtime|discussion-gateway|crew-liaison|dashboard):[A-Za-z0-9._-]+" \
            | sort -u | tee images.txt
          # The core three must be pinned; the dashboard and liaison are pulled when the
          # chart being tested pins them (a chart released before the dashboard subchart
          # has no dashboard image).
          for core in kubemoot-operator agent-runtime discussion-gateway; do
            grep -q "/${core}:" images.txt || { echo "the chart pins no ${core} image:"; cat images.txt; exit 1; }
          done
          while read -r image; do
            docker pull "$image"
            kind load docker-image "$image" --name kubemoot
          done < images.txt

      - name: Run the quickstart
        # Explicit bash: the default shell has no pipefail, and the tee would hide a failure.
        shell: bash
        env:
          KUBEMOOT_CHART: ${{ steps.chart.outputs.ref }}
          KUBEMOOT_CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: quickstart/quickstart.sh | tee quickstart.log

      - name: Answer to the job summary
        if: success()
        run: |
          {
            echo '### Quickstart answer'
            echo
            echo '```'
            cat images.txt
            echo '```'
            sed -n '/^--- answer ---$/,/^--------------$/p' quickstart.log | sed '1d;$d'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diag
          kubectl describe nodes > diag/nodes.txt 2>&1 || true
          kubectl get all -A > diag/all.txt 2>&1 || true
          kubectl get modelproviders,models,agents,crews,promptmodules -A -o yaml > diag/kubemoot-crs.yaml 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > diag/events.txt 2>&1 || true
          kubectl logs -n kubemoot deployment/kubemoot-operator --tail=-1 > diag/operator.log 2>&1 || true
          kubectl logs -n hello -l kubemoot.ai/crew=hello --all-containers --tail=-1 --prefix > diag/crew.log 2>&1 || true
          kubectl logs -n hello deployment/hello-discussion --tail=-1 > diag/discussion-gateway.log 2>&1 || true
          kubectl logs -n ollama deployment/ollama --tail=-1 > diag/ollama.log 2>&1 || true
          kubectl logs -n kubemoot job/kubemoot-operator-nats-bootstrap > diag/nats-bootstrap.log 2>&1 || true
          kubectl describe pods -A > diag/describe-pods.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quickstart-diagnostics
          path: |
            diag/
            quickstart.log
          if-no-files-found: ignore
