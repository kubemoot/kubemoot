# Render tests for the operator chart, its dashboard subchart, and the kubemoot-vllm chart. Not a release gate.
name: CI Chart

on:
  pull_request:
    paths:
      - 'operator/chart/**'
      - 'dashboard/charts/**'
      - 'vllm/charts/**'
      - '.github/workflows/ci-chart.yaml'
      # The dashboards may query only metrics this code defines (test-observability.sh).
      - 'agent-runtime/src/main/**'
      - 'operator/internal/**'
      - 'query-service/**'
  push:
    branches-ignore: [main]
    paths:
      - 'operator/chart/**'
      - 'dashboard/charts/**'
      - 'vllm/charts/**'
      - '.github/workflows/ci-chart.yaml'
      # The dashboards may query only metrics this code defines (test-observability.sh).
      - 'agent-runtime/src/main/**'
      - 'operator/internal/**'
      - 'query-service/**'

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint (defaults and quickstart values)
        run: |
          helm dependency build operator/chart/kubemoot-operator
          helm lint operator/chart/kubemoot-operator
          helm lint operator/chart/kubemoot-operator -f quickstart/operator-values.yaml
      - name: Dashboard subchart render tests
        run: operator/chart/test-dashboard-subchart.sh
      - name: Image entrypoint render tests
        run: operator/chart/test-image-entrypoints.sh
      - name: KubemootConfig image render tests
        run: operator/chart/test-kubemootconfig-images.sh
      - name: ModelServer render tests
        run: operator/chart/test-modelservers.sh
      - name: Scheduling crew render tests
        run: operator/chart/test-scheduling-crew.sh
      - name: NATS bootstrap tests
        run: operator/chart/test-nats-bootstrap.sh
      - name: Placement service render tests
        run: operator/chart/test-placement-service.sh
      - name: Secret use grant render tests
        run: operator/chart/test-secret-use-grants.sh
      - name: Network policy render tests
        run: operator/chart/test-network-policies.sh
      - name: Observability tests (dashboards and scraping)
        run: operator/chart/test-observability.sh
      - name: kubemoot-vllm chart and launcher tests
        run: vllm/charts/test-kubemoot-vllm.sh
