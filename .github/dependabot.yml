# Dependabot version updates: weekly, one grouped pull request per ecosystem.
# Commit prefixes drive the semantic version bump (chore and ci are patch bumps).
# Every pull request is reviewed by a maintainer before it merges.
#
# Node majors are bumped by hand on purpose: Dependabot does not update dashboard/.nvmrc,
# the single Node version source that the workflows read with node-version-file.
# For the same reason the docker entry ignores node majors in dashboard/Dockerfile;
# a Node major moves dashboard/.nvmrc and that image together.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directories:
      - "/.github/buildpacks"
      - "/agent-runtime/src/main/docker"
      - "/arc-runner-image"
      - "/artifact-access"
      - "/code-sandbox"
      - "/crew-liaison"
      - "/dashboard"
      - "/discussion-gateway"
      - "/fitness-runner"
      - "/indexer"
      - "/k8s/tests"
      - "/mcp-bridge"
      - "/mcp-gateway"
      - "/operator"
      - "/query-service"
      - "/scheduling-mcp"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # test-runner's kubectl (registry.k8s.io/kubectl) matches the cluster's Kubernetes
      # version and moves with a Talos upgrade, not on this schedule; Dependabot also
      # cannot read registry.k8s.io anonymously and would fail the whole Docker run.
      - dependency-name: "kubectl"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    directories:
      - "/artifact-access"
      - "/code-sandbox"
      - "/crew-liaison"
      - "/discussion-gateway"
      - "/fitness-runner"
      - "/mcp-bridge"
      - "/operator"
      - "/scheduling-mcp"
    schedule:
      interval: weekly
    # Kubernetes libraries (k8s.io/*, sigs.k8s.io/*, controller-runtime among them) get
    # their own pull request so their API migrations do not hold back low-risk bumps.
    # Dependabot puts a dependency in the first group it matches, so this group comes first.
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      gomod:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gradle
    directories:
      - "/agent-runtime"
      - "/indexer"
      - "/mcp-gateway"
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    # Shipped images use released (GA) Spring versions only: no milestone, release
    # candidate, or SNAPSHOT. Dependabot already skips pre-releases while the current
    # version is GA; these ranges also block the Spring AI 2.1.0 and Spring Boot 4.2.0
    # pre-release lines (Maven ordering puts every -M, -RC and -SNAPSHOT qualifier below the GA).
    # When the next pre-release line opens, add its range here.
    ignore:
      - dependency-name: "org.springframework.ai*"
        versions: ["[2.1.0-a0,2.1.0)"]
      - dependency-name: "org.springframework.boot*"
        versions: ["[4.2.0-a0,4.2.0)"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directories:
      - "/dashboard"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 waits for the toolchain: svelte-check peers on typescript ^5 || ^6 and
      # typescript-eslint peers on typescript <6.1.0. Lift this once both accept TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directories:
      - "/query-service"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
