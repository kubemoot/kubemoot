# The placement code (tickets, server selection, placement policies) lives in the placement-core
# library; its CDI beans are indexed from there.
quarkus.index-dependency.placement-core.group-id=ai.kubemoot
quarkus.index-dependency.placement-core.artifact-id=placement-core

# The service builds the per-agent placement state itself (one planner and demand view for each
# agent identity it serves), so the beans that exist once per agent process in agent-runtime
# are not container beans here.
quarkus.arc.exclude-types=ai.kubemoot.agent.modelserver.CallPlanner,ai.kubemoot.agent.modelserver.DemandBoard,ai.kubemoot.agent.modelserver.NatsCapacityWatch,ai.kubemoot.agent.modelserver.GpuCapacityWaiter

# Server configuration
quarkus.http.port=8080
quarkus.shutdown.timeout=30s

# Health and metrics
quarkus.smallrye-health.ui.enabled=false
quarkus.micrometer.export.prometheus.enabled=true

# jnats randomness must be created when each replica starts, not at image build time.
# NUID's process-global instance names every JetStream consumer; initialized at build time,
# every pod of the native image would start from the same NUID state and generate the same
# names, so one pod's watch consumer would collide with another's.
quarkus.native.additional-build-args=--initialize-at-run-time=io.nats.client.support.RandomUtils,--initialize-at-run-time=io.nats.client.NUID

# Logging (JSON format)
quarkus.log.console.format={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","level":"%p","logger":"%c","message":"%m"}%n
quarkus.log.category."ai.kubemoot".level=INFO

# Service settings; the chart sets the environment variables.
kubemoot.placement.nats.url=${NATS_URL:}
kubemoot.placement.nats.user=${NATS_USER:}
kubemoot.placement.nats.password=${NATS_PASSWORD:}
kubemoot.placement.holder-id=${HOSTNAME:placement-local}
kubemoot.placement.lease-seconds=${KUBEMOOT_PLACEMENT_LEASE_SECONDS:15}
kubemoot.placement.ticket-ttl-seconds=${KUBEMOOT_PLACEMENT_TICKET_TTL_SECONDS:600}
kubemoot.placement.default-policy=${KUBEMOOT_PLACEMENT_DEFAULT_POLICY:algorithm}
