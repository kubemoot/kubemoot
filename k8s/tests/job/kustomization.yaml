# Kustomization for Kubemoot Test Job
# Just RBAC - test scripts are baked into the test-runner container image
#
# Usage:
#   kubectl apply -k k8s/tests/job/           # Apply RBAC
#   kubectl create -f k8s/tests/job/job-smoke.yaml  # Run smoke test
#   kubectl create -f k8s/tests/job/job-all.yaml    # Run full test
#
# View logs:
#   kubectl logs -f job/kubemoot-test-smoke -n kubemoot
#   kubectl logs -f job/kubemoot-test-all -n kubemoot
#
# Re-run (delete old job first):
#   kubectl delete job kubemoot-test-smoke -n kubemoot --ignore-not-found && kubectl create -f k8s/tests/job/job-smoke.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubemoot

resources:
  - rbac.yaml
