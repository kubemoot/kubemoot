# RBAC for Kubemoot Test Runner Job
# Grants permissions to create/delete Kubemoot CRDs and read cluster state
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemoot-test-runner
  namespace: kubemoot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemoot-test-runner
rules:
  # Kubemoot CRDs - full access for testing
  - apiGroups: ["kubemoot.ai"]
    resources: ["*"]
    verbs: ["*"]
  # Core resources - read for verification
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Deployments - read for verification
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Leases - read which operator pod leads
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
  # Jobs - for test job management
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemoot-test-runner
subjects:
  - kind: ServiceAccount
    name: kubemoot-test-runner
    namespace: kubemoot
roleRef:
  kind: ClusterRole
  name: kubemoot-test-runner
  apiGroup: rbac.authorization.k8s.io
