# Complete Ollama Stack Example
# Creates a ModelProvider and Model for a working Ollama setup
#
# Usage:
#   kubectl apply -f ollama-complete-stack.yaml
#   kubectl get modelproviders,models -n kubemoot
#   kubectl delete -f ollama-complete-stack.yaml
---
apiVersion: kubemoot.ai/v1alpha1
kind: ModelProvider
metadata:
  name: ollama-local
  namespace: kubemoot
spec:
  type: ollama
  endpoint: http://ollama.ollama-rig0:11434
---
apiVersion: kubemoot.ai/v1alpha1
kind: Model
metadata:
  name: test-model
  namespace: kubemoot
spec:
  providerRef: ollama-local
  model: qwen2:0.5b
