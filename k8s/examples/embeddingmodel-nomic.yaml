# EmbeddingModel example using nomic-embed-text
# Requires: a ModelServer pointing to Ollama that has nomic-embed-text, or a Model
# (kmctl model add) that asks for it on one
#
# Usage:
#   kubectl apply -f embeddingmodel-nomic.yaml
#   kubectl get emb -n kubemoot
#
---
apiVersion: kubemoot.ai/v1alpha1
kind: EmbeddingModel
metadata:
  name: nomic-embed
  namespace: kubemoot
spec:
  # serverRef is optional. Leave it out and the operator binds the model to a ready
  # ModelServer whose catalog lists it (status.boundServer); set it to pin the model
  # to one ModelServer.
  # serverRef: ollama-local

  # Embedding model name
  model: nomic-embed-text

  # Vector dimensions (nomic-embed-text produces 768-dim vectors)
  dimensions: 768

  # Batch size for embedding requests
  batchSize: 32
