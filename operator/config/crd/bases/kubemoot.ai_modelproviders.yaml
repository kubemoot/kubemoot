---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelproviders.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: ModelProvider
    listKind: ModelProviderList
    plural: modelproviders
    shortNames:
    - mdlp
    singular: modelprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelProvider is the Schema for the modelproviders API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelProviderSpec defines the desired state of ModelProvider.
            properties:
              calibration:
                description: Calibration controls whether this provider may be probed
                  to measure its models
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled allows calibration probes on this provider (the default). When false,
                      the accelerator-mcp probe_model tool refuses the provider: use it for an
                      accelerator whose probe calls cost money and are not wanted.
                    type: boolean
                type: object
              endpoint:
                description: Endpoint is the Ollama API endpoint (required)
                type: string
              scheduling:
                description: Scheduling contains optional scheduling preferences for
                  this provider
                properties:
                  memoryMiB:
                    description: |-
                      MemoryMiB is the memory budget for model residency that the fit gate may
                      spend on this provider: VRAM on a GPU host, the host RAM the server may use
                      on a CPU host. It applies when the operator cannot discover the budget (no
                      DCGM metrics, scheduler disabled, or a CPU provider); a discovered value wins.
                      Unset leaves the budget unknown, and agents refuse cold loads on this provider.
                    format: int64
                    minimum: 0
                    type: integer
                  weight:
                    default: 100
                    description: |-
                      Weight is a scheduling preference (higher = preferred). Default 100.
                      Use to prefer one provider over another for non-capacity reasons.
                    type: integer
                type: object
              secretRef:
                description: SecretRef is reserved for future provider types and is
                  not used by ollama
                type: string
              type:
                description: Type specifies the provider type. Only ollama is supported
                  today.
                type: string
                x-kubernetes-validations:
                - message: only type ollama is supported today; openai and anthropic
                    are not supported yet
                  rule: self == 'ollama'
            required:
            - type
            type: object
          status:
            description: ModelProviderStatus defines the observed state of ModelProvider.
            properties:
              calibration:
                description: |-
                  Calibration is what calibration measured on this provider: per model, how
                  long it takes to load, how fast it processes prompts and generates, and
                  whether it fits the accelerator. It is recorded through the accelerator-mcp
                  tools; the scheduler does not read it yet
                properties:
                  completedAt:
                    description: CompletedAt is when the last calibration finished
                    format: date-time
                    type: string
                  engineVersion:
                    description: EngineVersion is the engine version the results were
                      measured on
                    type: string
                  message:
                    description: Message explains the phase
                    type: string
                  models:
                    description: Models holds one result per model calibrated
                    items:
                      description: |-
                        ModelCalibration is what calibration measured for one model on a provider.
                        Speeds are tokens per second, rounded down.
                      properties:
                        calibratedAt:
                          description: CalibratedAt is when this model was measured
                          format: date-time
                          type: string
                        contextLength:
                          description: ContextLength is the context the engine gives
                            the model, in tokens
                          type: integer
                        fits:
                          description: |-
                            Fits is false when the model does not fit the provider's memory: it would
                            spill to the CPU, or it is larger than the memory budget
                          type: boolean
                        generateTokensPerSecond:
                          description: GenerateTokensPerSecond is how fast one request
                            generates
                          format: int64
                          type: integer
                        loadMs:
                          description: LoadMs is how long the engine took to load
                            the model, in milliseconds
                          format: int64
                          type: integer
                        model:
                          description: Model is the model name on the provider, such
                            as qwen3:14b
                          type: string
                        parallelGenerateTokensPerSecond:
                          description: |-
                            ParallelGenerateTokensPerSecond is the total generation speed with
                            ParallelRequests running together
                          format: int64
                          type: integer
                        parallelRequests:
                          description: ParallelRequests is how many requests ran together
                            for the parallel measure
                          type: integer
                        promptTokensPerSecond:
                          description: PromptTokensPerSecond is how fast the model
                            processes a long prompt
                          format: int64
                          type: integer
                        reason:
                          description: Reason explains a model that does not fit or
                            could not be measured
                          type: string
                        residentMiB:
                          description: ResidentMiB is the accelerator memory the model
                            took once loaded
                          format: int64
                          type: integer
                      required:
                      - fits
                      - model
                      type: object
                    type: array
                  phase:
                    description: |-
                      Phase is Calibrating, Calibrated, Waiting (paused because crew calls were
                      using the provider), or Failed
                    type: string
                  resetToken:
                    description: |-
                      ResetToken is the last kubemoot.ai/calibration-reset value acted on: set when
                      the calibration it asked for starts
                    type: string
                  updatedAt:
                    description: UpdatedAt is when the calibration was last recorded,
                      in any phase
                    format: date-time
                    type: string
                type: object
              calibrationDrift:
                description: |-
                  CalibrationDrift lists the models whose crew calls, running alone on the
                  provider, generated much slower or faster than calibration measured. The
                  operator asks the scheduling crew once per drift to judge whether to
                  recalibrate; it is cleared once the speeds agree again
                properties:
                  askedAt:
                    description: AskedAt is when the scheduling crew was asked to
                      judge it
                    format: date-time
                    type: string
                  detectedAt:
                    description: DetectedAt is when the operator first saw it
                    format: date-time
                    type: string
                  key:
                    description: 'Key names this drift: the models and the calibration
                      they drifted from'
                    type: string
                  models:
                    description: Models are the models that drifted
                    items:
                      description: ModelDrift is one model's calibrated and observed
                        generation speed.
                      properties:
                        calibratedTokensPerSecond:
                          description: CalibratedTokensPerSecond is the generation
                            speed calibration measured
                          format: int64
                          type: integer
                        model:
                          description: Model is the model name on the provider
                          type: string
                        observedTokensPerSecond:
                          description: |-
                            ObservedTokensPerSecond is the median generation speed of warm crew calls
                            that ran alone on the provider since the calibration
                          format: int64
                          type: integer
                        samples:
                          description: Samples is how many such calls the median is
                            over
                          type: integer
                      required:
                      - calibratedTokensPerSecond
                      - model
                      - observedTokensPerSecond
                      - samples
                      type: object
                    type: array
                required:
                - detectedAt
                - key
                - models
                type: object
              calibrationRequest:
                description: |-
                  CalibrationRequest is the operator's last request to calibrate this provider,
                  made through the accelerator-mcp core server. The operator asks once per need
                  (a new provider, a reset, a changed engine, newly bound models), and again for
                  the same need only after the calibration paused as Waiting and the provider
                  fell idle
                properties:
                  key:
                    description: |-
                      Key names the need asked about, such as new, reset/<token>, engine/<version>,
                      or models/<digest>
                    type: string
                  reason:
                    description: Reason is the need in words
                    type: string
                  requestedAt:
                    description: RequestedAt is when the request was made
                    format: date-time
                    type: string
                required:
                - key
                - requestedAt
                type: object
              capacity:
                description: Capacity contains discovered capacity information for
                  scheduling
                properties:
                  agentCount:
                    description: |-
                      AgentCount is the total number of agent-phase bindings on this provider
                      (mulling + triage summed), for status readers and the dashboard. The
                      scheduler does not read it.
                    type: integer
                  availableModels:
                    description: |-
                      AvailableModels lists models downloaded on the provider (from /api/tags)
                      with their on-disk sizes. The JIT scheduler uses SizeBytes as a cold-load
                      footprint proxy when no loaded-model observation exists yet.
                    items:
                      description: |-
                        AvailableModel represents a model downloaded on a provider (from /api/tags).
                        Carries the on-disk size so the JIT scheduler can compute a cold-load
                        footprint estimate before the model is ever loaded into VRAM.
                      properties:
                        name:
                          description: Name is the model identifier (e.g. "qwen3:32b")
                          type: string
                        sizeBytes:
                          description: |-
                            SizeBytes is the on-disk model size in bytes (from /api/tags .size).
                            Used as a proxy for VRAM cold-load footprint when no provider has yet
                            loaded the model and no /api/ps size_vram observation exists.
                          format: int64
                          type: integer
                      required:
                      - name
                      type: object
                    type: array
                  contextLength:
                    description: |-
                      ContextLength is the context window, in tokens, the engine gives each
                      request, discovered from OLLAMA_CONTEXT_LENGTH on the Ollama pod. Zero
                      when the engine chooses its own default; the context each loaded model
                      actually runs with is on LoadedModels.
                    type: integer
                  gpuModel:
                    description: GPUModel discovered from DCGM metrics (e.g., "NVIDIA
                      GeForce RTX 5090")
                    type: string
                  lastProbed:
                    description: LastProbed is when capacity was last discovered
                    format: date-time
                    type: string
                  loadedModels:
                    description: LoadedModels from /api/ps with VRAM details
                    items:
                      description: LoadedModel represents a model currently loaded
                        in the provider
                      properties:
                        contextLength:
                          description: |-
                            ContextLength is the context window, in tokens, each request to this
                            loaded model gets (from /api/ps context_length). A prompt larger than
                            this is cut by the engine, not rejected.
                          type: integer
                        name:
                          description: Name is the model identifier
                          type: string
                        size:
                          description: Size is the total model size in bytes
                          format: int64
                          type: integer
                        sizeVram:
                          description: SizeVRAM is the VRAM used by this model in
                            bytes (from /api/ps)
                          format: int64
                          type: integer
                      required:
                      - name
                      type: object
                    type: array
                  maxParallel:
                    description: MaxParallel discovered from OLLAMA_NUM_PARALLEL env
                      var on the Ollama pod
                    type: integer
                  mullingAgentCount:
                    description: |-
                      MullingAgentCount is the number of agents whose mulling phase binds to
                      this provider (kubemoot.ai/mulling-provider label on the Agent's
                      Deployment matches this provider's name). Observability only; it does
                      not feed model selection.
                    type: integer
                  nodeName:
                    description: NodeName is the Kubernetes node hosting the Ollama
                      pod
                    type: string
                  triageAgentCount:
                    description: |-
                      TriageAgentCount is the number of agents whose triage phase binds to
                      this provider (kubemoot.ai/triage-provider label). Observability only; it does not
                      feed model selection.
                    type: integer
                  vramTotalMiB:
                    description: VRAMTotalMiB discovered from DCGM_FI_DEV_FB_TOTAL
                      via Prometheus
                    format: int64
                    type: integer
                  vramUsedMiB:
                    description: VRAMUsedMiB from sum of loaded model size_vram via
                      /api/ps
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message provides additional status information
                type: string
              phase:
                description: Phase is the current phase (Pending, Ready, Failed)
                type: string
              providerInfo:
                description: ProviderInfo contains metadata discovered after connecting
                properties:
                  lastChecked:
                    description: LastChecked is when the provider was last verified
                    type: string
                  rateLimits:
                    description: RateLimits shows current rate limit info (for cloud
                      providers)
                    properties:
                      requestsPerMinute:
                        description: RequestsPerMinute is the allowed requests per
                          minute
                        type: integer
                      requestsRemaining:
                        description: RequestsRemaining is remaining requests in current
                          window
                        type: integer
                      tokensPerMinute:
                        description: TokensPerMinute is the allowed tokens per minute
                        type: integer
                    type: object
                  version:
                    description: Version is the provider API version
                    type: string
                type: object
              ready:
                description: Ready indicates if the provider is ready
                type: boolean
              storage:
                description: |-
                  Storage is the disk the provider keeps its models on, when the operator
                  can find the volume behind the Ollama pod
                properties:
                  freeBytes:
                    description: FreeBytes is TotalBytes minus ModelBytes and PartialBytes,
                      never below zero
                    format: int64
                    type: integer
                  lastProbed:
                    description: LastProbed is when the storage was last measured
                    format: date-time
                    type: string
                  modelBytes:
                    description: ModelBytes is the sum of the sizes of the models
                      the provider lists
                    format: int64
                    type: integer
                  partialBytes:
                    description: |-
                      PartialBytes is the disk held by downloads that have not finished: pulls in
                      progress, and the partial files a cancelled or failed pull leaves behind
                      until the model server restarts. Ollama lists none of it, so the operator
                      counts it from the pulls it ran.
                    format: int64
                    type: integer
                  totalBytes:
                    description: TotalBytes is the declared capacity of the volume
                    format: int64
                    type: integer
                  volume:
                    description: Volume names the backing volume, for example "pvc/ollama-data"
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
