---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: crews.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: Crew
    listKind: CrewList
    plural: crews
    shortNames:
    - crew
    singular: crew
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.coordinatorRef
      name: Coordinator
      type: string
    - jsonPath: .status.agentCount
      name: Agents
      type: integer
    - jsonPath: .status.discussionEndpoint
      name: Discussion
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Crew is the Schema for the crews API
          A Crew groups a coordinator and tooler agents into a named team.
          It optionally deploys a discussion gateway as the crew's HTTP entry point
          for external clients (CrewForge, Homelab Pilot, curl).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CrewSpec defines the desired state of Crew
            properties:
              description:
                description: Description is a human-readable description of the crew's
                  purpose
                type: string
              discussion:
                description: Discussion configures the crew's discussion gateway
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled controls whether a discussion gateway is deployed for this crew.
                      Unset means enabled.
                    type: boolean
                  resources:
                    description: Resources defines resource requirements for the gateway
                      pod
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This is an alpha field and requires enabling the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              memory:
                description: |-
                  Memory configures the crew's working memory — facts the crew learns at
                  runtime (e.g. discovered label/topology mappings) and recalls later.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled turns crew working memory on. When false, agents neither recall
                      nor persist facts. Pointer so an explicit false is distinguishable from
                      unset (a plain bool + omitempty drops false and can't disable).
                    type: boolean
                  injectLimit:
                    default: 8
                    description: |-
                      InjectLimit caps how many facts are injected into an agent's context per
                      query. Small and SEPARATE from MaxFacts — large context degrades
                      tool-calling. Only domain+query-relevant facts are injected, up to this.
                    format: int32
                    minimum: 0
                    type: integer
                  maxFacts:
                    default: 5000
                    description: |-
                      MaxFacts is the per-crew storage cap. On write, least-recently-used facts
                      are evicted above this. Generous — facts are tiny and memory is cheap.
                    format: int32
                    minimum: 1
                    type: integer
                  ttlDays:
                    default: 365
                    description: |-
                      TTLDays is the age backstop: a fact not used/refreshed within this window
                      expires. Used facts are touched on recall, so they survive.
                    format: int32
                    minimum: 1
                    type: integer
                  verifyOnAdd:
                    default: true
                    description: |-
                      VerifyOnAdd vets a new fact against existing memory before storing —
                      skips duplicates and supersedes conflicts (same-key) rather than blindly
                      accumulating. When false, REMEMBER writes straight through. Pointer so an
                      explicit false is distinguishable from unset.
                    type: boolean
                type: object
            type: object
          status:
            description: CrewStatus defines the observed state of Crew
            properties:
              agentCount:
                description: AgentCount is the number of agents that belong to this
                  crew
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              coordinatorRef:
                description: CoordinatorRef is the name of the coordinator Agent for
                  this crew
                type: string
              discussionEndpoint:
                description: |-
                  DiscussionEndpoint is the HTTP endpoint for the discussion gateway
                  Clients POST here to start discussions and GET SSE streams
                type: string
              message:
                description: Message provides additional status information
                type: string
              phase:
                description: Phase is the crew infrastructure lifecycle (Pending,
                  Deploying, Ready, Error)
                type: string
              ready:
                description: Ready indicates if the crew is operational and can accept
                  questions
                type: boolean
              revisions:
                description: |-
                  Revisions records the crew's deployments, newest first, capped at 10.
                  The operator appends an entry when the Crew's revision annotation,
                  deployed-at annotation, or crew-version label changes.
                items:
                  description: |-
                    CrewRevision is one observed deployment of a Crew. Revision, Source, Owner,
                    Channel and DeployedAt come from the crewforge.kubemoot.ai/* annotations a
                    CrewForge deploy stamps; CrewVersion comes from the kubemoot.ai/crew-version
                    label a chart deploy stamps.
                  properties:
                    channel:
                      description: Channel is how the crew was deployed (helm, bundle,
                        flux)
                      type: string
                    crewVersion:
                      description: CrewVersion is the crew chart version from the
                        kubemoot.ai/crew-version label
                      type: string
                    deployedAt:
                      description: DeployedAt is the RFC3339 deploy time the deployer
                        stamped
                      type: string
                    observedAt:
                      description: ObservedAt is when the operator first observed
                        this revision
                      format: date-time
                      type: string
                    owner:
                      description: Owner is the email of the developer who deployed
                        the crew
                      type: string
                    revision:
                      description: Revision is the git short hash of the crew source,
                        optionally suffixed "-dirty"
                      type: string
                    source:
                      description: Source is the crew source location as repo//path
                      type: string
                  required:
                  - observedAt
                  type: object
                maxItems: 10
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
