---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: kubemootconfigs.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: KubemootConfig
    listKind: KubemootConfigList
    plural: kubemootconfigs
    shortNames:
    - wc
    singular: kubemootconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.images.indexer
      name: Indexer
      priority: 1
      type: string
    - jsonPath: .spec.images.queryService
      name: QueryService
      priority: 1
      type: string
    - jsonPath: .spec.images.agentRuntime
      name: AgentRuntime
      priority: 1
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubemootConfig is the Schema for the kubemootconfigs API
          KubemootConfig is a cluster-scoped singleton that centralizes default images
          and configuration for all Kubemoot components. It eliminates hardcoded image
          versions in operator source code and enables GitOps-friendly version management.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubemootConfigSpec defines the desired state of KubemootConfig
            properties:
              defaults:
                description: Defaults defines default configurations for Kubemoot
                  components
                properties:
                  embeddingModel:
                    default: nomic-embed
                    description: EmbeddingModel is the default EmbeddingModel CR name
                      referenced by RAGSources
                    type: string
                  imagePullSecrets:
                    description: ImagePullSecrets are the default image pull secrets
                      for all operator-managed workloads
                    items:
                      description: |-
                        LocalObjectReference contains enough information to let you locate the
                        referenced object inside the same namespace.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                  otelCollectorEndpoint:
                    description: |-
                      OTelCollectorEndpoint is the default OpenTelemetry collector endpoint for all agents
                      Agents use this as their tracing endpoint
                    type: string
                  scheduler:
                    description: Scheduler configures the GPU-aware agent scheduler
                    properties:
                      enabled:
                        description: Enabled turns on automatic agent scheduling.
                          Default false.
                        type: boolean
                      probeIntervalSeconds:
                        default: 30
                        description: ProbeIntervalSeconds is how often to probe providers
                          for capacity. Default 30.
                        type: integer
                      prometheusEndpoint:
                        description: PrometheusEndpoint for DCGM metric queries
                        type: string
                      strategy:
                        default: spread
                        description: 'Strategy is the scheduling strategy: "spread"
                          (default) or "bin-pack"'
                        enum:
                        - spread
                        - bin-pack
                        type: string
                    type: object
                  vectorStoreEndpoint:
                    description: |-
                      VectorStoreEndpoint is the default vector store endpoint for tool indexing
                      When empty, automatic tool indexing on MCPServers is disabled
                      Example: "homelab-pilot-db.homelab-pilot:5432/homelab_pilot"
                    type: string
                  vectorStoreType:
                    default: pgvector
                    description: VectorStoreType is the default vector store type
                      (pgvector, qdrant, milvus, chroma)
                    enum:
                    - pgvector
                    - qdrant
                    - milvus
                    - chroma
                    type: string
                type: object
              images:
                description: Images defines the default container images for Kubemoot
                  components
                properties:
                  agentRuntime:
                    default: ghcr.io/kubemoot/agent-runtime:latest
                    description: AgentRuntime is the default agent runtime image for
                      Agent deployments
                    type: string
                  discussionGateway:
                    default: ghcr.io/kubemoot/discussion-gateway:latest
                    description: DiscussionGateway is the default Discussion Gateway
                      image
                    type: string
                  doclingServe:
                    default: quay.io/docling-project/docling-serve-cpu:latest
                    description: DoclingServe is the docling-serve image for document
                      source RAGSource indexing
                    type: string
                  fitnessRunner:
                    default: ghcr.io/kubemoot/fitness-runner:latest
                    description: FitnessRunner is the default fitness runner image
                      for CrewFitness test jobs
                    type: string
                  indexer:
                    default: ghcr.io/kubemoot/indexer:latest
                    description: Indexer is the default indexer image for RAGSource
                      indexing jobs
                    type: string
                  mcpBridge:
                    default: ghcr.io/kubemoot/mcp-bridge:latest
                    description: McpBridge is the default MCP bridge image for stdio-to-HTTP
                      proxy injection
                    type: string
                  mcpGateway:
                    default: ghcr.io/kubemoot/mcp-gateway:latest
                    description: McpGateway is the default MCP Gateway image
                    type: string
                  queryService:
                    default: ghcr.io/kubemoot/query-service:latest
                    description: QueryService is the default query service image for
                      RAGSource
                    type: string
                type: object
            type: object
          status:
            description: KubemootConfigStatus defines the observed state of KubemootConfig
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastUpdated:
                description: LastUpdated is the timestamp of the last configuration
                  update
                format: date-time
                type: string
              message:
                description: Message provides additional status information
                type: string
              ready:
                description: Ready indicates if the configuration has been successfully
                  applied
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
