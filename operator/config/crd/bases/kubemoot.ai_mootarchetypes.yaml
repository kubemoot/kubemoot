---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: mootarchetypes.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: MootArchetype
    listKind: MootArchetypeList
    plural: mootarchetypes
    shortNames:
    - moot
    singular: mootarchetype
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.phases[*].name
      name: Phases
      type: string
    - jsonPath: .status.valid
      name: Valid
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MootArchetype declares a coordination archetype's phase vocabulary and
          state machine. Cluster-scoped — one MootArchetype CR can be referenced
          by many CrewSchedulingPolicy CRs across namespaces.

          See kubemoot/docs/scheduler-v2.md and kubemoot/docs/agentic-consensus.md
          (the consent-3 archetype's semantics).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MootArchetypeSpec defines a coordination archetype — the phase vocabulary
              and state machine that a Crew's coordinator uses to run discussions.

              Today's default archetype is "consent-3" (sociocracy 3.0): phases
              triaging → evaluating → synthesis. Future archetypes (Robert's Rules,
              debate, expert panel, devil's advocate) each define their own vocabulary
              without changing the scheduler.

              CrewSchedulingPolicy.spec.rules[].phase is validated against the active
              archetype's Phases at admission time.
            properties:
              description:
                description: Description is the human-readable explanation of this
                  archetype.
                type: string
              phases:
                description: |-
                  Phases is the ordered set of phase definitions emitted by a coordinator
                  running this archetype.
                items:
                  description: ArchetypePhase declares one phase by name plus optional
                    metadata.
                  properties:
                    description:
                      description: Description is a one-line explanation shown in
                        dashboards.
                      type: string
                    name:
                      description: |-
                        Name of the phase as emitted by the coordinator and referenced from
                        CrewSchedulingPolicy.spec.rules[].phase.
                      type: string
                    role:
                      description: |-
                        Role categorizes what the phase accomplishes (gatekeeping, deliberation,
                        closure, vote, …). Informational; the scheduler does not interpret it.
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              signals:
                description: |-
                  Signals is the set of signal types agents may emit during a discussion
                  (e.g., agree, concern, stand_aside, block, advisory). Open string set
                  — informational. The coordinator implementation interprets these.
                items:
                  type: string
                type: array
              stateMachine:
                description: |-
                  StateMachine declares the legal phase transitions. Optional; absence
                  implies sequential progression through Phases in declaration order.
                properties:
                  initial:
                    description: Initial is the name of the starting phase.
                    type: string
                  transitions:
                    description: Transitions are the legal edges of the state machine.
                    items:
                      description: PhaseTransition is one edge in the state machine.
                      properties:
                        from:
                          description: From phase name.
                          type: string
                        "on":
                          description: |-
                            On is the trigger condition (e.g., "all-triaged", "settled",
                            "majority-vote"). Informational; the coordinator interprets it.
                          type: string
                        to:
                          description: To phase name.
                          type: string
                      required:
                      - from
                      - to
                      type: object
                    minItems: 1
                    type: array
                required:
                - initial
                - transitions
                type: object
            required:
            - phases
            type: object
          status:
            description: MootArchetypeStatus reflects validation state.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message provides additional status information.
                type: string
              valid:
                description: |-
                  Valid is true when the spec parses cleanly (Phases referenced by
                  StateMachine edges all exist, no cycles in sequential interpretation).
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
