---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: skills.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: Skill
    listKind: SkillList
    plural: skills
    shortNames:
    - skill
    singular: skill
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.order
      name: Order
      type: integer
    - jsonPath: .spec.description
      name: Description
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Skill is a standalone, crew-level packaged procedure. The coordinator selects
          relevant Skills on demand (using the resume pool) and injects their ADL
          content into chosen agents just-in-time for a discussion.

          Naming note: this is NOT the removed AgentPolicy.spec.a2a.skills[] concept
          (AgentSkill, an A2A capability card). Skill is a distinct top-level kind.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SkillSpec defines the desired state of a Skill.
              A Skill is a standalone, crew-level packaged procedure that the coordinator
              selects on demand and injects into chosen agents just-in-time.
              Contrast with RAGSource (KNOW a fact) vs Skill (CARRY OUT a procedure).
            properties:
              content:
                description: |-
                  Content is the ADL body of the skill: the WHEN/THEN/ASSERT procedure
                  that gets injected into an agent's context when the skill is selected.
                minLength: 1
                type: string
              description:
                description: |-
                  Description is the relevance trigger: a concise statement of what this
                  skill does and when it applies. The coordinator reads this to decide
                  whether to select the skill for a given discussion.
                minLength: 1
                type: string
              mcpServers:
                description: |-
                  MCPServers lists MCPServer references bundled with this skill.
                  Phase 2+ only: unused in Phase 1. Declared here so the CRD schema
                  is forward-compatible without a version bump.
                items:
                  description: MCPServerRef references an MCPServer for tools
                  properties:
                    disabledTools:
                      description: Disabled tools from this server
                      items:
                        type: string
                      type: array
                    enabledTools:
                      description: Enabled tools from this server (empty = all enabled)
                      items:
                        type: string
                      type: array
                    name:
                      description: Name is the MCPServer resource name
                      type: string
                  required:
                  - name
                  type: object
                type: array
              order:
                default: 100
                description: |-
                  Order controls the position of this skill when multiple skills are
                  collected for a crew (lower = earlier). Used when sorting skills in the
                  per-crew ConfigMap and resume pool.
                format: int32
                type: integer
              ragSources:
                description: |-
                  RAGSources lists RAGSource references bundled with this skill.
                  Phase 2+ only: unused in Phase 1. Declared here so the CRD schema
                  is forward-compatible without a version bump.
                items:
                  description: RAGSourceRef references a RAGSource for knowledge retrieval
                  properties:
                    name:
                      description: Name is the RAGSource resource name
                      type: string
                    priority:
                      default: 0
                      description: Priority determines the order of retrieval (higher
                        = first)
                      format: int32
                      type: integer
                    topK:
                      default: 5
                      description: TopK is the number of results to retrieve from
                        this source
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
            required:
            - content
            - description
            type: object
          status:
            description: SkillStatus defines the observed state of a Skill.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the Skill.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
