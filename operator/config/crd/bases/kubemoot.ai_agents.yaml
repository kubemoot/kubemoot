---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agents.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - agent
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is the Schema for the agents API
          An Agent orchestrates AI models, knowledge sources, and tools
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec defines the desired state of Agent
            properties:
              capabilities:
                description: |-
                  Capabilities is the open string set of capabilities this Agent provides
                  or requires. The Scheduler v2 matches these against Model labels
                  declared via Model.metadata.labels (e.g., "capability/tool-calling")
                  through the active CrewSchedulingPolicy.spec.rules[].require/prefer
                  selectors.

                  Examples: "tool-calling", "reasoning", "kubernetes", "vision",
                  "embedding", "low-latency", "large-context".

                  Replaces Models[] in v2 — see kubemoot/docs/scheduler-v2.md.
                items:
                  type: string
                type: array
              deployment:
                description: Deployment defines how the agent is deployed
                properties:
                  env:
                    description: Env is additional environment variables
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: |-
                                    The key to select from the ConfigMap's Data field.
                                    Keys in the BinaryData field are not currently propagated to container env vars.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  image:
                    description: Image is the agent runtime image (uses default if
                      not specified)
                    type: string
                  port:
                    default: 8080
                    description: Port is the HTTP port for the agent API
                    format: int32
                    type: integer
                  replicas:
                    default: 1
                    description: Replicas is the number of agent instances
                    format: int32
                    type: integer
                  resources:
                    description: Resources defines resource requirements
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  serviceAccountName:
                    description: ServiceAccountName is the service account for the
                      agent
                    type: string
                type: object
              description:
                description: Description is a human-readable description of the agent
                type: string
              disabledTools:
                description: DisabledTools is the deny-list of MCP tools this agent
                  must not invoke.
                items:
                  type: string
                type: array
              discussChannels:
                description: |-
                  DiscussChannels are the NATS discussion channels this agent
                  subscribes to. Coordinator MUST list every channel it orchestrates
                  (e.g., kubernetes, observability, proxmox, general). Toolers
                  subscribe to channels matching their domain. Set as
                  KUBEMOOT_DISCUSS_CHANNELS env var. The agent-runtime's
                  DiscussionOrchestrator/DiscussionSubscriber requires this to be
                  non-empty in order to subscribe.
                items:
                  type: string
                type: array
              discussKeywords:
                description: |-
                  DiscussKeywords are domain keywords used to gate this agent's
                  participation in a discussion (keyword fallback when the LLM
                  advisory is unavailable). Set as KUBEMOOT_DISCUSS_KEYWORDS env var.
                items:
                  type: string
                type: array
              discussRelevance:
                description: |-
                  DiscussRelevance configures how this agent's RelevanceFilter decides
                  whether an incoming discussion message is relevant. Default mode is
                  `keyword` (literal substring match against DiscussKeywords). Use
                  `llm` for agents whose intent surface is unbounded (e.g.,
                  scheduler-advisor matching arbitrary temporal phrasings); use
                  `keyword-then-llm` to keep the cheap keyword fast-path and only
                  invoke the LLM when keywords miss.
                properties:
                  mode:
                    default: keyword
                    description: |-
                      Mode selects the relevance-decision strategy:
                        - keyword: literal substring match against Agent.spec.discussKeywords
                        - llm: call the triage model with a yes/no relevance prompt
                        - keyword-then-llm: try keyword first (cheap), fall back to LLM
                    enum:
                    - keyword
                    - llm
                    - keyword-then-llm
                    type: string
                  promptHint:
                    description: |-
                      PromptHint is an optional extra sentence appended to the LLM
                      relevance prompt to bias the model toward this agent's domain.
                      Ignored when mode=keyword. When empty, the agent's triageSummary
                      is the sole role description in the prompt.
                    type: string
                type: object
              discussRole:
                description: |-
                  DiscussRole indicates how this agent participates in discussions.
                  Common values: "tooler" (full participant), "researcher"
                  (advisory inputs only, excluded from settle triggers), "coordinator"
                  (drives the phase state machine). Free-form string.
                type: string
              enabledTools:
                description: |-
                  EnabledTools is the allow-list of MCP tools this agent may invoke.
                  When non-empty, the agent-runtime restricts tool calling to this set
                  (set as KUBEMOOT_ENABLED_TOOLS env var).
                items:
                  type: string
                type: array
              maxTokens:
                description: MaxTokens cap for LLM responses. Set as KUBEMOOT_MODEL_MAX_TOKENS.
                format: int32
                type: integer
              mcpServers:
                description: MCPServers are the MCPServer references for tools
                items:
                  description: MCPServerRef references an MCPServer for tools
                  properties:
                    disabledTools:
                      description: Disabled tools from this server
                      items:
                        type: string
                      type: array
                    enabledTools:
                      description: Enabled tools from this server (empty = all enabled)
                      items:
                        type: string
                      type: array
                    name:
                      description: Name is the MCPServer resource name
                      type: string
                  required:
                  - name
                  type: object
                type: array
              memory:
                description: Memory defines conversation memory configuration
                properties:
                  endpoint:
                    description: Endpoint is the memory backend endpoint (for redis/postgres)
                    type: string
                  maxMessages:
                    default: 100
                    description: MaxMessages is the maximum number of messages to
                      retain
                    format: int32
                    type: integer
                  maxTokens:
                    default: 4096
                    description: MaxTokens is the maximum context window to use for
                      memory
                    format: int32
                    type: integer
                  secretRef:
                    description: SecretRef references credentials for the memory backend
                    type: string
                  ttlSeconds:
                    description: TTLSeconds is how long to retain conversations (0
                      = forever)
                    format: int32
                    type: integer
                  type:
                    default: in-memory
                    description: Type is the memory backend type (in-memory, redis,
                      postgres)
                    enum:
                    - in-memory
                    - redis
                    - postgres
                    type: string
                type: object
              promptRefs:
                description: |-
                  PromptRefs is an ordered list of PromptModule names in the same
                  namespace. The operator resolves them and concatenates their content
                  into a `system.txt` file in the agent's policy ConfigMap. The
                  agent-runtime reads this at startup via KUBEMOOT_SYSTEM_PROMPT_FILE.
                items:
                  type: string
                type: array
              ragAutoDiscover:
                description: |-
                  RAGAutoDiscover configures automatic RAGSource discovery by keyword matching.
                  When enabled, RAGSources whose status.topics overlap with the agent's keywords
                  are automatically wired without explicit ragSources entries.
                properties:
                  enabled:
                    default: false
                    description: Enabled controls whether auto-discovery is active
                    type: boolean
                  keywords:
                    description: Keywords are domain keywords for matching against
                      RAGSource topics
                    items:
                      type: string
                    type: array
                  minOverlap:
                    default: 3
                    description: MinOverlap is the minimum number of matching keywords
                      to auto-wire
                    format: int32
                    type: integer
                  topK:
                    default: 2
                    description: TopK is the default topK for auto-discovered sources
                    format: int32
                    type: integer
                type: object
              ragSources:
                description: RAGSources are the RAGSource references for knowledge
                  retrieval
                items:
                  description: RAGSourceRef references a RAGSource for knowledge retrieval
                  properties:
                    name:
                      description: Name is the RAGSource resource name
                      type: string
                    priority:
                      default: 0
                      description: Priority determines the order of retrieval (higher
                        = first)
                      format: int32
                      type: integer
                    topK:
                      default: 5
                      description: TopK is the number of results to retrieve from
                        this source
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              temperature:
                description: |-
                  Temperature for LLM inference. Defaults to 0.3 (good for tool
                  calling). Set as KUBEMOOT_MODEL_TEMPERATURE env var.
                type: string
              think:
                description: |-
                  Think controls whether the model emits a reasoning chain before
                  answering (maps to ollama's request `think` flag, set as
                  KUBEMOOT_MODEL_THINK). Unset leaves the model/family default (qwen3
                  thinks by default). Set false for deterministic tool-calling agents
                  whose latency is dominated by an unneeded reasoning chain; true for
                  reasoning agents (analysts, coordinator). Behavior is declared here,
                  not special-cased in the runtime.
                type: boolean
              triageSummary:
                description: |-
                  TriageSummary is a one-line description of this agent's specialty,
                  emitted to the coordinator's triage prompt so it can decide whether
                  this agent should be invited into a discussion thread.
                type: string
              type:
                default: chat
                description: Type is the agent type (chat, task, workflow)
                enum:
                - chat
                - task
                - workflow
                type: string
            type: object
          status:
            description: AgentStatus defines the observed state of Agent
            properties:
              autoDiscoveredRAGSources:
                description: AutoDiscoveredRAGSources lists RAGSources matched via
                  auto-discovery
                items:
                  description: RAGSourceRefStatus tracks the status of a referenced
                    RAGSource
                  properties:
                    documentCount:
                      description: DocumentCount is the number of indexed documents
                      format: int32
                      type: integer
                    name:
                      description: Name is the RAGSource name
                      type: string
                    ready:
                      description: Ready indicates if the source is indexed and ready
                      type: boolean
                  required:
                  - name
                  - ready
                  type: object
                type: array
              availableReplicas:
                description: AvailableReplicas is the number of running replicas
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: Endpoint is the agent API endpoint
                type: string
              mcpServerStatus:
                description: MCPServerStatus summarizes the status of referenced MCP
                  servers
                items:
                  description: MCPServerRefStatus tracks the status of a referenced
                    MCPServer
                  properties:
                    name:
                      description: Name is the MCPServer name
                      type: string
                    ready:
                      description: Ready indicates if the server is available
                      type: boolean
                    toolCount:
                      description: ToolCount is the number of available tools
                      format: int32
                      type: integer
                  required:
                  - name
                  - ready
                  type: object
                type: array
              message:
                description: Message provides additional status information
                type: string
              phase:
                description: Phase is the current phase (Pending, Deploying, Running,
                  Error)
                type: string
              ragSourceStatus:
                description: RAGSourceStatus summarizes the status of referenced RAG
                  sources
                items:
                  description: RAGSourceRefStatus tracks the status of a referenced
                    RAGSource
                  properties:
                    documentCount:
                      description: DocumentCount is the number of indexed documents
                      format: int32
                      type: integer
                    name:
                      description: Name is the RAGSource name
                      type: string
                    ready:
                      description: Ready indicates if the source is indexed and ready
                      type: boolean
                  required:
                  - name
                  - ready
                  type: object
                type: array
              ready:
                description: Ready indicates if the agent is ready to accept requests
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
