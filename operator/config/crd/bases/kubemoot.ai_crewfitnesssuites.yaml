                  Scenarios rolls up the finished iterations per scenario, in spec order,
                  capped at 300 entries. It is kept after the per-iteration CrewFitness
                  objects are removed. The transcripts stay in the object store.
                items:
                  description: SuiteScenarioResult rolls up the finished iterations
                    of one scenario.
                  properties:
                    allPassed:
                      description: |-
                        AllPassed is the observed fact: true when every finished trial of this
                        scenario passed. Absent until a trial finishes.
                      type: boolean
                    assertionsPassed:
                      description: |-
                        AssertionsPassed and AssertionsTotal sum the assertion results of the
                        finished iterations.
                      format: int32
                      type: integer
                    assertionsTotal:
                      format: int32
                      type: integer
                    checkScenario:
                      description: |-
                        CheckScenario is true when at least three trials finished and none passed.
                        A scenario that never passes usually has a broken script or reference, not
                        an incapable crew: read the transcripts before judging the crew.
                      type: boolean
                    errored:
                      format: int32
                      type: integer
                    failed:
                      format: int32
                      type: integer
                    failureReason:
                      description: |-
                        FailureReason says in one line why a trial of this scenario did not pass
                        its gates: the message of the first failed assertion of the first failed
                        trial, or the error of the first errored one, cut to 160 characters. Absent
                        when every finished trial passed. It explains passed and failed above; it
                        is not the judge's score, which is in status.judge.scores.
                      maxLength: 160
                      type: string
                    inventedNameRuns:
                      description: |-
                        InventedNameRuns counts the finished iterations whose answer named a
                        resource that no tool result of the run held. It is a flag: no score or
                        verdict reads it. The names are in the XLSX Runs sheet.
                      format: int32
                      type: integer
                    iterations:
                      description: Iterations is how many iterations of this scenario
                        finished.
                      format: int32
                      type: integer
                    meanDurationMs:
                      description: MeanDurationMs is the mean wall-clock duration
                        of the finished iterations.
                      format: int64
                      type: integer
                    name:
                      description: Name is the script's testRef.
                      maxLength: 253
                      type: string
                    passAllK:
                      description: |-
                        PassAllK is an estimate of the chance that all k trials pass, 0 to 100, rounded: the
                        per-trial pass rate raised to k, where k is the number of finished trials
                        of this scenario. At 75% per trial and three trials it is about 42%. It
                        falls fast as k grows, so it is the number to read for a crew people rely
                        on. Absent until a trial finishes.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    passRate:
                      description: |-
                        PassRate is the share of the finished trials that passed, 0 to 100,
                        rounded. Absent until a trial finishes.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    passed:
                      description: Passed, Failed and Errored break Iterations down
                        by outcome.
                      format: int32
                      type: integer
