---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: crewfitnesssuites.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: CrewFitnessSuite
    listKind: CrewFitnessSuiteList
    plural: crewfitnesssuites
    shortNames:
    - cfs
    singular: crewfitnesssuite
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.crewRef
      name: Crew
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.iterationsCompleted
      name: Progress
      type: string
    - jsonPath: .status.iterationsTotal
      name: Total
      type: integer
    - jsonPath: .status.passed
      name: Passed
      type: integer
    - jsonPath: .status.failed
      name: Failed
      type: integer
    - jsonPath: .status.consistency.meanPassAllK
      name: PassAllK
      type: integer
    - jsonPath: .status.judge.phase
      name: Judge
      type: string
    - jsonPath: .status.judge.mean
      name: Quality
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CrewFitnessSuite drives an N-iteration sweep of a fitness script set
          against a crew, aggregates per-iteration results, and persists an
          XLSX artifact to the NATS Object Store. The artifact is downloaded
          from the kubemoot dashboard.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CrewFitnessSuiteSpec defines a fitness suite — a set of scripts to run
              N times against a crew. The reconciler creates one CrewFitness CR per
              (script × iteration) pair serially (or up to spec.concurrency in
              parallel), harvests their results, and aggregates into an XLSX artifact
              written to the NATS Object Store bucket {@code kubemoot_fitness_artifacts}.
            properties:
              artifactRetention:
                default: 168h
                description: |-
                  ArtifactRetention is the NATS Object Store TTL for the produced
                  XLSX, used only when the suite's write creates the shared bucket. The
                  bucket is shared by every suite and the install creates it with the
                  chart's limit (nats.stores.fitnessArtifacts), so an existing bucket
                  keeps that limit whatever this says. After the bucket's age the
                  artifact is auto-deleted; the CrewFitnessSuite CR's status.artifactRef
                  will still reference the (now-missing) object; downloads will 404 cleanly.
                  Default 168h (7 days).
                type: string
              cancel:
                default: false
                description: |-
                  Cancel stops the suite. When true, the operator deletes any iteration
                  still in flight (its Job follows through owner refs), starts no new
                  iteration, and moves the suite to the terminal Cancelled phase with
                  completedAt set. Results of completed iterations are kept and written
                  to the XLSX, which is marked partial; the deferred judge is skipped.
                  Cancel takes precedence over Suspend and cannot be undone. Ignored once
                  the suite is terminal. Default false.
                type: boolean
              concurrency:
                default: 1
                description: |-
                  Concurrency is the max number of CrewFitness CRs the reconciler
                  runs in parallel. Default 1 (strictly serial). Keep at 1 for
                  baseline measurements — concurrent runs share the same crew and
                  the same Ollama servers, so parallel iterations measure
                  contention more than scenario behaviour.
                format: int32
                minimum: 1
                type: integer
              crewRef:
                description: |-
                  CrewRef references the Crew CR in the same namespace that the
                  suite runs against. Required.
                type: string
              description:
                description: |-
                  Description is a human-readable statement of the suite's purpose
                  and scope (e.g. "26-scenario READ-query baseline across all four
                  homelab layers"). Surfaced on the dashboard suite row/detail and
                  as a header line in the XLSX Overview tab. Optional.
                type: string
              iterations:
                description: |-
                  Iterations is how many times each script is executed. Total
                  CrewFitness CRs created is len(Scripts) × Iterations. Required.
                format: int32
                minimum: 1
                type: integer
              perIterationTimeout:
                default: 10m
                description: |-
                  PerIterationTimeout caps the wall-clock for a single iteration's
                  CrewFitness CR. If an iteration doesn't reach a terminal phase
                  within this duration the reconciler records an error result for
                  that iteration and continues. Default 10m.
                type: string
              purgeMemory:
                default: true
                description: |-
                  PurgeMemory clears the target crew's working memory before the run so the
                  suite starts from a clean state (results aren't biased by facts the crew
                  learned in earlier runs). TrialIsolation decides whether it also clears
                  between trials. False leaves the crew's memory alone for the whole run.
                  Defaults to true.
                type: boolean
              purpose:
                description: |-
                  Purpose says what the suite is for: Capability suites start low and leave
                  room to improve; Regression suites sit near 100% and catch breakage. A
                  regression suite counts its scenarios below 100% in
                  status.consistency.regressions. Optional; absent means unclassified.
                enum:
                - Capability
                - Regression
                type: string
              rejudge:
                description: |-
                  Rejudge makes this suite a judge-only pass over an earlier run. When set,
                  the suite runs no iterations and asks the crew nothing: it copies the
                  source run's per-scenario transcripts, re-evaluates their assertions
                  against THIS suite's scripts (matched by testRef), and the deferred judge
                  scores the saved answers against this suite's references. Iterations,
                  concurrency, purgeMemory and suspend do not apply. Scenarios of this suite
                  with no transcript in the source are listed in status.rejudge.notInSource
                  and not scored; source scenarios missing from this suite are ignored.
                  Optional; set at creation and immutable afterwards.
                properties:
                  runId:
                    description: |-
                      RunID is the source run to re-judge; it must equal the source suite's
                      status.runId.
                    minLength: 1
                    type: string
                  suite:
                    description: |-
                      Suite is the source CrewFitnessSuite, in the same namespace. It must be
                      Completed and must still exist: deleting a suite purges its transcripts.
                    minLength: 1
                    type: string
                required:
                - runId
                - suite
                type: object
              scripts:
                description: |-
                  Scripts is the ordered list of fitness scripts to execute.
                  Each entry mirrors the CrewFitness spec's testRef/testContent/
                  configMapRef triad — exactly one source must be set per entry.
                  Required unless spec.tier is set; with spec.tier the operator
                  writes the scripts it resolves here when the suite starts, so the
                  suite keeps the text it ran even if the crew's scenarios change
                  later.
                items:
                  description: |-
                    SuiteScript is one entry in a suite — mirrors the CrewFitness spec's
                    test source fields. Exactly one of TestContent or ConfigMapRef must be
                    set; TestRef is the friendly name used as a column value and as part
                    of the per-iteration CrewFitness CR's name.
                  properties:
                    configMapRef:
                      description: |-
                        ConfigMapRef references an existing ConfigMap whose data key
                        {@code <TestRef>.adl} (or matching key) holds the script. Mutually
                        exclusive with TestContent.
                      type: string
                    testContent:
                      description: |-
                        TestContent is the raw ADL script. When set, the per-iteration
                        CrewFitness CR is created with this content inline. Mutually
                        exclusive with ConfigMapRef.
                      type: string
                    testRef:
                      description: |-
                        TestRef is the script's friendly name (e.g. "gpu-utilization-live").
                        Used as a column value in the XLSX and as part of the per-iteration
                        CrewFitness CR's name.
                      type: string
                  required:
                  - testRef
                  type: object
                type: array
              skipToolSmoke:
                default: false
                description: |-
                  SkipToolSmoke skips the MCP tool smoke that runs first in every suite. By
                  default the operator lists the tools of each MCPServer in the suite's
                  namespace through the crew's MCP gateway and calls each tool that declares
                  spec.smokeInputs; when any tool fails, the suite ends in phase
                  ToolSmokeFailed before any model runs. Default false.
                type: boolean
              suspend:
                default: false
                description: |-
                  Suspend pauses the suite between iterations. While true, no new
                  iteration starts; any iteration already running finishes and its result
                  is kept. The phase becomes Paused once nothing is in flight. Setting it
                  back to false resumes the suite at the next unscheduled iteration.
                  Ignored once the suite is terminal. Default false.
                type: boolean
              tier:
                description: |-
                  Tier selects the scripts from the crew's own scenarios instead of
                  listing them: smoke, standard, or full. When the suite starts, the
                  operator reads the ConfigMap <crewRef>-fitness in the suite's
                  namespace (the scenarios the crew chart ships), keeps the scenarios
                  that name the tier in their TIERS constant (every scenario for full),
                  and records the tier and the scenario names in status.tier. Do not
                  set spec.scripts together with spec.tier. Immutable. Optional; absent
                  means the suite runs exactly the scripts it lists.
                enum:
                - smoke
                - standard
                - full
                type: string
              trialIsolation:
                default: PerTrial
                description: |-
                  TrialIsolation sets whether the trials of a scenario share crew memory.
                  PerTrial (default) clears the crew's working memory before every trial, so
                  a fact the crew learns in one trial cannot help the next; it runs the
                  trials one at a time whatever spec.concurrency says. PerSuite clears it
                  once before the first trial, so later trials can build on earlier ones:
                  use it to measure learning. It has no effect when purgeMemory is false.
                enum:
                - PerTrial
                - PerSuite
                type: string
            required:
            - crewRef
            - iterations
            type: object
            x-kubernetes-validations:
            - message: 'spec.rejudge is immutable: set it when the suite is created'
              rule: has(self.rejudge) == has(oldSelf.rejudge) && (!has(self.rejudge)
                || self.rejudge == oldSelf.rejudge)
            - message: 'spec.tier is immutable: set it when the suite is created'
              rule: has(self.tier) == has(oldSelf.tier) && (!has(self.tier) || self.tier
                == oldSelf.tier)
            - message: spec.scripts must list at least one script, or spec.tier must
                name a tier to resolve them from the crew's scenarios
              rule: (has(self.scripts) && size(self.scripts) > 0) || has(self.tier)
            - message: 'spec.tier and spec.rejudge are mutually exclusive: a re-judge
                scores the scripts it names'
              rule: '!(has(self.tier) && has(self.rejudge))'
          status:
            description: CrewFitnessSuiteStatus reflects the observed state of a suite
              run.
            properties:
              artifactRef:
                description: |-
                  ArtifactRef is set when the XLSX has been written to the NATS
                  Object Store. Populated only on terminal phase
                  (Completed/Failed/Cancelled).
                properties:
                  bucket:
                    description: |-
                      Bucket is the NATS Object Store bucket. Always
                      {@code kubemoot_fitness_artifacts} in v1.
                    type: string
                  objectKey:
                    description: |-
                      ObjectKey is the bucket-relative key:
                      {@code <namespace>/<suite-name>/<runId>.xlsx}.
                    type: string
                  sizeBytes:
                    description: |-
                      SizeBytes of the XLSX object. Reported by the operator for
                      dashboard pre-fetch sizing; not load-bearing.
                    format: int64
                    type: integer
                required:
                - bucket
                - objectKey
                type: object
              completedAt:
                description: |-
                  CompletedAt records when the last iteration reached a terminal
                  phase (Passed/Failed/Error), or when the suite was cancelled.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consistency:
                description: Consistency summarizes pass^k across the scenarios in
                  status.scenarios.
                properties:
                  meanPassAllK:
                    description: |-
                      MeanPassAllK is the mean of the scenarios' passAllK, 0 to 100, rounded,
                      over the scenarios with a finished trial.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  regressions:
                    description: |-
                      Regressions counts the scenarios below a 100% pass rate. It is set only
                      when spec.purpose is Regression.
                    format: int32
                    type: integer
                  scenariosToCheck:
                    description: ScenariosToCheck counts the scenarios flagged checkScenario.
                    format: int32
                    type: integer
                type: object
              error:
                description: Error provides details when Phase is Error.
                type: string
              errored:
                format: int32
                type: integer
              failed:
                format: int32
                type: integer
              iterationsCompleted:
                description: |-
                  IterationsCompleted is the number of per-iteration CrewFitness
                  CRs that have reached a terminal phase (any outcome). Increments
                  monotonically up to IterationsTotal.
                format: int32
                type: integer
              iterationsTotal:
                description: IterationsTotal is len(spec.scripts) × spec.iterations.
                format: int32
                type: integer
              judge:
                description: |-
                  Judge reports the deferred judge pass over this run. Absent when no
                  artifact store is configured.
                properties:
                  answerMean:
                    description: |-
                      AnswerMean is the mean score of the judged iterations, 0 to 100, rounded:
                      every iteration counts once, whichever scenario it belongs to. Mean is the
                      mean of the scenario scores. Absent until an iteration is judged, and when a
                      judged scenario has no per-answer record (a run judged before answers were
                      kept).
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  completedAt:
                    description: CompletedAt is when the operator recorded the pass
                      as complete.
                    format: date-time
                    type: string
                  fabrications:
                    description: |-
                      Fabrications is the number of judged answers the judge flagged as
                      fabricated, over every judged scenario.
                    format: int32
                    type: integer
                  judged:
                    description: |-
                      Judged is the number of scenarios scored so far. Unjudged scenarios are
                      not counted.
                    format: int32
                    type: integer
                  judgedAnswers:
                    description: |-
                      JudgedAnswers is the number of iterations scored so far, over every judged
                      scenario, consensus-gated iterations included (they score 0). Judged
                      counts scenarios; this counts the answers behind them.
                    format: int32
                    type: integer
                  mean:
                    description: |-
                      Mean is the mean scenario score, 0 to 100, rounded, over the scenarios
                      judged so far. Absent until a scenario is judged.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  phase:
                    description: Phase is where the judge pass stands.
                    enum:
                    - Pending
                    - Judging
                    - Complete
                    - Skipped
                    type: string
                  scores:
                    description: Scores lists each judged scenario in spec order,
                      capped at 300 entries.
                    items:
                      description: FitnessJudgeScore is the judge's verdict on one
                        scenario.
                      properties:
                        answers:
                          description: |-
                            Answers is how many iterations of the scenario were scored, consensus-gated
                            ones included. The score of each iteration is in the judge checkpoint in
                            the object store, not here.
                          format: int32
                          type: integer
                        fabrications:
                          description: |-
                            Fabrications is how many of the scenario's answers the judge flagged as
                            fabricated.
                          format: int32
                          type: integer
                        gated:
                          description: |-
                            Gated is how many of the scenario's iterations failed the consensus floor
                            or returned an empty answer and so scored 0 without a judge call.
                          format: int32
                          type: integer
                        reason:
                          description: Reason is the judge's rationale on one line,
                            cut to 200 characters.
                          maxLength: 200
                          type: string
                        scenario:
                          description: Scenario is the script's testRef.
                          maxLength: 253
                          type: string
                        score:
                          description: |-
                            Score is the scenario's answer quality, 0 to 100, rounded: the mean of
                            the judge's per-answer scores, with consensus-gated iterations counting 0.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                      required:
                      - scenario
                      - score
                      type: object
                    maxItems: 300
                    type: array
                    x-kubernetes-list-type: atomic
                  total:
                    description: |-
                      Total is the number of scenarios the judge has to score (judged plus
                      unjudged plus those still pending): those with a DEFER assertion and at
                      least one transcript. It is 0 until the pass
                      starts and stays 0 for a run with nothing to judge.
                    format: int32
                    type: integer
                  unjudged:
                    description: |-
                      Unjudged lists the scenarios the judge could not score, in spec order,
                      capped at 300 entries. A scenario is unjudged at once when its input does
                      not fit the judge's context window, and after a fixed number of failed
                      attempts otherwise. The phase still ends at Complete and the mean covers
                      the judged scenarios only.
                    items:
                      description: FitnessJudgeUnjudged is a scenario the judge gave
                        up on, with the reason.
                      properties:
                        reason:
                          description: |-
                            Reason says why the scenario has no score: its comparison document does
                            not fit the judge's context window, or the judge failed on every
                            attempt. One line, cut to 200 characters.
                          maxLength: 200
                          type: string
                        scenario:
                          description: Scenario is the script's testRef.
                          maxLength: 253
                          type: string
                      required:
                      - scenario
                      type: object
                    maxItems: 300
                    type: array
                    x-kubernetes-list-type: atomic
                  zeros:
                    description: Zeros is the number of judged scenarios that scored
                      0.
                    format: int32
                    type: integer
                required:
                - phase
                type: object
              passed:
                description: |-
                  Passed / Failed / Errored break down IterationsCompleted by
                  outcome.
                format: int32
                type: integer
              pathCoverage:
                description: |-
                  PathCoverage says which call paths the run exercised, read from the
                  placement records of its own transcripts, so a path the run never took
                  shows as a gap instead of being assumed. Set once the run is terminal.
                properties:
                  calls:
                    description: |-
                      Calls is the number of placed model calls read from the run's transcripts.
                      Zero means the transcripts held none (a run from before the records were
                      kept), and every row below is then empty.
                    format: int32
                    type: integer
                  gaps:
                    description: |-
                      Gaps lists the paths the crew has that the run never took: a call kind or
                      phase with no call, a provider among the crew's model servers with no
                      call, a thinking setting some agent declares with no call. Empty means
                      every path the crew declares was exercised.
                    items:
                      type: string
                    maxItems: 30
                    type: array
                    x-kubernetes-list-type: atomic
                  kinds:
                    description: 'Kinds counts calls by the path that sent them: triage,
                      tool-turn, simple.'
                    items:
                      description: PathCount is one row of a path-coverage table.
                      properties:
                        calls:
                          description: Calls is how many calls took this path.
                          format: int32
                          type: integer
                        name:
                          description: Name is the kind, phase, model, provider or
                            thinking setting.
                          maxLength: 253
                          type: string
                      required:
                      - calls
                      - name
                      type: object
                    maxItems: 30
                    type: array
                    x-kubernetes-list-type: atomic
                  models:
                    description: Models counts calls by the model they ran on.
                    items:
                      description: PathCount is one row of a path-coverage table.
                      properties:
                        calls:
                          description: Calls is how many calls took this path.
                          format: int32
                          type: integer
                        name:
                          description: Name is the kind, phase, model, provider or
                            thinking setting.
                          maxLength: 253
                          type: string
                      required:
                      - calls
                      - name
                      type: object
                    maxItems: 30
                    type: array
                    x-kubernetes-list-type: atomic
                  phases:
                    description: |-
                      Phases counts calls by where in the thread they happened: advisory,
                      selection, triage, evaluation, synthesis.
                    items:
                      description: PathCount is one row of a path-coverage table.
                      properties:
                        calls:
                          description: Calls is how many calls took this path.
                          format: int32
                          type: integer
                        name:
                          description: Name is the kind, phase, model, provider or
                            thinking setting.
                          maxLength: 253
                          type: string
                      required:
                      - calls
                      - name
                      type: object
                    maxItems: 30
                    type: array
                    x-kubernetes-list-type: atomic
                  providers:
                    description: |-
                      Providers counts calls by the engine type of the model server they ran
                      on (ollama, vllm, openai-compatible).
                    items:
                      description: PathCount is one row of a path-coverage table.
                      properties:
                        calls:
                          description: Calls is how many calls took this path.
                          format: int32
                          type: integer
                        name:
                          description: Name is the kind, phase, model, provider or
                            thinking setting.
                          maxLength: 253
                          type: string
                      required:
                      - calls
                      - name
                      type: object
                    maxItems: 30
                    type: array
                    x-kubernetes-list-type: atomic
                  thinking:
                    description: |-
                      Thinking counts calls by the thinking setting of the agent that made
                      them: on or off when the Agent sets spec.think, default when it leaves
                      the model's own default, unknown when the agent was not found.
                    items:
                      description: PathCount is one row of a path-coverage table.
                      properties:
                        calls:
                          description: Calls is how many calls took this path.
                          format: int32
                          type: integer
                        name:
                          description: Name is the kind, phase, model, provider or
                            thinking setting.
                          maxLength: 253
                          type: string
                      required:
                      - calls
                      - name
                      type: object
                    maxItems: 30
                    type: array
                    x-kubernetes-list-type: atomic
                  transcripts:
                    description: |-
                      Transcripts is the number of iterations whose transcript held at least one
                      placed call, out of status.iterationsCompleted.
                    format: int32
                    type: integer
                required:
                - calls
                - transcripts
                type: object
              phase:
                description: Phase is the lifecycle phase.
                type: string
              realm:
                description: |-
                  Realm records what the run ran on: model servers and models, accelerator
                  capability, versions, agent pod resources, and concurrent activity, at the
                  start and at the end. Compare it before comparing two runs.
                properties:
                  copiedFrom:
                    description: |-
                      CopiedFrom is set on a re-judge suite: the answers ran on the source
                      run's realm, so Start and Digests are the source's.
                    properties:
                      runId:
                        description: |-
                          RunID is the source run to re-judge; it must equal the source suite's
                          status.runId.
                        minLength: 1
                        type: string
                      suite:
                        description: |-
                          Suite is the source CrewFitnessSuite, in the same namespace. It must be
                          Completed and must still exist: deleting a suite purges its transcripts.
                        minLength: 1
                        type: string
                    required:
                    - runId
                    - suite
                    type: object
                  digests:
                    description: |-
                      Digests are short hashes of the parts of Start that decide whether two
                      runs are comparable. Two runs with equal digests ran on the same realm;
                      a differing digest names the part that differs. They leave out time,
                      residency, and concurrent activity, which are recorded but never make
                      two runs incomparable on their own.
                    properties:
                      isolation:
                        description: |-
                          Isolation covers how the run's trials were isolated (see
                          RealmSnapshot.TrialIsolation): runs whose trials shared crew memory and
                          runs whose trials did not are not comparable.
                        type: string
                      models:
                        description: |-
                          Models covers each model on each server: name, digest, quantization,
                          and context length.
                        type: string
                      resources:
                        description: Resources covers the requests and limits of the
                          crew's pods.
                        type: string
                      servers:
                        description: |-
                          Servers covers each model server: its name, engine, engine version, and
                          accelerator capability.
                        type: string
                      versions:
                        description: |-
