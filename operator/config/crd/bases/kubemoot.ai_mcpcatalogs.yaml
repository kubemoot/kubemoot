---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mcpcatalogs.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: MCPCatalog
    listKind: MCPCatalogList
    plural: mcpcatalogs
    shortNames:
    - mcpcat
    singular: mcpcatalog
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .status.serversDiscovered
      name: Discovered
      type: integer
    - jsonPath: .status.serversAllowed
      name: Allowed
      type: integer
    - jsonPath: .status.serversBlocked
      name: Blocked
      type: integer
    - jsonPath: .status.lastSync
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MCPCatalog defines an MCP server catalog source for discovery
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MCPCatalogSpec defines the desired state of MCPCatalog
            properties:
              agentRef:
                description: |-
                  AgentRef references a ReAct Agent CR for discovery (required for type: agent)
                  The agent navigates the catalog, extracts server info, and finds GitHub links
                type: string
              auth:
                description: Auth configures authentication for the catalog API
                properties:
                  secretRef:
                    description: |-
                      SecretRef references a secret containing auth credentials
                      Expected keys depend on auth type: "token", "api-key", "username", "password"
                    type: string
                type: object
              maxServers:
                default: 100
                description: MaxServers limits the number of servers to discover from
                  this catalog
                type: integer
              qualityPolicyRef:
                description: |-
                  QualityPolicyRef references an MCPQualityPolicy to evaluate discovered servers
                  If not specified, uses the MCPGateway's qualityPolicyRef
                type: string
              queries:
                description: |-
                  Queries specifies capabilities to search for (optional)
                  e.g., ["kubernetes", "database", "filesystem"]
                  If empty, discovers all available servers
                items:
                  type: string
                type: array
              syncInterval:
                default: 24h
                description: SyncInterval is how often to re-discover servers from
                  this catalog
                type: string
              type:
                description: Type specifies the catalog type and discovery mechanism
                enum:
                - official-registry
                - smithery
                - glama
                - docker
                - npm
                - agent
                type: string
              url:
                description: |-
                  URL is the catalog entry point
                  For standard types: the API endpoint
                  For agent type: the starting URL for navigation
                type: string
            required:
            - type
            - url
            type: object
          status:
            description: MCPCatalogStatus defines the observed state of MCPCatalog
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              discoveredServers:
                description: DiscoveredServers lists the servers found (summary, not
                  full list)
                items:
                  description: DiscoveredServer represents an MCP server discovered
                    from a catalog
                  properties:
                    author:
                      description: Author/publisher of the server
                      type: string
                    categories:
                      description: Categories/tags for the server
                      items:
                        type: string
                      type: array
                    description:
                      description: Description of the server's capabilities
                      type: string
                    githubUrl:
                      description: GitHubURL is the source repository (derived from
                        name or extracted by agent)
                      type: string
                    name:
                      description: Name is the server name (e.g., "io.github.feiskyer/mcp-kubernetes-server")
                      type: string
                    packageIdentifier:
                      description: PackageIdentifier is the package name in the registry
                      type: string
                    qualityDecision:
                      description: QualityDecision is the result of quality policy
                        evaluation
                      type: string
                    qualityReason:
                      description: QualityReason explains the quality decision
                      type: string
                    registryType:
                      description: RegistryType is the package registry (npm, docker,
                        pip, etc.)
                      type: string
                    transport:
                      description: Transport is the MCP transport type (stdio, sse,
                        http)
                      type: string
                    version:
                      description: Version of the server
                      type: string
                  required:
                  - name
                  type: object
                type: array
              lastSync:
                description: LastSync is when the catalog was last synchronized
                format: date-time
                type: string
              message:
                description: Message provides additional status information
                type: string
              nextSync:
                description: NextSync is when the next sync is scheduled
                format: date-time
                type: string
              phase:
                description: Phase is the current lifecycle phase (Syncing, Ready,
                  Error)
                type: string
              serversAllowed:
                description: ServersAllowed is the number passing quality policy
                type: integer
              serversBlocked:
                description: ServersBlocked is the number blocked by quality policy
                type: integer
              serversDiscovered:
                description: ServersDiscovered is the total number of servers found
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
