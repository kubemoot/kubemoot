---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: models.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: Model
    listKind: ModelList
    plural: models
    shortNames:
    - mdl
    singular: model
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef
      name: Server
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.pull.percent
      name: Progress
      type: integer
    - jsonPath: .status.modelInfo.size
      name: Size
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Model is the Schema for the models API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSpec defines the desired state of Model.
            properties:
              capabilities:
                description: |-
                  Capabilities are abilities the engine cannot report: tool-calling,
                  reasoning, vision. When set they replace what the engine reports, and each
                  becomes a capability/<name>: "true" label scheduling rules can select on.
                items:
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              contextLength:
                description: ContextLength is the maximum context window size (optional
                  override)
                type: integer
              disabled:
                description: |-
                  Disabled keeps the model out of the cluster's model catalog: the operator
                  downloads nothing for it, no crew selects it, and calibration skips it. Use it to exclude a model
                  the server has but the cluster owner does not want used.
                type: boolean
              model:
                description: |-
                  Model is the served name: the name every request uses to ask for this
                  model (e.g., "qwen3:14b"). Where the weights come from is spec.source.
                  For vLLM this is the name the server is started with
                  (--served-model-name); the operator checks it against the served names
                  the ModelServer's servers report and reports a mismatch on the Model's
                  ServedNameFound condition. Ollama serves a model only under its tag, so
                  for an ollama source it must equal source.ollama.tag.
                type: string
              parameters:
                description: |-
                  Parameters is the model's total parameter count, such as "14B", "0.5B" or
                  "751M". Declare it where the engine cannot report it (vLLM does not) or to
                  correct a wrong report. The size class (small under 12B, medium from 12B
                  to under 30B, large from 30B) is derived from it. A kubemoot.ai/size label
                  on the Model overrides the derived class.
                pattern: ^[0-9]+(\.[0-9]+)?[KkMmBbTt]$
                type: string
              quantization:
                description: Quantization specifies the quantization method (e.g.,
                  q4_K_M)
                type: string
              serverRef:
                description: ServerRef references the parent ModelServer
                type: string
              source:
                description: |-
                  Source says where the weights come from, as exactly one of ollama or
                  huggingFace. It cannot change after creation, except that an ollama
                  source may be added to a Model that has none (its tag equals spec.model,
                  the same meaning as an absent source). It must fit the engine of the
                  server: ollama for an ollama server, huggingFace for a vLLM
                  server. A mismatch is reported on the Model's SourceCompatible
                  condition and nothing is pulled; the operator never guesses or falls
                  back. When absent the source is an Ollama tag equal to spec.model on an
                  ollama server. On a vLLM server the source is optional: the server
                  decides its weights, and a huggingFace source is information, compared
                  with the repository the server reports (ServedRepoMatches condition)
                  when it reports one; the revision cannot be read from the server.
                properties:
                  huggingFace:
                    description: HuggingFace names a Hugging Face repository pinned
                      to a revision.
                    properties:
                      quantization:
                        description: |-
                          Quantization names the quantization of the repository's weights
                          (e.g., awq, gptq).
                        type: string
                      repo:
                        description: Repo is the repository (e.g., "Qwen/Qwen3-14B-AWQ").
                        minLength: 1
                        type: string
                      revision:
                        description: |-
                          Revision is the commit sha the weights are pinned to: 7 to 40 hex
                          characters. A branch or tag name is not accepted, so the weights never
                          change under a running Model.
                        pattern: ^[0-9a-fA-F]{7,40}$
                        type: string
                    required:
                    - repo
                    - revision
                    type: object
                  ollama:
                    description: Ollama names an Ollama library tag.
                    properties:
                      tag:
                        description: |-
                          Tag is the Ollama tag to pull (e.g., "qwen3:14b"). It must equal
                          spec.model, because Ollama serves a model only under its tag.
                        minLength: 1
                        type: string
                    required:
                    - tag
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of ollama or huggingFace must be set
                  rule: '(has(self.ollama) ? 1 : 0) + (has(self.huggingFace) ? 1 :
                    0) == 1'
              vramMib:
                description: |-
                  VRAMMib declares the VRAM footprint (in MiB) this Model needs when
                  loaded on a Server. Used by the Scheduler v2 filter step to enforce
                  capacity: a Model is feasible on a Server only when
                  VRAMMib <= ModelServer.status.capacity.vramTotalMiB after eviction
                  of any displaceable resident models. Required for CrewSchedulingPolicy
                  matching; if unset, the Model is treated as best-fit-unknown and may
                  be filtered out under strict policies.

                  See kubemoot/docs/scheduler-v2.md for the scheduling algorithm.
                format: int32
                minimum: 0
                type: integer
            required:
            - model
            - serverRef
            type: object
            x-kubernetes-validations:
            - message: 'spec.source is immutable except for adding an ollama source
                to a Model that has none: delete and recreate the Model to change
                where its weights come from'
              rule: (has(self.source) == has(oldSelf.source) && (!has(self.source)
                || self.source == oldSelf.source)) || (!has(oldSelf.source) && has(self.source)
                && has(self.source.ollama))
            - message: 'source.ollama.tag must equal spec.model: Ollama serves a model
                only under its tag'
              rule: '!has(self.source) || !has(self.source.ollama) || self.source.ollama.tag
                == self.model'
          status:
            description: ModelStatus defines the observed state of Model.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: Endpoint is the inference endpoint for this model
                type: string
              message:
                description: Message provides additional status information
                type: string
              modelInfo:
                description: ModelInfo contains metadata discovered after download
                properties:
                  contextLength:
                    description: ContextLength is the maximum context window
                    type: integer
                  digest:
                    description: Digest is the model digest/hash
                    type: string
                  family:
                    description: Family is the model family (e.g., "llama", "qwen",
                      "mistral")
                    type: string
                  format:
                    description: Format is the model format (e.g., "gguf", "safetensors")
                    type: string
                  modifiedAt:
                    description: ModifiedAt is when the model was last modified
                    type: string
                  parameters:
                    description: Parameters is the parameter count (e.g., "7B", "70B")
                    type: string
                  quantization:
                    description: Quantization is the detected quantization (e.g.,
                      "Q4_K_M", "F16")
                    type: string
                  size:
                    description: Size is the model size on disk (e.g., "4.7GB")
                    type: string
                type: object
              pull:
                description: |-
                  Pull reports download progress while State is Pulling and is cleared
                  once the model is on the server.
                properties:
                  completedBytes:
                    description: CompletedBytes is how many bytes of the known layers
                      have downloaded
                    format: int64
                    type: integer
                  percent:
                    description: Percent is CompletedBytes as a whole percentage of
                      TotalBytes
                    format: int32
                    type: integer
                  totalBytes:
                    description: |-
                      TotalBytes is the combined size of the layers the server has announced so
                      far; it can grow while the pull discovers more layers
                    format: int64
                    type: integer
                type: object
              ready:
                description: Ready indicates if the model is ready for inference
                type: boolean
              state:
                description: |-
                  State is the current state (Pending, Pulling, Available, Loaded, Error)
                  Available = downloaded, Loaded = in GPU memory
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
