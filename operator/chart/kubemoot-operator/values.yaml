# Kubemoot Operator Helm Chart Values

replicaCount: 1

global:
  # Registry and namespace prefixed to every Kubemoot image below (operator,
  # components, test runner). Public releases are published to GHCR. A private
  # mirror sets this to its own registry, e.g. harbor.example.com/kubemoot, and
  # adds its pull secret under imagePullSecrets. An image value that already
  # contains a "/" is used as-is (third-party images such as doclingServe).
  imageRegistry: ghcr.io/kubemoot
  # Pull secrets for global.imageRegistry, applied to the operator and to the dashboard
  # subchart. Merged with the chart-level imagePullSecrets below.
  imagePullSecrets: []
  # The install CA (under global so the dashboard subchart reads the same names). A call inside
  # the cluster that carries a bearer token uses TLS, because Kubemoot does not assume the
  # cluster encrypts pod traffic. The operator makes one CA, a Secret in this namespace, when it
  # is absent and never replaces it (so no chart render ever rotates it: delete the Secret to
  # rotate, and the previous CA stays trusted until every certificate it signed is replaced).
  # It signs the serving certificates of the report service and of each crew's discussion gateway,
  # and publishes the CA's public certificates in the ConfigMap below, which the dashboard and the
  # crew liaison mount to verify them. The Secret holds the CA key; no pod mounts it.
  installCA:
    secret: kubemoot-ca
    configMap: kubemoot-ca

image:
  repository: kubemoot-operator
  tag: ""  # Defaults to Chart.appVersion if empty
  pullPolicy: IfNotPresent

# Pull secrets for global.imageRegistry. Empty for the public registry.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# The operator caches every kind it watches, so memory grows with the cluster: raise requests and the limit together. No CPU limit, so start-up bursts are not throttled.
resources:
  limits:
    memory: 384Mi
    ephemeral-storage: 1Gi
  requests:
    cpu: 25m
    memory: 160Mi
    ephemeral-storage: 256Mi

# GOMEMLIMIT for the operator, liaison and accelerator-mcp, as a whole-number percent (0 to 100) of each memory limit; 0 sets none. 90 is a starting point.
goMemLimitPercent: 90

nodeSelector: {}

tolerations: []

affinity: {}

# MCP Bridge Injection defaults
# Used for stdio transport MCP servers to bridge HTTP/SSE ↔ stdio
# Uses kubemoot-mcp-bridge static binary injected via init container (works with any image)
proxyInjection:
  # Default port for the HTTP/SSE bridge
  port: 8080

# Secret replication: the operator copies Secrets (image pull secrets, vector-store
# credentials, the kubemoot.ai/replicate-secrets annotation) into crew namespaces
# only from its own namespace plus the namespaces listed here. Every other source
# namespace is refused.
secretReplication:
  allowedSourceNamespaces: []

# Discussion gateways, the HTTP entry point of each crew.
discussionGateway:
  # Browser origins (https://app.example.com, exact, no wildcard) whose pages may read a
  # gateway's event streams. Empty, the default, sends no CORS headers, so only same-origin
  # pages and non-browser clients can. The gateway never allows credentials.
  allowedOrigins: []
  # TLS for the gateways. A gateway carries callers' bearer tokens (the dashboard's, the
  # liaison's, a person's own), so each crew's gateway serves https on port 443 of its Service
  # with a certificate the operator signs from the install CA (installCA above), and the dashboard
  # and the liaison verify it with that CA. Do not rely on the cluster encrypting pod traffic.
  # Off, the gateways serve plain http only; the liaison is then told to accept that
  # (LIAISON_ALLOW_INSECURE_GATEWAY) and the dashboard needs dashboard.auth.gatewayUrl set to an
  # http address.
  tls:
    enabled: true
    # Keep each gateway's plain http listener (port 80 of its Service) beside the TLS one. The
    # Gateway API route to a crew, the API server's service proxy (kmctl conversation ask, the
    # quickstart, the coordinator chaos test) and the fitness runner still call it, and none of
    # them can use the TLS port yet. Turn it off once nothing you run depends on it: a gateway
    # with no plain listener answers only https. (The credential lease port 8081, used by the tool
    # gateway, is a separate plain listener and stays.)
    plainListener: true

# Security hardening for what crews may reference.
security:
  # Secret use grants (off by default). When enabled, a ValidatingAdmissionPolicy rejects an
  # MCPServer or Agent that references a Secret (env secretKeyRef, secretRef, secretVolumes,
  # registry.authSecretRef, sidecar env and envFrom) or a ServiceAccount unless whoever
  # creates or changes it holds the custom verb "use" on that exact object. Grant it with a
  # Role (verb use, resources secrets or serviceaccounts, resourceNames) bound to whoever
  # applies the crew; docs/concepts/secrets-and-tools.md has the example. Needs Kubernetes
  # 1.30 or later (ValidatingAdmissionPolicy GA, CEL authorizer). The operator's own
  # ServiceAccount is always exempt.
  secretUseGrants:
    enabled: false
    # Further users to skip, as the API server names them (for example a break-glass admin
    # that is not in system:masters). Cluster admins already pass: their RBAC allows every verb.
    exemptUsers: []
    # Deny rejects. Use ["Audit", "Warn"] to see what would be rejected before enforcing.
    validationActions: ["Deny"]
    # Limit enforcement to namespaces matching this label selector (default: every namespace).
    namespaceSelector: {}

  # Network policies the operator generates (off by default). When enabled, the operator
  # makes a default-deny ingress policy in every crew namespace (a namespace labeled
  # kubemoot.ai/crew that holds a Crew), admits only the crew's gateway and the operator to each tool server,
  # narrows each crew gateway's tool port to its namespace, and, with egress.mode Declared,
  # restricts the outbound traffic of each MCPServer and Agent that sets spec.egress. Every
  # generated object carries the label kubemoot.ai/generated-by=network-policy and an owner
  # reference; turning the flag off deletes exactly those objects and nothing hand-written.
  # Needs a CNI that enforces NetworkPolicy. docs/concepts/network-policies.md lists what
  # each CNI enforces.
  networkPolicies:
    enabled: false
    # The ingress set. Applies only with enabled: true.
    ingress: true
    egress:
      # Off: no egress policy. Declared: restrict only the workloads that set spec.egress.
      mode: "Off"
    # auto emits CiliumNetworkPolicy objects when that kind is installed (host name rules and
    # the entities a NetworkPolicy cannot name); on always emits them; off never does.
    cilium: auto
    # Where name resolution runs, allowed from every workload that has an egress policy.
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    # The metrics scraper, admitted to the pods it scrapes. Leave namespace empty for none.
    metricsScraper:
      namespace: ""
      podLabels: {}
    # Without Cilium: namespaces of the Gateway API proxy pods, admitted to the discussion
    # gateways, and source ranges of the API server's service proxy (kubectl ask, kmctl).
    trustedIngressNamespaces: []
    controlPlaneCIDRs: []
    # Pod and service ranges that are not private addresses. Without Cilium, a declared host
    # lets a workload reach the internet outside the private ranges; these stay blocked too.
    clusterCIDRs: []

# Gateway API configuration for crew discussion HTTPRoutes
gateway:
  enabled: false
  name: gateway
  namespace: default
  hostname: kubemoot.example.com

# Leader election for HA
leaderElection:
  enabled: true
  # Lease tuning — controller-runtime defaults are 15s/10s/2s which is too
  # aggressive for clusters where the K8s API ClusterIP can briefly time
  # out (homelabs, k8s control-plane under load). 60s/50s/10s tolerates
  # blips up to about 50 seconds without unseating the leader. Trade-off:
  # slower failover when a leader genuinely dies (~60s). Fine for a
  # 1-replica deployment where the "failover" is just the new pod
  # starting up after restart.
  leaseDuration: 60s
  renewDeadline: 50s
  retryPeriod: 10s

# Metrics configuration
metrics:
  enabled: true
  port: 8080
  # Prometheus scraping, for a Prometheus that runs the Prometheus Operator (for
  # example kube-prometheus-stack): PodMonitors for the agents and the operator,
  # rendered only when the cluster serves the PodMonitor API. Kubemoot runs without
  # Prometheus; scraping is optional and recommended.
  podMonitor:
    enabled: true
    # Labels your Prometheus selects monitors by; kube-prometheus-stack selects
    # release: <its Helm release name> unless configured otherwise.
    labels: {}
    # Scrape interval; empty uses Prometheus's default.
    interval: ""

# Health probes
health:
  port: 8081

# Internal control plane agents (deployed to same namespace as operator)
# These agents handle MCP quality evaluation and catalog discovery.
# Off by default: enabling installs MCP servers with cluster read access
# (see mcpServers below). Opt in only on clusters where every pod is trusted.
internalAgents:
  enabled: false
  # MCP Quality Evaluator Agent
  qualityEvaluator:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # MCP Chronicler Agent (persistent learning memory)
  # Records deployment/connection/tool-call results and advises on best configurations
  chronicler:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # MCP Catalog Discovery Agent (for non-standard registries)
  catalogDiscovery:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # Onboarding Agent (detects capability gaps, proposes new MCP tools)
  onboardingAgent:
    enabled: false
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # RTFM Agent (finds documentation for onboarded tools, creates RAGSources)
  rtfmAgent:
    enabled: false
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # MCP Tool Servers for internal agents
  # These provide tools for discovery and evaluation
  mcpServers:
    enabled: true
    # Kubernetes MCP - provides k8s CRUD tools
    # Using mcp/kubernetes from Docker Hub (official MCP server image); the
    # repository publishes only a floating tag, so the image is pinned by digest.
    # Its ServiceAccount reads cluster state but no Secrets.
    kubernetes:
      enabled: true
      image: mcp/kubernetes@sha256:5ffbf7f0a8aa7a58dfcf8d34807fd42a9cd7d88d88a5de88f472edfc3133af73
      command: ["node", "dist/index.js"]
      securityMode: strict  # Node.js image, no root access needed
      # replicas: 2 — stdio MCP servers exit cleanly when the bridge gateway
      # closes its connection (normal occurrence on long discussions or under
      # SIGTERM during routine restarts). Two replicas ensure the Service
      # always has at least one Ready pod even when one is restarting.
      # Same pattern as prometheus-mcp (homelab-pilot crew) and the
      # [[Prometheus MCP Connection Cycling]] kanban card.
      replicas: 2
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
    # Fetch MCP - provides HTTP/web fetching tools
    fetch:
      enabled: true
      image: mcp/fetch@sha256:1a7a0996a565a0b8ca5c41b42830d4e5f334d33f851596bbd9debb2beedb22d3
      command: ["/app/.venv/bin/mcp-server-fetch"]
      securityMode: relaxed  # Python/uv image, interpreter under /root/ (mode 700)
      # replicas: 2 — fetch-mcp was observed restarting every 2 minutes
      # (163 restarts in 11h, Exit 0 / Reason: Completed — stdio
      # MCP-server-exits-when-bridge-disconnects pattern). Each restart
      # triggered MCPServer status reconcile → enqueued MCPGateway
      # reconcile → all 6 MCPServers re-registered with the gateway
      # (~10 reconciles/min noise). Stabilising fetch-mcp with a second
      # replica eliminates the amplifier; the gateway-side predicate
      # filter is separately tracked in [[MCPGateway Reconcile Loop]].
      replicas: 2
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
    # GitHub MCP - provides GitHub API tools
    # Requires GITHUB_PERSONAL_ACCESS_TOKEN — server exits without it
    # Uses exec mode (no shell required) for distroless/scratch images
    github:
      enabled: false  # Enable after creating github-token secret
      image: ghcr.io/github/github-mcp-server:v1.12.2
      command: ["/server/github-mcp-server", "stdio"]
      securityMode: strict  # Go binary on distroless, no root access needed
      replicas: 1
      # Optional: Reference to secret containing GitHub token
      # Maps secret key to GITHUB_PERSONAL_ACCESS_TOKEN env var
      secretRef: ""
      secretKey: "password"  # Key in the secret containing the token
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

# NATS JetStream carries every discussion, so a Kubemoot install needs a NATS server
# with JetStream enabled (the quickstart installs the upstream nats chart as release
# "nats" in namespace "nats"). The chart bootstraps the streams and KV buckets with a
# post-install Job.
nats:
  enabled: true
  url: "nats://nats.nats.svc.cluster.local:4222"
  # TLS to NATS. Off by default: with none of these set every component connects as it always
  # has, plainly. Use a tls:// url above when the server speaks TLS. Each Secret is in the
  # operator's namespace; the operator copies it into the namespaces its workloads run in.
  tls:
    caSecret: ""      # Secret holding the CA bundle that signed the NATS server certificate
    caKey: ca.crt     # the key in that Secret
    clientSecret: ""  # kubernetes.io/tls Secret (tls.crt, tls.key): the client certificate for mutual TLS
  # The credential every Kubemoot component presents to NATS. Set secret and exactly one of:
  # credsKey (a .creds file), userKey with passwordKey, or tokenKey. Each names a key of the Secret.
  auth:
    secret: ""
    credsKey: ""
    userKey: ""
    passwordKey: ""
    tokenKey: ""
  # MCPServer that lets agents inspect NATS (sinadarbouy/mcp-nats, Apache-2.0, via
  # mcp-bridge). Off for a minimal install; the operator needs only the server above.
  # A crew's gateway selects servers in its own namespace, so a crew that should use
  # it needs its own MCPServer; this one serves agents in the operator's namespace.
  mcpServer:
    enabled: false   # an MCPServer that lets agents inspect NATS; opt in per cluster
    image: ghcr.io/sinadarbouy/mcp-nats:0.1.4
  # Limits of the stream that carries every crew's discussion messages (agents, the
  # coordinator, the dashboard). The stream is shared by all crews in the cluster. These
  # are the limits a thread needs to be read back after its coordinator restarts: the
  # stream must still hold the thread's messages, so size maxMessages for the busiest
  # hour's traffic times the time a restart takes, with headroom. The defaults hold about
  # four hours of the busiest traffic measured on a two-crew cluster (about 1,200 messages
  # an hour at the peak). An existing stream is updated to these values on upgrade.
  # See docs/concepts/signals-and-protocol.md, "The coordinator log".
  streams:
    discuss:
      maxMessages: 5000   # messages kept; the oldest go first. -1 for no limit
      maxAge: 24h         # how long a message is kept: a number and s, m, h, d, w or y. -1 for no limit
      maxBytes: 1GiB      # bytes kept, for example 256MiB. -1 for no limit
  # Size limits of the object stores the install creates. The workspace holds the tool
  # results agents spill during a thread (an agent deletes them when the thread closes; it
  # keeps them at most 48h). The fitness artifacts are the XLSX and transcripts of fitness
  # suites; maxAge is how long one is kept, whichever component first writes. An existing
  # store is brought to these limits on upgrade.
  stores:
    workspace:
      maxBytes: 2GiB
    fitnessArtifacts:
      maxAge: 168h
      maxBytes: 1GiB

# The crew coordinators. eventLog makes each coordinator write every decision it makes about
# a thread (who it convened, the signals it applied, the answer) to the KUBEMOOT_COORDINATOR
# stream before it acts on the decision, and check that log against the thread's live
# state when the thread closes. It flows to the KubemootConfig and from there to the
# KUBEMOOT_COORDINATOR_EVENT_LOG variable of every coordinator Agent; an Agent that sets the
# variable in spec.deployment.env keeps its own value. On by default; false turns the log off
# (and then resume must be false too).
# resume makes a restarted coordinator pick up the threads it had in flight: it rebuilds each
# from its log, reads the messages that arrived while it was down, and carries on from the
# last decision. It needs eventLog (the chart refuses resume without it), and it flows to
# KUBEMOOT_COORDINATOR_RESUME the same way. Run one coordinator replica unless lease is on. On by default;
# a release that sets eventLog false must set resume false too.
# resumeMaxAge is how old a thread's last logged event may be for a restarted coordinator to resume
# it, as a Go duration (30m, 1h30m). A thread older than that is closed with reason "expired" and
# its request, handed again, starts fresh. 0 or empty turns the limit off. A value that is not a
# duration is refused when the chart renders. It reaches KUBEMOOT_COORDINATOR_RESUME_MAX_AGE.
# lease lets more than one coordinator replica run: each replica owns the threads it holds a lease
# for (a key in the kubemoot_coordinator_leases KV bucket, which the chart then creates), and a
# thread whose owner stopped is taken over by another replica through resume. With lease on the
# coordinator Agents may set spec.deployment.replicas above 1 and roll with RollingUpdate instead of
# Recreate. It needs eventLog and resume (the chart refuses lease without them) and flows to
# KUBEMOOT_COORDINATOR_LEASE the same way. Off by default; then a coordinator is one replica
# that rolls with Recreate, as before.
coordinator:
  eventLog: true
  resume: true
  resumeMaxAge: 30m
  lease: false

# The engine behind the workspace-access workspace_query tool: read-only SQL over the
# artifacts of a discussion. sqlite (the default) runs queries inside the workspace-access process
# (pure Go, nothing to add to the image). none offers no query tool. duckdb runs them with the duckdb
# program, which the workspace-access image must carry. See
# docs/concepts/workspace.md.
# Every MCPServer that selects kubemootImage workspaceAccess gets WORKSPACE_QUERY_ENGINE.
# defaultAccess is the workspace access of every agent whose Agent and Crew declare none: none,
# read, write or readWrite. Leave it out and such an agent keeps storing every tool result and
# reading the workspace only through the tools in its enabledTools.
# The old artifacts.queryEngine is still read when workspace.queryEngine is not set, and is
# removed in the next release.
# Both are left out here so the chart can tell a set value from the default: queryEngine is sqlite
# when neither workspace.queryEngine nor the old artifacts.queryEngine is set.
workspace: {}
  # queryEngine: sqlite   # sqlite | duckdb | none
  # defaultAccess: read

# The RAG query service. Engine python (the default) runs one pod per RAGSource, as before. Engine
# go runs one Deployment per namespace that serves every RAGSource of the namespace from a registry
# the operator writes, in far less memory. Setting go moves every RAGSource to it and removes the
# per-RAGSource pods once the new one is available; setting python moves them back the same way.
# The Go service reads pgvector only. See docs/reference/ragsource-guide.md.
queryService:
  engine: python   # python | go

# Scale-to-zero configuration for KEDA-based agent autoscaling
scaleToZero:
  enabled: false  # Enable when KEDA is deployed
  cooldownPeriod: 300
  natsMonitoringEndpoint: "nats-headless.nats.svc.cluster.local:8222"

# Verification feature - allows triggering verification jobs via dashboard
# Off by default: the runner's ServiceAccount creates Jobs and reads Secrets
# cluster-wide, so enable it only on a cluster you use for testing.
verify:
  enabled: false
  # Test runner image for verification jobs. Kubemoot image tags are 0.0.0 in git; the
  # chart release stamps each from the component's tags (release-operator-chart.sh).
  image: test-runner:0.0.0
  # Deploy static verify jobs with the chart (optional - API creates jobs dynamically)
  deployJobs: false

# The scheduling crew: Kubemoot's own crew for scheduling work, in its own namespace.
# Its model-server-calibrator measures each ModelServer (load time, prompt and
# generation speed, parallel throughput, fit) through the accelerator-mcp tools and
# records the results on the server's status.calibration. Ask it with
# `kmctl conversation ask kubemoot-scheduling "Calibrate <server name>" -n kubemoot-scheduling`.
# It renders only when modelServers below is not empty. It ships no Models: like any
# crew it selects from the cluster's model catalog, requiring a model that calls
# tools and preferring a small, fast one. The catalog needs such a model: list one
# under modelServers[].models, or serve one on a vLLM server.
schedulingCrew:
  enabled: true
  namespace: kubemoot-scheduling
  # Namespaces whose pods may reach the crew's discussion gateway when
  # security.networkPolicies is on (the Crew's spec.network.allowedIngress). Each entry is a
  # namespace selector, for example the web server that lists every Crew and calls the one
  # you pick:
  #   allowedIngress:
  #     - matchLabels: {kubernetes.io/metadata.name: homelab-pilot}
  # Empty adds no network key to the Crew.
  allowedIngress: []
  # The crew's retention (the Crew's spec.retention). Its memory is always never: what it
  # learned about unchanged hardware leaves only by being superseded, invalidated, or
  # evicted by the size cap. conversationWindow is how long its conversations are kept after
  # the last turn, in the duration form of a Crew's retention (7d, 36h, 1w).
  retention:
    conversationWindow: 7d
  gateway:
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 1Gi

# accelerator-mcp - a core MCP server: one copy in the operator's namespace that any
# crew's gateway may register (coreServerSelector). It lists ModelServers, reads their
# live state, probes their models, and records calibration on their status. The
# scheduling crew's calibrator uses it. Needs NATS (server tickets and history).
acceleratorMcp:
  enabled: true
  image: accelerator-mcp:0.0.0
  # Requests are for a small install; there is no CPU limit.
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

# KubemootConfig - centralized default images for all components
# Crew liaison: every crew as one MCP agent for external clients (Claude Code and any
# other MCP client). Installed with the operator; cluster-internal until a route is
# enabled. See crew-liaison/README.md.
liaison:
  enabled: true
  image: crew-liaison:0.0.0
  replicas: 1
  maxInflight: 4            # discussions at once; each spends GPU time
  ticketTTLMinutes: 60
  # The name a chat app shows for this install's door (the MCP server title). Neutral by
  # default; name it for your community or organization, never for one crew.
  displayName: Kubemoot
  # Bearer token for /mcp. Empty means no token: only do that behind an edge that
  # authenticates (for example Cloudflare Access). existingSecret wins over token.
  auth:
    token: ""
    existingSecret: ""
    key: token
    # Check Kubernetes bearer tokens (TokenReview) so the liaison knows who is asking: a
    # caller's token is passed to the crew's gateway, and a ticket can be read only by the
    # caller who asked. A shared token above still works and acts as an anonymous caller.
    # Off, the liaison behaves as it always has.
    kubernetesTokens: false
    # With kubernetesTokens on, accept a caller that sends no token as anonymous.
    allowAnonymous: false
    # Services whose acceptance of a person's own bearer token proves who that person is, so a
    # chat app signed in to the service can ask a crew as that person. The same list and keys
    # as a Crew's spec.discussion.access.serviceTokens (name, verifyURL, subjectClaim,
    # audiences, maxCacheSeconds, passToTools, authorize, subjects). The liaison is one process
    # for every crew: its list is for the whole liaison, and a crew whose gateway does not
    # list the same service refuses the token. Empty, no service token is accepted.
    serviceTokens: []
    # The install's hash key, a Secret in this release's namespace that you create. It turns a
    # person's account id into the opaque id the bus carries, so it must hold the same value
    # as the Secret each crew names in hashKeySecretRef. Needed once serviceTokens is set.
    hashKeySecret:
      name: ""
      key: hash-key
  # The OAuth sign-in front a chat app signs in through, so it holds a person's own token for
  # a service in serviceTokens. Stateless: it keeps no token, no session and no client record,
  # only the sealing keys below. Off by default. Needs liaison.expose so the chat app and the
  # person's browser can reach /oauth and /.well-known on the hostname.
  signIn:
    enabled: false
    # The liaison's public base URL as the chat app and the browser reach it: https:// plus the
    # door hostname (expose.hostname, else gateway.hostname). The chart refuses any other value,
    # because the discovery documents and redirect addresses must name the host the route serves.
    publicURL: ""
    upstream:
      # The service's authorization and token endpoints, and the client id the front registered
      # with the service.
      authorizeURL: ""
      tokenURL: ""
      clientId: ""
      scopes: "openid offline_access"
    # A Secret you create in this namespace: a key holding one or more "id:base64key" lines,
    # each key 32 random bytes in base64. The first seals new codes; older ones still open.
    sealKeySecret:
      name: ""
      key: seal-keys
    # Hosts an https redirect address may use (loopback http is always allowed). Empty allows
    # any host, so anyone could register a redirect address and ask a person to sign in to it:
    # always set it on a shared deployment. Required when identity.provider is set and
    # liaison.expose is on.
    allowedRedirectHosts: []
    # The door's own identity, instead of relaying one service's sign-in (leave upstream empty).
    # The liaison becomes an authorization server for /mcp: the person signs in at your OpenID
    # Connect issuer and is the person asking; the chat app gets a token for this door only.
    # Off by default.
    identity:
      # "" (off) or "oidc".
      provider: ""
      oidc:
        issuer: ""
        clientId: ""
        # A Secret you create in this namespace holding the client secret. Register
        # <publicURL>/oauth/callback as the client's redirect address at the issuer.
        clientSecret:
          name: ""
          key: client-secret
        scopes: "openid profile"
        # The ID token claim that lists the person's groups, and the prefix on the user name and
        # every group, as Kubernetes RBAC will see them (for example the user oidc:<subject>).
        groupsClaim: groups
        userPrefix: "oidc:"
      # A Secret you create: ECDSA P-256 private keys as PEM. The first signs access tokens; list
      # a new key first and keep the old one until its tokens expire (15 minutes) to rotate.
      signingKeySecret:
        name: ""
        key: signing-keys
      # Optional. A Secret with the key that signs the assertion of who is asking, which a crew
      # lists the public half of in spec.discussion.access.trustedHops. Without it no crew that
      # verifies callers can be asked through the door.
      hopKeySecret:
        name: ""
        key: hop-keys
      # How long a sign-in lasts at most, in hours, however it is used.
      refreshMaxHours: 24
  # Where the liaison keeps what it must remember between requests, sealed, with a time to live
  # on every value: the door's single-use marks (a code or refresh token used twice is refused)
  # and, when connectedAccounts is on, the connected accounts. "memory" keeps it in the pod: a
  # restart forgets it and replicas do not share it, so it fits one replica and a trial.
  # "nats" keeps it in a JetStream key-value bucket on the NATS server the install already runs
  # (nats.* above; nothing new to install). "openbao" keeps it in an OpenBao (or compatible)
  # KV version 2 mount, for installs that want a vault with its own audit log and policies.
  # "" picks nats when nats.enabled and the door's identity is on, else memory.
  state:
    backend: ""
    openbao:
      address: ""            # https://... of the server
      mount: secret          # the KV v2 mount
      prefix: kubemoot-liaison
      tokenSecret:           # a Secret you create: the token the liaison presents
        name: ""
        key: token
      caSecret:              # optional: a Secret with the CA that signed the server certificate
        name: ""
        key: ca.crt
  # Outside services whose accounts a person may connect, so a crew's tools act as that person
  # there. A Crew declares the accounts it needs in spec.connectedAccounts (what, where the
  # service's sign-in lives, which hosts the token may reach); this install registers a client
  # with each service. The operator reports a Crew that declares a name missing here as
  # ConnectedAccounts=False, reason UnregisteredAccount.
  #
  # Kubemoot keeps no one's data by default. Nothing is kept unless enabled is true, a crew
  # declares the account and the person presses Connect. What is kept is a sealed token, deleted
  # when the person disconnects or signs out of the door, after 30 days unused, and when the
  # service's own lifetime for it ends. Needs signIn.identity (the person is the one the door
  # signed in), auth.hashKeySecret, and state.backend nats or openbao when replicas is above 1.
  connectedAccounts:
    enabled: false
    # A Secret you create: "id:base64key" lines, each key 32 random bytes in base64. The first
    # seals new records; older ones still open, so keys rotate. Apart from signIn.sealKeySecret.
    sealKeySecret:
      name: ""
      key: vault-keys
    # The port a crew's discussion gateway asks for a person's token and connection state. It
    # is served inside the cluster only and checks the gateway's own ServiceAccount token.
    brokerPort: 8081
    # Account name (a DNS label) to the install's client at that service.
    accounts: {}
    #   library:
    #     clientId: "<the id registered at the service for <signIn.publicURL>/oauth/callback>"
    #     clientSecret: {name: "", key: client-secret}   # optional; a public client uses PKCE alone
    #     hosts: []                 # pin the service: the endpoints and token hosts a crew declares must be on these
    #                               # hosts. Required with clientSecret; needed unless allowedCrews is set
    #     issuer: ""                # the service's issuer (RFC 9207); empty accepts its endpoint's host
    #     allowedCrews: []          # namespace/name of each crew that may use it; set this or hosts (the chart refuses neither)
    #     maxLifetimeHours: 0       # the longest the service lets a connection stand; 0 for no limit
  # Public route through the Gateway API listener configured under `gateway` above.
  # The route carries exactly /mcp, plus /oauth and /.well-known when signIn is on, and nothing
  # else (never the dashboard); the hostname defaults to gateway.hostname.
  expose:
    enabled: false
    hostname: ""
  # The CPU limit stays; the limit is about 3x the largest use seen.
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 48Mi
      ephemeral-storage: 16Mi

# Placement service: the one writer that decides where each model call runs and owns
# tickets. Off by default. Replicas elect a leader through NATS; only the leader is
# Ready (standbys are Running, not Ready, by design). No Kubernetes API access.
placementService:
  enabled: false
  # Turns agents onto the service: the KubemootConfig carries
  # defaults.scheduler.placementService. Off, agents place in-process.
  agentsUse: false
  # Base URL agents and Moot Mesh sidecars call; empty means the in-cluster Service
  # on port 8080 when the service is enabled, else each sidecar uses the model server
  # its Agent was bound to.
  url: ""
  replicaCount: 2
  image: placement-service:0.0.0
  # Also the TTL of the kubemoot_placement_leader bucket. An existing bucket keeps its TTL
  # (the stream job only creates missing buckets); delete the bucket to apply a new value.
  leaseSeconds: 15
  ticketTtlSeconds: 600
  # Optional NATS credentials from an existing Secret (NATS_USER, NATS_PASSWORD).
  nats:
    existingSecret: ""
    userKey: user
    passwordKey: password
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 192Mi
      ephemeral-storage: 32Mi
  nodeSelector: {}
  tolerations: []
  # Replaces the default soft anti-affinity on hostname when set.
  affinity: {}

kubemootConfig:
  # Whether to create the default KubemootConfig singleton
  create: true
  # Default container images for Kubemoot components
  # Kubemoot images are "name:version" and get global.imageRegistry prefixed at render.
  # The tags are 0.0.0 in git: every chart build stamps each component's version from
  # its git tags (a release candidate the latest candidate, a release the final), so a
  # packaged chart always pins explicit versions. Never :latest.
  images:
    indexer: indexer:0.0.0
    queryService: query-service:0.0.0
    queryServiceGo: query-service-go:0.0.0
    agentRuntime: agent-runtime:0.0.0
    agentSidecar: agent-sidecar:0.0.0
    harnessGoose: harness-goose:0.0.0
    mcpGateway: mcp-gateway:0.0.0
    mcpBridge: mcp-bridge:0.0.0
    discussionGateway: discussion-gateway:0.0.0
    fitnessRunner: fitness-runner:0.0.0
    workspaceAccess: workspace-access:0.0.0
    doclingServe: quay.io/docling-project/docling-serve-cpu:latest
  # Default configurations
  defaults:
    vectorStoreType: pgvector
    embeddingModel: nomic-embed
    # RuntimeClass for the pods of every Agent, for example gvisor (see docs/concepts/isolation.md).
    # Empty: agent pods set no runtimeClassName. An Agent's spec.deployment.runtimeClassName wins.
    agentRuntimeClassName: ""

# Crews — named agent teams with optional discussion gateways
# Each crew groups agents via the kubemoot.ai/crew label and deploys
# a discussion gateway as the crew's HTTP entry point for external clients.
crews: []
# Example:
#   - name: homelab-pilot
#     description: "Infrastructure conversation crew"
#     discussion:
#       enabled: true

# Admission webhooks for domain-logic validation
webhook:
  enabled: true
  port: 9443
  failurePolicy: Fail
  certManager:
    enabled: true

# The operator's reports (crew memory and conversation export, the fitness report, the
# component status) as an aggregated API, reports.kubemoot.ai/v1alpha1. The API server
# authenticates a caller with whatever their kubeconfig holds (a client certificate, OIDC, a
# token) and forwards the result over mutual TLS, so their own RBAC decides what they read:
# kmctl and CrewForge use it when it is available, and `kubectl get --raw
# /apis/reports.kubemoot.ai/v1alpha1/componentstatuses` reaches it.
#
# Off by default. An APIService that is unavailable makes API discovery slow and noisy for
# every client of the cluster, it needs a certificate (cert-manager, or one made here), it
# adds a Role in kube-system, and some managed control planes do not allow aggregated APIs.
# An install that cannot take those must not get them by upgrading.
reportsAPI:
  enabled: false
  port: 8444
  groupPriorityMinimum: 1000
  versionPriority: 15
  tls:
    certManager:
      # cert-manager issues the serving certificate and puts its CA in the APIService. Off:
      # the chart makes a self-signed certificate and keeps it across upgrades; delete the
      # Secret to make a new one.
      enabled: true
  rbac:
    # Lets every authenticated user through the API server's own check of the aggregated
    # path. The operator still asks whether they may get the underlying Crew,
    # CrewFitnessSuite or ModelServers, so this opens a door and grants no data. Off: bind
    # the ClusterRole <release>-kubemoot-operator-reports-api to who may use it.
    bindAuthenticated: true

# ModelServers declare the inference servers Kubemoot schedules models onto. They are
# infrastructure: agents never name a server, the scheduler places each call. The
# list is empty because a chart cannot point at a server that does not exist; install
# a server first, then list it here.
#
# vLLM is the preferred engine for an installation: install the kubemoot-vllm chart
# first (release name kubemoot-vllm, namespace vllm) and point serviceRef at its
# Service. Ollama stays supported, and is the engine of the quickstart.
#
# Each entry: name, type (vllm or ollama), optional namespace (default: the release
# namespace), optional schedulingWeight (spec.scheduling.weight) and optional
# memoryMiB (spec.scheduling.memoryMiB: the memory budget the fit gate spends
# when the operator cannot discover one, such as the host RAM of a CPU server;
# unset there, agents refuse cold loads on that server).
# A vllm server has no endpoint. It sets exactly one of serviceRef ({name,
# namespace}: the Service of a vLLM install such as the kubemoot-vllm chart; the
# operator finds the servers from its ports) or servers (a list of {model,
# endpoint} for vLLM deployed another way), and optionally sleepLevel (it must equal
# the kubemoot-vllm release's sleepLevel). All three are copied into the ModelServer
# spec as they are. An ollama server sets endpoint.
# models (optional): the cluster's model catalog entries for the server, each rendered as
# a Model in the server's namespace: {model, parameters, capabilities, contextLength,
# acceleratorMemoryMiB (vramMib is the deprecated old name), labels, disabled}. An Ollama server downloads each model that is missing. Only
# `model` is needed for Ollama: Kubemoot reads the size, context and abilities from the
# server. Every chat model a server reports joins the catalog without an entry; add one to
# have the model downloaded, to declare what the server cannot report, to add labels, or
# (disabled: true) to keep a model out. A vLLM model needs no entry when it is served by the
# kubemoot-vllm chart, which declares each model's parameters and capabilities itself.
# Crews ship no Models; they select from this catalog by label.
# Example:
#   - name: vllm-gpu
#     type: vllm
#     sleepLevel: 1
#     serviceRef: {name: kubemoot-vllm, namespace: vllm}
#   - name: vllm-external
#     type: vllm
#     servers:
#       - {model: "qwen3:14b", endpoint: "http://vllm-14b.models:8000"}
#   - name: ollama-cpu
#     type: ollama
#     endpoint: http://ollama.ollama:11434
#     memoryMiB: 20480
#     models:
#       - model: qwen2.5:1.5b
modelServers: []

# Grafana dashboard provisioning via sidecar ConfigMap discovery
grafana:
  dashboards:
    # Kubemoot's dashboards (overview, discussions, scheduler) as ConfigMaps for
    # Grafana's dashboard sidecar, which the Grafana Helm chart and
    # kube-prometheus-stack run. Grafana is optional.
    enabled: true
    # The label the sidecar loads ConfigMaps by, and its value.
    label: grafana_dashboard
    labelValue: "1"
    # The Grafana folder the dashboards land in.
    folder: Kubemoot
    # Where the sidecar looks; empty is the release namespace.
    namespace: ""
    # With the Grafana Operator: a GrafanaDashboard per dashboard, for the Grafana
    # instances instanceSelector matches (rendered only when its API is served).
    # instanceSelector is required when enabled, for example
    # {matchLabels: {dashboards: grafana}}.
    grafanaOperator:
      enabled: false
      instanceSelector: {}

# NotificationSink mock receiver — a small Python HTTP server that logs
# every POST it receives. Ships disabled by default; flip on for smoke
# tests of the NotificationSink dispatcher without standing up an
# external webhook.site or ntfy endpoint. The pod runs in the operator's
# namespace; point a NotificationSink at
# http://<service-name>.<operator-namespace>:80/ to capture dispatches.
notifications:
  receiverMock:
    enabled: false
    image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
      requests:
        cpu: 5m
        memory: 32Mi

# Kubemoot dashboard, an optional subchart (dashboard/charts/kubemoot-dashboard).
# OFF by default: the dashboard is read-only but has no authentication, so whoever reaches
# it can read discussions and crew memory (see SECURITY.md). Enable it on a cluster you control:
#   helm install ... --set dashboard.enabled=true
# then reach it with kubectl port-forward; its Gateway route stays off.
# Every other key under dashboard: takes the standalone chart's default and is documented
# in that chart's values.yaml (image.tag, resources, gateway, rbac, ...). global.imageRegistry
# and global.imagePullSecrets above apply to it; here global.imageRegistry replaces
# dashboard.image.registry and any path in dashboard.image.repository (only its last
# element, "dashboard", is used). The two names below are set empty so
# they derive from the release name and cannot collide with a standalone
# kubemoot-dashboard release in the same cluster.
dashboard:
  enabled: false
  serviceAccount:
    name: ""
  rbac:
    clusterRole:
      name: ""
  # A second dashboard for workshop attendees, off by default. It is the same
  # image and tag as the dashboard above (read-only like it), set by environment to
  # show only the namespaces matching namespaceSelector, with its own ServiceAccount that
  # can only read (no Secrets). Reach it with kubectl port-forward to the Service
  # <dashboard fullname>-workshop. Needs dashboard.enabled=true. Keys (see the dashboard
  # chart's values.yaml): workshop.enabled, workshop.namespaceSelector,
  # workshop.infraNamespace, workshop.replicaCount, workshop.resources.
  #   --set dashboard.enabled=true --set dashboard.workshop.enabled=true
