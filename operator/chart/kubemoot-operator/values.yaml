# Kubemoot Operator Helm Chart Values

replicaCount: 1

global:
  # Registry and namespace prefixed to every Kubemoot image below (operator,
  # components, test runner). Public releases are published to GHCR. A private
  # mirror sets this to its own registry, e.g. harbor.example.com/kubemoot, and
  # adds its pull secret under imagePullSecrets. An image value that already
  # contains a "/" is used as-is (third-party images such as doclingServe).
  imageRegistry: ghcr.io/kubemoot
  # Pull secrets for global.imageRegistry, applied to the operator and to the dashboard
  # subchart. Merged with the chart-level imagePullSecrets below.
  imagePullSecrets: []

image:
  repository: kubemoot-operator
  tag: ""  # Defaults to Chart.appVersion if empty
  pullPolicy: IfNotPresent

# Pull secrets for global.imageRegistry. Empty for the public registry.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 1Gi
  requests:
    cpu: 10m
    memory: 128Mi
    ephemeral-storage: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

# MCP Bridge Injection defaults
# Used for stdio transport MCP servers to bridge HTTP/SSE ↔ stdio
# Uses kubemoot-mcp-bridge static binary injected via init container (works with any image)
proxyInjection:
  # Default port for the HTTP/SSE bridge
  port: 8080

# Secret replication: the operator copies Secrets (image pull secrets, vector-store
# credentials, the kubemoot.ai/replicate-secrets annotation) into crew namespaces
# only from its own namespace plus the namespaces listed here. Every other source
# namespace is refused.
secretReplication:
  allowedSourceNamespaces: []

# Gateway API configuration for crew discussion HTTPRoutes
gateway:
  enabled: false
  name: gateway
  namespace: default
  hostname: kubemoot.example.com

# Leader election for HA
leaderElection:
  enabled: true
  # Lease tuning — controller-runtime defaults are 15s/10s/2s which is too
  # aggressive for clusters where the K8s API ClusterIP can briefly time
  # out (homelabs, k8s control-plane under load). 60s/50s/10s tolerates
  # blips up to about 50 seconds without unseating the leader. Trade-off:
  # slower failover when a leader genuinely dies (~60s). Fine for a
  # 1-replica deployment where the "failover" is just the new pod
  # starting up after restart.
  leaseDuration: 60s
  renewDeadline: 50s
  retryPeriod: 10s

# Metrics configuration
metrics:
  enabled: true
  port: 8080
  # Prometheus scraping, for a Prometheus that runs the Prometheus Operator (for
  # example kube-prometheus-stack): PodMonitors for the agents and the operator,
  # rendered only when the cluster serves the PodMonitor API. Kubemoot runs without
  # Prometheus; scraping is optional and recommended.
  podMonitor:
    enabled: true
    # Labels your Prometheus selects monitors by; kube-prometheus-stack selects
    # release: <its Helm release name> unless configured otherwise.
    labels: {}
    # Scrape interval; empty uses Prometheus's default.
    interval: ""

# Health probes
health:
  port: 8081

# Internal control plane agents (deployed to same namespace as operator)
# These agents handle MCP quality evaluation and catalog discovery.
# Off by default: enabling installs MCP servers with cluster read access
# (see mcpServers below). Opt in only on clusters where every pod is trusted.
internalAgents:
  enabled: false
  # MCP Quality Evaluator Agent
  qualityEvaluator:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # MCP Chronicler Agent (persistent learning memory)
  # Records deployment/connection/tool-call results and advises on best configurations
  chronicler:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # MCP Catalog Discovery Agent (for non-standard registries)
  catalogDiscovery:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # Onboarding Agent (detects capability gaps, proposes new MCP tools)
  onboardingAgent:
    enabled: false
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # RTFM Agent (finds documentation for onboarded tools, creates RAGSources)
  rtfmAgent:
    enabled: false
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # MCP Tool Servers for internal agents
  # These provide tools for discovery and evaluation
  mcpServers:
    enabled: true
    # Kubernetes MCP - provides k8s CRUD tools
    # Using mcp/kubernetes from Docker Hub (official MCP server image); the
    # repository publishes only a floating tag, so the image is pinned by digest.
    # Its ServiceAccount reads cluster state but no Secrets.
    kubernetes:
      enabled: true
      image: mcp/kubernetes@sha256:5ffbf7f0a8aa7a58dfcf8d34807fd42a9cd7d88d88a5de88f472edfc3133af73
      command: ["node", "dist/index.js"]
      securityMode: strict  # Node.js image, no root access needed
      # replicas: 2 — stdio MCP servers exit cleanly when the bridge gateway
      # closes its connection (normal occurrence on long discussions or under
      # SIGTERM during routine restarts). Two replicas ensure the Service
      # always has at least one Ready pod even when one is restarting.
      # Same pattern as prometheus-mcp (homelab-pilot crew) and the
      # [[Prometheus MCP Connection Cycling]] kanban card.
      replicas: 2
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
    # Fetch MCP - provides HTTP/web fetching tools
    fetch:
      enabled: true
      image: mcp/fetch@sha256:1a7a0996a565a0b8ca5c41b42830d4e5f334d33f851596bbd9debb2beedb22d3
      command: ["/app/.venv/bin/mcp-server-fetch"]
      securityMode: relaxed  # Python/uv image, interpreter under /root/ (mode 700)
      # replicas: 2 — fetch-mcp was observed restarting every 2 minutes
      # (163 restarts in 11h, Exit 0 / Reason: Completed — stdio
      # MCP-server-exits-when-bridge-disconnects pattern). Each restart
      # triggered MCPServer status reconcile → enqueued MCPGateway
      # reconcile → all 6 MCPServers re-registered with the gateway
      # (~10 reconciles/min noise). Stabilising fetch-mcp with a second
      # replica eliminates the amplifier; the gateway-side predicate
      # filter is separately tracked in [[MCPGateway Reconcile Loop]].
      replicas: 2
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
    # GitHub MCP - provides GitHub API tools
    # Requires GITHUB_PERSONAL_ACCESS_TOKEN — server exits without it
    # Uses exec mode (no shell required) for distroless/scratch images
    github:
      enabled: false  # Enable after creating github-token secret
      image: ghcr.io/github/github-mcp-server:v1.12.2
      command: ["/server/github-mcp-server", "stdio"]
      securityMode: strict  # Go binary on distroless, no root access needed
      replicas: 1
      # Optional: Reference to secret containing GitHub token
      # Maps secret key to GITHUB_PERSONAL_ACCESS_TOKEN env var
      secretRef: ""
      secretKey: "password"  # Key in the secret containing the token
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

# NATS JetStream carries every discussion, so a Kubemoot install needs a NATS server
# with JetStream enabled (the quickstart installs the upstream nats chart as release
# "nats" in namespace "nats"). The chart bootstraps the streams and KV buckets with a
# post-install Job.
nats:
  enabled: true
  url: "nats://nats.nats.svc.cluster.local:4222"
  # MCPServer that lets agents inspect NATS (sinadarbouy/mcp-nats, Apache-2.0, via
  # mcp-bridge). Off for a minimal install; the operator needs only the server above.
  # A crew's gateway selects servers in its own namespace, so a crew that should use
  # it needs its own MCPServer; this one serves agents in the operator's namespace.
  mcpServer:
    enabled: false   # an MCPServer that lets agents inspect NATS; opt in per cluster
    image: ghcr.io/sinadarbouy/mcp-nats:0.1.4

# Scale-to-zero configuration for KEDA-based agent autoscaling
scaleToZero:
  enabled: false  # Enable when KEDA is deployed
  cooldownPeriod: 300
  natsMonitoringEndpoint: "nats-headless.nats.svc.cluster.local:8222"

# Verification feature - allows triggering verification jobs via dashboard
# Off by default: the runner's ServiceAccount creates Jobs and reads Secrets
# cluster-wide, so enable it only on a cluster you use for testing.
verify:
  enabled: false
  # Test runner image for verification jobs. Kubemoot image tags are 0.0.0 in git; the
  # chart release stamps each from the component's tags (release-operator-chart.sh).
  image: test-runner:0.0.0
  # Deploy static verify jobs with the chart (optional - API creates jobs dynamically)
  deployJobs: false

# The scheduling crew: Kubemoot's own crew for scheduling work, in its own namespace.
# Its model-server-calibrator measures each ModelServer (load time, prompt and
# generation speed, parallel throughput, fit) through the accelerator-mcp tools and
# records the results on the server's status.calibration. Ask it with
# `kmctl conversation ask kubemoot-scheduling "Calibrate <server name>" -n kubemoot-scheduling`.
# It renders only when modelServers below is not empty. It ships no Models: like any
# crew it selects from the cluster's model catalog, requiring a model that calls
# tools and preferring a small, fast one. The catalog needs such a model: list one
# under modelServers[].models, or serve one on a vLLM server.
schedulingCrew:
  enabled: true
  namespace: kubemoot-scheduling
  gateway:
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 1Gi

# accelerator-mcp - a core MCP server: one copy in the operator's namespace that any
# crew's gateway may register (coreServerSelector). It lists ModelServers, reads their
# live state, probes their models, and records calibration on their status. The
# scheduling crew's calibrator uses it. Needs NATS (server tickets and history).
acceleratorMcp:
  enabled: true
  image: accelerator-mcp:0.0.0
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# KubemootConfig - centralized default images for all components
# Crew liaison: every crew as one MCP agent for external clients (Claude Code and any
# other MCP client). Installed with the operator; cluster-internal until a route is
# enabled. See crew-liaison/README.md.
liaison:
  enabled: true
  image: crew-liaison:0.0.0
  replicas: 1
  maxInflight: 4            # discussions at once; each spends GPU time
  ticketTTLMinutes: 60
  # Bearer token for /mcp. Empty means no token: only do that behind an edge that
  # authenticates (for example Cloudflare Access). existingSecret wins over token.
  auth:
    token: ""
    existingSecret: ""
    key: token
  # Public route through the Gateway API listener configured under `gateway` above.
  # Path /mcp on the hostname; the hostname defaults to gateway.hostname.
  expose:
    enabled: false
    hostname: ""
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 16Mi

# Placement service: the one writer that decides where each model call runs and owns
# tickets. Off by default. Replicas elect a leader through NATS; only the leader is
# Ready (standbys are Running, not Ready, by design). No Kubernetes API access.
placementService:
  enabled: false
  # Turns agents onto the service: the KubemootConfig carries
  # defaults.scheduler.placementService. Off, agents place in-process.
  agentsUse: false
  # Base URL agents and Moot Mesh sidecars call; empty means the in-cluster Service
  # on port 8080 when the service is enabled, else each sidecar uses the model server
  # its Agent was bound to.
  url: ""
  replicaCount: 2
  image: placement-service:0.0.0
  # Also the TTL of the kubemoot_placement_leader bucket. An existing bucket keeps its TTL
  # (the stream job only creates missing buckets); delete the bucket to apply a new value.
  leaseSeconds: 15
  ticketTtlSeconds: 600
  # Optional NATS credentials from an existing Secret (NATS_USER, NATS_PASSWORD).
  nats:
    existingSecret: ""
    userKey: user
    passwordKey: password
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 192Mi
      ephemeral-storage: 32Mi
  nodeSelector: {}
  tolerations: []
  # Replaces the default soft anti-affinity on hostname when set.
  affinity: {}

kubemootConfig:
  # Whether to create the default KubemootConfig singleton
  create: true
  # Default container images for Kubemoot components
  # Kubemoot images are "name:version" and get global.imageRegistry prefixed at render.
  # The tags are 0.0.0 in git: every chart build stamps each component's version from
  # its git tags (a release candidate the latest candidate, a release the final), so a
  # packaged chart always pins explicit versions. Never :latest.
  images:
    indexer: indexer:0.0.0
    queryService: query-service:0.0.0
    agentRuntime: agent-runtime:0.0.0
    agentSidecar: agent-sidecar:0.0.0
    harnessGoose: harness-goose:0.0.0
    mcpGateway: mcp-gateway:0.0.0
    mcpBridge: mcp-bridge:0.0.0
    discussionGateway: discussion-gateway:0.0.0
    fitnessRunner: fitness-runner:0.0.0
    artifactAccess: artifact-access:0.0.0
    doclingServe: quay.io/docling-project/docling-serve-cpu:latest
  # Default configurations
  defaults:
    vectorStoreType: pgvector
    embeddingModel: nomic-embed

# Crews — named agent teams with optional discussion gateways
# Each crew groups agents via the kubemoot.ai/crew label and deploys
# a discussion gateway as the crew's HTTP entry point for external clients.
crews: []
# Example:
#   - name: homelab-pilot
#     description: "Homelab infrastructure conversation crew"
#     discussion:
#       enabled: true

# Admission webhooks for domain-logic validation
webhook:
  enabled: true
  port: 9443
  failurePolicy: Fail
  certManager:
    enabled: true

# ModelServers declare the inference servers Kubemoot schedules models onto. They are
# infrastructure: agents never name a server, the scheduler places each call. The
# list is empty because a chart cannot point at a server that does not exist; install
# a server first, then list it here.
#
# vLLM is the preferred engine for an installation: install the kubemoot-vllm chart
# first (release name kubemoot-vllm, namespace vllm) and point serviceRef at its
# Service. Ollama stays supported, and is the engine of the quickstart.
#
# Each entry: name, type (vllm or ollama), optional namespace (default: the release
# namespace), optional schedulingWeight (spec.scheduling.weight) and optional
# memoryMiB (spec.scheduling.memoryMiB: the memory budget the fit gate spends
# when the operator cannot discover one, such as the host RAM of a CPU server;
# unset there, agents refuse cold loads on that server).
# A vllm server has no endpoint. It sets exactly one of serviceRef ({name,
# namespace}: the Service of a vLLM install such as the kubemoot-vllm chart; the
# operator finds the servers from its ports) or servers (a list of {model,
# endpoint} for vLLM deployed another way), and optionally sleepLevel (it must equal
# the kubemoot-vllm release's sleepLevel). All three are copied into the ModelServer
# spec as they are. An ollama server sets endpoint.
# models (optional): the cluster's model catalog entries for the server, each rendered as
# a Model in the server's namespace: {model, parameters, capabilities, contextLength,
# vramMib, labels, disabled}. An Ollama server downloads each model that is missing. Only
# `model` is needed for Ollama: Kubemoot reads the size, context and abilities from the
# server. Every chat model a server reports joins the catalog without an entry; add one to
# have the model downloaded, to declare what the server cannot report, to add labels, or
# (disabled: true) to keep a model out. A vLLM model needs no entry when it is served by the
# kubemoot-vllm chart, which declares each model's parameters and capabilities itself.
# Crews ship no Models; they select from this catalog by label.
# Example:
#   - name: vllm-gpu
#     type: vllm
#     sleepLevel: 1
#     serviceRef: {name: kubemoot-vllm, namespace: vllm}
#   - name: vllm-external
#     type: vllm
#     servers:
#       - {model: "qwen3:14b", endpoint: "http://vllm-14b.models:8000"}
#   - name: ollama-cpu
#     type: ollama
#     endpoint: http://ollama.ollama:11434
#     memoryMiB: 20480
#     models:
#       - model: qwen2.5:1.5b
modelServers: []

# Grafana dashboard provisioning via sidecar ConfigMap discovery
grafana:
  dashboards:
    # Kubemoot's dashboards (overview, discussions, scheduler) as ConfigMaps for
    # Grafana's dashboard sidecar, which the Grafana Helm chart and
    # kube-prometheus-stack run. Grafana is optional.
    enabled: true
    # The label the sidecar loads ConfigMaps by, and its value.
    label: grafana_dashboard
    labelValue: "1"
    # The Grafana folder the dashboards land in.
    folder: Kubemoot
    # Where the sidecar looks; empty is the release namespace.
    namespace: ""
    # With the Grafana Operator: a GrafanaDashboard per dashboard, for the Grafana
    # instances instanceSelector matches (rendered only when its API is served).
    # instanceSelector is required when enabled, for example
    # {matchLabels: {dashboards: grafana}}.
    grafanaOperator:
      enabled: false
      instanceSelector: {}

# NotificationSink mock receiver — a small Python HTTP server that logs
# every POST it receives. Ships disabled by default; flip on for smoke
# tests of the NotificationSink dispatcher without standing up an
# external webhook.site or ntfy endpoint. The pod runs in the operator's
# namespace; point a NotificationSink at
# http://<service-name>.<operator-namespace>:80/ to capture dispatches.
notifications:
  receiverMock:
    enabled: false
    image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
      requests:
        cpu: 5m
        memory: 32Mi

# Kubemoot dashboard, an optional subchart (dashboard/charts/kubemoot-dashboard).
# OFF by default: the dashboard has no authentication and can purge NATS streams and
# delete models (see SECURITY.md). Enable it on a cluster you control:
#   helm install ... --set dashboard.enabled=true
# then reach it with kubectl port-forward; its Gateway route stays off.
# Every other key under dashboard: takes the standalone chart's default and is documented
# in that chart's values.yaml (image.tag, resources, gateway, rbac, ...). global.imageRegistry
# and global.imagePullSecrets above apply to it; here global.imageRegistry replaces
# dashboard.image.registry and any path in dashboard.image.repository (only its last
# element, "dashboard", is used). The two names below are set empty so
# they derive from the release name and cannot collide with a standalone
# kubemoot-dashboard release in the same cluster.
dashboard:
  enabled: false
  serviceAccount:
    name: ""
  rbac:
    clusterRole:
      name: ""
  # A second, read-only dashboard for workshop attendees, off by default. It is the same
  # image and tag as the dashboard above, set by environment to refuse every write and to
  # show only the namespaces matching namespaceSelector, with its own ServiceAccount that
  # can only read (no Secrets). Reach it with kubectl port-forward to the Service
  # <dashboard fullname>-workshop. Needs dashboard.enabled=true. Keys (see the dashboard
  # chart's values.yaml): workshop.enabled, workshop.namespaceSelector,
  # workshop.infraNamespace, workshop.replicaCount, workshop.resources.
  #   --set dashboard.enabled=true --set dashboard.workshop.enabled=true
