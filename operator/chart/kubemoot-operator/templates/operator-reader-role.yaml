# What the dashboard's operator page reads beyond the built-in `view` role: the custom resource
# definitions (to count the Kubemoot types registered) and the leader-election lease (to name the
# leading operator pod). The operator Deployment and its pods are already readable with `view`.
# Read verbs only, and not aggregated into view, edit or admin: it would widen those roles beyond
# Kubemoot, so it is bound on purpose, to the people who should see the whole page. Without it the
# page says plainly which line the account may not read.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemoot-operator-reader
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
