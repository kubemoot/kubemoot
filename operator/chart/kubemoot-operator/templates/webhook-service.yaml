{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: https
      port: 443
      targetPort: webhook-server
      protocol: TCP
  selector:
    {{- include "kubemoot-operator.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
