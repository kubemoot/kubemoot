{{/*
Read access for the Kubernetes MCP servers, granted per namespace.

kubemoot-kubernetes-mcp-read holds namespaced reads only. The operator binds it with a
RoleBinding in each namespace labeled kubemoot.ai/crew-read=true, to the ServiceAccount of
every MCPServer that has the kubernetes capability. No Secrets, no exec, no writes.

kubemoot-kubernetes-mcp-namespaces holds the one cluster-scoped kind the servers need,
the namespace list itself, which a RoleBinding cannot grant. The operator keeps the
ClusterRoleBinding of the same name. Nodes, volumes and other cluster-scoped kinds are not
granted here; a crew that needs them grants them itself.

The operator holds `bind` on these two names only (see rbac.yaml).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemoot-kubernetes-mcp-read
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["helmrepositories", "helmcharts", "ocirepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubemoot.ai"]
    resources: ["agents", "mcpservers", "mcpgateways", "ragsources", "models", "modelproviders"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemoot-kubernetes-mcp-namespaces
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
