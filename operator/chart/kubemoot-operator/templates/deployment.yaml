apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubemoot-operator.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      labels:
        {{- include "kubemoot-operator.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      {{- with (include "kubemoot-operator.pullSecrets" . | fromYamlArray) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubemoot-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "kubemoot-operator.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command: the image entrypoint starts the manager (the buildpacks launcher
          # at /cnb/process/web, which runs /workspace/manager with these args).
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            - --leader-lease-duration={{ .Values.leaderElection.leaseDuration | default "60s" }}
            - --leader-renew-deadline={{ .Values.leaderElection.renewDeadline | default "50s" }}
            - --leader-retry-period={{ .Values.leaderElection.retryPeriod | default "10s" }}
            {{- end }}
            - --health-probe-bind-address=:{{ .Values.health.port }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- if .Values.webhook.enabled }}
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            {{- end }}
            {{- if .Values.reportsAPI.enabled }}
            - --reports-api-bind-address=:{{ .Values.reportsAPI.port }}
            - --reports-api-cert-path=/tmp/k8s-reports-api/serving-certs
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            - name: report
              containerPort: 8082
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook-server
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.reportsAPI.enabled }}
            - name: reports-api
              containerPort: {{ .Values.reportsAPI.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            {{- include "kubemoot-operator.goMemLimitEnv" (dict "root" . "resources" .Values.resources "indent" 12) }}
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The Kubemoot release: the chart's own version, stamped when the chart is packaged.
            # The operator writes it to the KubemootConfig status.
            - name: KUBEMOOT_RELEASE
              value: {{ .Chart.Version | quote }}
            {{- if .Values.nats.enabled }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- include "kubemoot-operator.natsConnBlock" (dict "name" "kubemoot-operator.natsConnEnv" "ctx" (dict "root" . "operator" true) "indent" 12) }}
            {{- end }}
            {{- with .Values.placementService.url }}
            # The placement service the Moot Mesh sidecars call for every model call. Empty
            # leaves each sidecar on the model server its Agent was bound to.
            - name: PLACEMENT_SERVICE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.schedulingCrew.enabled .Values.modelServers }}
            # The crew the operator asks to judge calibration drift (scheduling-crew.yaml).
            - name: KUBEMOOT_SCHEDULING_CREW
              value: {{ printf "%s/%s" .Values.schedulingCrew.namespace (include "kubemoot-operator.schedulingCrew" .) | quote }}
            {{- end }}
            {{- if and .Values.scaleToZero .Values.scaleToZero.enabled }}
            - name: KEDA_NATS_MONITORING_ENDPOINT
              value: {{ .Values.scaleToZero.natsMonitoringEndpoint | default "nats-headless.nats.svc.cluster.local:8222" | quote }}
            {{- end }}
            # The install CA: a Secret the operator makes when it is absent and never replaces, and the
            # ConfigMap its public certificates are published in for the pods that verify with it.
            - name: INSTALL_CA_SECRET
              value: {{ .Values.global.installCA.secret | quote }}
            - name: INSTALL_CA_CONFIGMAP
              value: {{ .Values.global.installCA.configMap | quote }}
            {{- with .Values.discussionGateway.allowedOrigins }}
            # Browser origins whose pages may read a discussion gateway's streams.
            - name: DISCUSSION_GATEWAY_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.secretReplication.allowedSourceNamespaces }}
            - name: SECRET_SOURCE_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.security.networkPolicies }}
            {{- if .enabled }}
            # Network policies the operator generates (security.networkPolicies). With the
            # flag off none of these are set and the operator only removes what it generated.
            - name: KUBEMOOT_NETPOL_ENABLED
              value: "true"
            - name: KUBEMOOT_NETPOL_INGRESS
              value: {{ .ingress | quote }}
            - name: KUBEMOOT_NETPOL_EGRESS_MODE
              value: {{ .egress.mode | quote }}
            - name: KUBEMOOT_NETPOL_CILIUM
              value: {{ .cilium | quote }}
            - name: KUBEMOOT_NETPOL_DNS_NAMESPACE
              value: {{ .dns.namespace | quote }}
            - name: KUBEMOOT_NETPOL_DNS_LABELS
              value: {{ include "kubemoot-operator.labelList" .dns.podLabels | quote }}
            - name: KUBEMOOT_NETPOL_METRICS_NAMESPACE
              value: {{ .metricsScraper.namespace | quote }}
            - name: KUBEMOOT_NETPOL_METRICS_LABELS
              value: {{ include "kubemoot-operator.labelList" .metricsScraper.podLabels | quote }}
            - name: KUBEMOOT_NETPOL_TRUSTED_INGRESS_NAMESPACES
              value: {{ join "," .trustedIngressNamespaces | quote }}
            - name: KUBEMOOT_NETPOL_CONTROL_PLANE_CIDRS
              value: {{ join "," .controlPlaneCIDRs | quote }}
            - name: KUBEMOOT_NETPOL_CLUSTER_CIDRS
              value: {{ join "," .clusterCIDRs | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.gateway.enabled }}
            - name: GATEWAY_NAME
              value: {{ .Values.gateway.name | quote }}
            - name: GATEWAY_NAMESPACE
              value: {{ .Values.gateway.namespace | quote }}
            - name: GATEWAY_HOSTNAME
              value: {{ .Values.gateway.hostname | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.webhook.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
            {{- if .Values.reportsAPI.enabled }}
            - name: reports-api-certs
              mountPath: /tmp/k8s-reports-api/serving-certs
              readOnly: true
            {{- end }}
            {{- include "kubemoot-operator.natsConnBlock" (dict "name" "kubemoot-operator.natsConnMounts" "ctx" . "indent" 12) }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "kubemoot-operator.fullname" . }}-webhook-cert
        {{- end }}
        {{- if .Values.reportsAPI.enabled }}
        - name: reports-api-certs
          secret:
            secretName: {{ include "kubemoot-operator.fullname" . }}-reports-api-cert
        {{- end }}
        {{- include "kubemoot-operator.natsConnBlock" (dict "name" "kubemoot-operator.natsConnVolumes" "ctx" . "indent" 8) }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
