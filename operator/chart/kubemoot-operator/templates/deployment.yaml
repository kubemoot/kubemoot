apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubemoot-operator.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      labels:
        {{- include "kubemoot-operator.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      {{- with (include "kubemoot-operator.pullSecrets" . | fromYamlArray) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubemoot-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "kubemoot-operator.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command: the image entrypoint starts the manager (the buildpacks launcher
          # at /cnb/process/web, which runs /workspace/manager with these args).
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            - --leader-lease-duration={{ .Values.leaderElection.leaseDuration | default "60s" }}
            - --leader-renew-deadline={{ .Values.leaderElection.renewDeadline | default "50s" }}
            - --leader-retry-period={{ .Values.leaderElection.retryPeriod | default "10s" }}
            {{- end }}
            - --health-probe-bind-address=:{{ .Values.health.port }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- if .Values.webhook.enabled }}
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            - name: report
              containerPort: 8082
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook-server
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.nats.enabled }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- end }}
            {{- if and .Values.scaleToZero .Values.scaleToZero.enabled }}
            - name: KEDA_NATS_MONITORING_ENDPOINT
              value: {{ .Values.scaleToZero.natsMonitoringEndpoint | default "nats-headless.nats.svc.cluster.local:8222" | quote }}
            {{- end }}
            {{- with .Values.secretReplication.allowedSourceNamespaces }}
            - name: SECRET_SOURCE_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.gateway.enabled }}
            - name: GATEWAY_NAME
              value: {{ .Values.gateway.name | quote }}
            - name: GATEWAY_NAMESPACE
              value: {{ .Values.gateway.namespace | quote }}
            - name: GATEWAY_HOSTNAME
              value: {{ .Values.gateway.hostname | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.webhook.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "kubemoot-operator.fullname" . }}-webhook-cert
        {{- end }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
