{{- /*
The scheduling crew: Kubemoot's own crew for scheduling work, in its own namespace.
Today it has a coordinator and one specialist, the model-server-calibrator, which
measures ModelServers through the accelerator-mcp tools (the core MCP server in
accelerator-mcp.yaml, reached through the crew's gateway) by the probe plan in its
skill (scheduling-crew-prompts.yaml).
*/ -}}
{{- if and .Values.schedulingCrew.enabled .Values.modelServers }}
{{- $ns := .Values.schedulingCrew.namespace }}
{{- $crew := include "kubemoot-operator.schedulingCrew" . }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
---
apiVersion: kubemoot.ai/v1alpha1
kind: Crew
metadata:
  name: {{ $crew }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/crew: {{ $crew }}
  annotations:
    kubemoot.ai/display-name: "Kubemoot scheduling"
spec:
  description: "Kubemoot's own scheduling crew: measures the cluster's model servers so the scheduler does not place calls blind."
  discussion:
    enabled: true
---
apiVersion: kubemoot.ai/v1alpha1
kind: CrewSchedulingPolicy
metadata:
  name: {{ $crew }}-scheduling
  namespace: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/crew: {{ $crew }}
spec:
  crewRef: {{ $crew }}
  archetypeRef: consent-3
  # The crew's own work is short: plan probes, call tools, report. A fast model serves it.
  rules:
    - phase: mulling
      require:
        matchLabels:
          capability/tool-calling: "true"
      prefer:
        - weight: 100
          selector:
            matchLabels:
              latencyClass: low
    - phase: triage
      require:
        matchLabels:
          capability/tool-calling: "true"
      prefer:
        - weight: 100
          selector:
            matchLabels:
              latencyClass: low
---
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: scheduling-coordinator
  namespace: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/crew: {{ $crew }}
    kubemoot.ai/role: coordinator
spec:
  type: chat
  description: "Coordinator for the scheduling crew: routes each request to the role that handles it and writes the answer."
  discussRole: coordinator
  capabilities: [tool-calling, reasoning]
  discussChannels: [general]
  promptRefs: [scheduling-advisory, scheduling-decision-logic, scheduling-synthesis]
  temperature: "0.1"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # The coordinator calls no tools: the calibrator measures, it writes the answer.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "false"
---
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: model-server-calibrator
  namespace: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/crew: {{ $crew }}
    kubemoot.ai/role: tooler
spec:
  type: chat
  description: "Judges calibration drift on ModelServers: recalibrates when a lasting change made crew calls slower or faster than calibrated, waits when the cause is passing."
  triageSummary: "Judges a calibration drift the operator reports on a ModelServer: compares crew calls with the calibration using the accelerator-mcp tools, then recalibrates the drifted models or decides to wait."
  discussRole: tooler
  capabilities: [tool-calling]
  discussChannels: [general]
  discussKeywords: [calibration, drift, drifted, recalibrate, modelserver]
  promptRefs: [scheduling-protocol, scheduling-response-style, model-server-calibrator-system]
  enabledTools: [list_servers, server_state, observed_performance, calibrate_server]
  temperature: "0.1"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
---
apiVersion: kubemoot.ai/v1alpha1
kind: MCPGateway
metadata:
  name: {{ $crew }}-gateway
  namespace: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/crew: {{ $crew }}
spec:
  implementation: kubemoot
  port: 8080
  replicas: 1
  mcpServerSelector:
    matchLabels:
      kubemoot.ai/crew: {{ $crew }}
  # The accelerator-mcp core server, from the operator's namespace.
  coreServerSelector:
    matchLabels:
      kubemoot.ai/tools: accelerators
  resources:
    {{- toYaml .Values.schedulingCrew.gateway.resources | nindent 4 }}
{{- range .Values.modelServers }}
{{- /* A vllm server serves Models from a huggingFace source; the crew's model below is an Ollama tag. */ -}}
{{- if ne .type "vllm" }}
---
apiVersion: kubemoot.ai/v1alpha1
kind: Model
metadata:
  name: {{ regexReplaceAll "[^a-z0-9-]+" (printf "%s-%s" .name $.Values.schedulingCrew.model.name | lower) "-" | trunc 63 | trimSuffix "-" }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" $ | nindent 4 }}
    kubemoot.ai/crew: {{ $crew }}
    latencyClass: "low"
    contextWindow: {{ $.Values.schedulingCrew.model.contextWindow | quote }}
    capability/tool-calling: "true"
    capability/reasoning: "true"
spec:
  model: {{ $.Values.schedulingCrew.model.name | quote }}
  serverRef: {{ .name | quote }}
  vramMib: {{ $.Values.schedulingCrew.model.vramMib }}
{{- end }}
{{- end }}
{{- end }}
