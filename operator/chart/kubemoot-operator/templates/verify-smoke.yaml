{{- if and .Values.verify.enabled .Values.verify.deployJobs -}}
# Smoke Verification Job
# Quick tests (~2 min) - run after deployments
# This template creates a static verify job. For dynamic job creation, use the dashboard API.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubemoot-verify-smoke
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    app.kubernetes.io/name: kubemoot-verify
    app.kubernetes.io/component: verify-smoke
    kubemoot.ai/verify-type: smoke
spec:
  ttlSecondsAfterFinished: 86400  # Keep logs for 24 hours
  backoffLimit: 0  # Don't retry on failure
  template:
    spec:
      serviceAccountName: kubemoot-verify-runner
      restartPolicy: Never
      containers:
        - name: verify
          image: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.verify.image) | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=========================================="
              echo "  Smoke Verification"
              echo "=========================================="
              echo ""

              /tests/test-smoke.sh

              echo ""
              echo "=========================================="
              echo "  Smoke Verification Complete"
              echo "=========================================="
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
