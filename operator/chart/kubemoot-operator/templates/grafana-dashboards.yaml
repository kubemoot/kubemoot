{{- /*
Kubemoot's Grafana dashboards, from dashboards/*.json, for whichever Grafana the
cluster runs: ConfigMaps for Grafana's dashboard sidecar (the Grafana Helm chart and
kube-prometheus-stack load ConfigMaps carrying their label), and, when the Grafana
Operator is installed and asked for, GrafanaDashboard resources that point at the
same ConfigMaps. Grafana is optional; with neither, nothing here is used.
*/ -}}
{{- $cfg := .Values.grafana.dashboards }}
{{- if $cfg.enabled }}
{{- $root := . }}
{{- $ns := $cfg.namespace | default .Release.Namespace }}
{{- if and $cfg.grafanaOperator.enabled (empty $cfg.grafanaOperator.instanceSelector) }}
{{- fail "grafana.dashboards.grafanaOperator.instanceSelector must select your Grafana instances" }}
{{- end }}
{{- range $path, $_ := $root.Files.Glob "dashboards/*.json" }}
{{- $file := base $path }}
{{- $name := printf "%s-dashboard-%s" (include "kubemoot-operator.fullname" $root) (trimPrefix "kubemoot-" (trimSuffix ".json" $file)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" $root | nindent 4 }}
    {{ $cfg.label }}: {{ $cfg.labelValue | quote }}
  annotations:
    grafana_folder: {{ $cfg.folder | quote }}
data:
  {{ $file }}: |-
{{ $root.Files.Get $path | indent 4 }}
{{- if and $cfg.grafanaOperator.enabled ($root.Capabilities.APIVersions.Has "grafana.integreatly.org/v1beta1/GrafanaDashboard") }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubemoot-operator.labels" $root | nindent 4 }}
spec:
  folder: {{ $cfg.folder | quote }}
  instanceSelector:
    {{- toYaml $cfg.grafanaOperator.instanceSelector | nindent 4 }}
  configMapRef:
    name: {{ $name }}
    key: {{ $file }}
{{- end }}
{{- end }}
{{- end }}
