{{- if .Values.liaison.enabled }}
{{- $name := printf "%s-liaison" (include "kubemoot-operator.fullname" .) }}
{{- $secret := .Values.liaison.auth.existingSecret | default (printf "%s-auth" $name) }}
{{- $host := .Values.liaison.expose.hostname | default .Values.gateway.hostname }}
{{- $door := and .Values.liaison.signIn.enabled (eq (.Values.liaison.signIn.identity.provider | default "") "oidc") }}
{{- if and .Values.liaison.signIn.identity.provider (ne .Values.liaison.signIn.identity.provider "oidc") }}
{{- fail (printf "liaison.signIn.identity.provider must be empty or \"oidc\", got %q" .Values.liaison.signIn.identity.provider) }}
{{- end }}
{{- if and $door .Values.liaison.signIn.upstream.authorizeURL }}
{{- fail "liaison.signIn.identity and liaison.signIn.upstream are alternatives: the door signs people in itself, or relays one service's sign-in" }}
{{- end }}
{{- if and (eq (.Values.liaison.signIn.identity.provider | default "") "oidc") (not .Values.liaison.signIn.enabled) }}
{{- fail "liaison.signIn.identity.provider needs liaison.signIn.enabled" }}
{{- end }}
{{- if and $door .Values.liaison.auth.serviceTokens }}
{{- fail "liaison.auth.serviceTokens and the door's identity are alternatives: with the door's identity on, /mcp accepts no service's own token" }}
{{- end }}
{{- $acct := .Values.liaison.connectedAccounts }}
{{- $accts := and $door $acct.enabled }}
{{- if and $acct.enabled (not $door) }}
{{- fail "liaison.connectedAccounts.enabled needs the door's own identity (liaison.signIn.enabled with liaison.signIn.identity.provider oidc): a connection belongs to the person the door signed in" }}
{{- end }}
{{- $backend := .Values.liaison.state.backend | default (ternary "nats" "memory" (and .Values.nats.enabled (not (empty $door)))) }}
{{- if not (has $backend (list "memory" "nats" "openbao")) }}
{{- fail (printf "liaison.state.backend must be empty, memory, nats or openbao, got %q" $backend) }}
{{- end }}
{{- if and (eq $backend "openbao") (or (not .Values.liaison.state.openbao.address) (not .Values.liaison.state.openbao.tokenSecret.name)) }}
{{- fail "liaison.state.backend openbao needs liaison.state.openbao.address and liaison.state.openbao.tokenSecret.name" }}
{{- end }}
{{- if and (eq $backend "nats") (not .Values.nats.enabled) }}
{{- fail "liaison.state.backend nats needs nats.enabled" }}
{{- end }}
{{- if $accts }}
{{- if not $acct.sealKeySecret.name }}
{{- fail "liaison.connectedAccounts.sealKeySecret.name is required when liaison.connectedAccounts.enabled" }}
{{- end }}
{{- if not .Values.liaison.auth.hashKeySecret.name }}
{{- fail "liaison.auth.hashKeySecret.name is required when liaison.connectedAccounts.enabled: a person's connection is kept under the id the crews' gateways give them" }}
{{- end }}
{{- if and (gt (int .Values.liaison.replicas) 1) (eq $backend "memory") }}
{{- fail "liaison.connectedAccounts.enabled with more than one replica needs liaison.state.backend nats or openbao: a connection kept in one pod is invisible to the others" }}
{{- end }}
{{- range $name, $reg := $acct.accounts }}
{{- if not $reg.clientId }}
{{- fail (printf "liaison.connectedAccounts.accounts.%s.clientId is required" $name) }}
{{- end }}
{{- if and (not $reg.allowedCrews) (not $reg.hosts) }}
{{- fail (printf "liaison.connectedAccounts.accounts.%s needs allowedCrews or hosts: without either, any crew author could send the install's client to an address of their choosing" $name) }}
{{- end }}
{{- if and $reg.clientSecret $reg.clientSecret.name (not $reg.hosts) }}
{{- fail (printf "liaison.connectedAccounts.accounts.%s holds a client secret, so it needs hosts: the secret goes to the token endpoint" $name) }}
{{- end }}
{{- range $crew := ($reg.allowedCrews | default list) }}
{{- if not (regexMatch "^[^/]+/[^/]+$" $crew) }}
{{- fail (printf "liaison.connectedAccounts.accounts.%s.allowedCrews entry %q must be namespace/name" $name $crew) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $door .Values.liaison.expose.enabled (not .Values.liaison.signIn.allowedRedirectHosts) }}
{{- fail "liaison.signIn.allowedRedirectHosts is required when the door's identity is on and liaison.expose is on: without it any site could ask a person to allow it" }}
{{- end }}
{{- if .Values.liaison.signIn.enabled }}
{{- $public := required "liaison.signIn.publicURL is required when liaison.signIn.enabled" .Values.liaison.signIn.publicURL | trimSuffix "/" }}
{{- if ne $public (printf "https://%s" $host) }}
{{- fail (printf "liaison.signIn.publicURL (%s) must be https:// plus the door hostname (liaison.expose.hostname, else gateway.hostname), which is %q: the metadata and the redirect addresses must name the host the route serves" $public $host) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
---
# The liaison reads Crew resources, cluster-wide, to know whom it may front, and checks
# callers' tokens when liaison.auth.kubernetesTokens is on.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubemoot.ai"]
    resources: ["crews"]
    verbs: ["get", "list", "watch"]
  {{- if or .Values.liaison.auth.kubernetesTokens $accts }}
  # Checking callers' Kubernetes tokens, and a crew gateway's ServiceAccount token at the account broker.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end }}
  {{- if $accts }}
  # The account broker serves only a ServiceAccount the operator made for a Crew's gateway, and
  # reads it, and the Crew that controls it, to know.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if and (not .Values.liaison.auth.existingSecret) .Values.liaison.auth.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.liaison.auth.key }}: {{ .Values.liaison.auth.token | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crew-liaison
spec:
  replicas: {{ .Values.liaison.replicas }}
  selector:
    matchLabels:
      {{- include "kubemoot-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: crew-liaison
  template:
    metadata:
      labels:
        {{- include "kubemoot-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: crew-liaison
    spec:
      {{- with (include "kubemoot-operator.pullSecrets" . | fromYamlArray) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crew-liaison
          image: {{ include "kubemoot-operator.image" (dict "root" . "image" .Values.liaison.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if $accts }}
            - name: broker
              containerPort: {{ $acct.brokerPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: PORT
              value: "8080"
            {{- include "kubemoot-operator.goMemLimitEnv" (dict "root" . "resources" .Values.liaison.resources "indent" 12) }}
            # The operator's report service, which builds conversation exports and checks the
            # token the liaison presents. It serves TLS from the install CA, which the liaison
            # verifies with the CA file below.
            - name: LIAISON_OPERATOR_REPORT_URL
              value: {{ printf "https://%s-report.%s.svc:8082" (include "kubemoot-operator.fullname" .) .Release.Namespace | quote }}
            - name: LIAISON_CA_FILE
              value: /etc/kubemoot/ca/ca.crt
            # The name a chat app shows for this install's door.
            - name: LIAISON_DISPLAY_NAME
              value: {{ .Values.liaison.displayName | quote }}
            {{- if not .Values.discussionGateway.tls.enabled }}
            # The gateways serve plain http (discussionGateway.tls.enabled is false): the tokens the
            # liaison sends them cross the pod network in the clear, and the liaison is told to accept it.
            - name: LIAISON_ALLOW_INSECURE_GATEWAY
              value: "true"
            {{- end }}
            - name: LIAISON_MAX_INFLIGHT
              value: {{ .Values.liaison.maxInflight | quote }}
            - name: LIAISON_TICKET_TTL_MINUTES
              value: {{ .Values.liaison.ticketTTLMinutes | quote }}
            {{- if or .Values.liaison.auth.kubernetesTokens .Values.liaison.auth.serviceTokens $door }}
            - name: ACCESS_ENFORCE
              value: "true"
            - name: ACCESS_ALLOW_ANONYMOUS
              value: {{ .Values.liaison.auth.allowAnonymous | quote }}
            {{- end }}
            {{- if .Values.liaison.auth.kubernetesTokens }}
            - name: ACCESS_TOKEN_REVIEW
              value: "true"
            {{- end }}
            {{- with .Values.liaison.auth.serviceTokens }}
            # Services whose acceptance of a person's own token proves who they are, the same
            # list as a Crew's spec.discussion.access.serviceTokens. The hash key is the
            # install's, the same Secret value the crews' gateways read.
            - name: ACCESS_SERVICE_TOKENS
              value: {{ toJson . | quote }}
            - name: ACCESS_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "liaison.auth.hashKeySecret.name is required with liaison.auth.serviceTokens" $.Values.liaison.auth.hashKeySecret.name }}
                  key: {{ $.Values.liaison.auth.hashKeySecret.key | default "hash-key" }}
            {{- end }}
            {{- if .Values.liaison.signIn.enabled }}
            {{- $in := .Values.liaison.signIn }}
            - name: LIAISON_SIGNIN_PUBLIC_URL
              value: {{ required "liaison.signIn.publicURL is required when liaison.signIn.enabled" $in.publicURL | quote }}
            {{- with $in.allowedRedirectHosts }}
            - name: LIAISON_SIGNIN_ALLOWED_REDIRECT_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            # The sealing keys come from a Secret the installer creates, as a mounted file.
            - name: LIAISON_SIGNIN_SEAL_KEYS_FILE
              value: /etc/kubemoot/signin/seal-keys
            {{- if $door }}
            {{- $oidc := $in.identity.oidc }}
            # The door signs people in itself through the install's OpenID Connect issuer and
            # issues its own tokens; it holds no token of any service.
            - name: LIAISON_SIGNIN_IDENTITY
              value: "oidc"
            - name: LIAISON_SIGNIN_OIDC_ISSUER
              value: {{ required "liaison.signIn.identity.oidc.issuer is required with identity.provider oidc" $oidc.issuer | quote }}
            - name: LIAISON_SIGNIN_OIDC_CLIENT_ID
              value: {{ required "liaison.signIn.identity.oidc.clientId is required with identity.provider oidc" $oidc.clientId | quote }}
            - name: LIAISON_SIGNIN_OIDC_CLIENT_SECRET_FILE
              value: /etc/kubemoot/signin-identity/oidc-client-secret
            - name: LIAISON_SIGNIN_OIDC_SCOPES
              value: {{ $oidc.scopes | quote }}
            - name: LIAISON_SIGNIN_OIDC_GROUPS_CLAIM
              value: {{ $oidc.groupsClaim | quote }}
            - name: LIAISON_SIGNIN_OIDC_USER_PREFIX
              value: {{ $oidc.userPrefix | quote }}
            - name: LIAISON_SIGNIN_SIGNING_KEYS_FILE
              value: /etc/kubemoot/signin-identity/signing-keys
            {{- if $in.identity.hopKeySecret.name }}
            - name: LIAISON_SIGNIN_HOP_KEYS_FILE
              value: /etc/kubemoot/signin-identity/hop-keys
            {{- end }}
            - name: LIAISON_SIGNIN_REFRESH_MAX_HOURS
              value: {{ $in.identity.refreshMaxHours | quote }}
            {{- else }}
            # The stateless OAuth sign-in front: it holds no token and no state, only keys.
            - name: LIAISON_SIGNIN_UPSTREAM
              value: {{ required "liaison.signIn.upstream.authorizeURL is required when liaison.signIn.enabled" $in.upstream.authorizeURL | quote }}
            - name: LIAISON_SIGNIN_UPSTREAM_TOKEN_URL
              value: {{ required "liaison.signIn.upstream.tokenURL is required when liaison.signIn.enabled" $in.upstream.tokenURL | quote }}
            - name: LIAISON_SIGNIN_UPSTREAM_CLIENT_ID
              value: {{ required "liaison.signIn.upstream.clientId is required when liaison.signIn.enabled" $in.upstream.clientId | quote }}
            {{- with $in.upstream.scopes }}
            - name: LIAISON_SIGNIN_UPSTREAM_SCOPES
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            # Where the liaison keeps what it must remember: the door's single-use marks and, when
            # connected accounts are on, the sealed accounts.
            - name: LIAISON_STATE_BACKEND
              value: {{ $backend | quote }}
            {{- if eq $backend "nats" }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- include "kubemoot-operator.natsConnBlock" (dict "name" "kubemoot-operator.natsConnEnv" "ctx" (dict "root" .) "indent" 12) }}
            {{- end }}
            {{- if eq $backend "openbao" }}
            {{- $bao := .Values.liaison.state.openbao }}
            - name: LIAISON_OPENBAO_ADDR
              value: {{ $bao.address | quote }}
            - name: LIAISON_OPENBAO_MOUNT
              value: {{ $bao.mount | quote }}
            - name: LIAISON_OPENBAO_PREFIX
              value: {{ $bao.prefix | quote }}
            - name: LIAISON_OPENBAO_TOKEN_FILE
              value: /etc/kubemoot/openbao/token
            {{- if $bao.caSecret.name }}
            - name: LIAISON_OPENBAO_CA_FILE
              value: /etc/kubemoot/openbao/ca.crt
            {{- end }}
            {{- end }}
            {{- if $accts }}
            # Connected accounts: a person connects an outside account once and a crew's tools act as
            # them. Nothing is kept until a crew declares the account and the person presses Connect.
            - name: LIAISON_ACCOUNTS_ENABLED
              value: "true"
            - name: LIAISON_ACCOUNTS_SEAL_KEYS_FILE
              value: /etc/kubemoot/accounts/vault-keys
            - name: LIAISON_ACCOUNTS
              value: {{ include "kubemoot-operator.liaisonAccountsJSON" . | quote }}
            - name: LIAISON_INTERNAL_PORT
              value: {{ $acct.brokerPort | quote }}
            {{- if .Values.discussionGateway.tls.enabled }}
            # The broker serves TLS with the certificate the operator signs from the install CA.
            - name: LIAISON_BROKER_TLS_CERT_FILE
              value: /etc/kubemoot/broker-tls/tls.crt
            - name: LIAISON_BROKER_TLS_KEY_FILE
              value: /etc/kubemoot/broker-tls/tls.key
            {{- else }}
            # The gateways serve plain http (discussionGateway.tls.enabled is false), so the broker
            # does too, and the tokens it carries cross the pod network in the clear.
            - name: LIAISON_ALLOW_INSECURE_BROKER
              value: "true"
            {{- end }}
            {{- if not .Values.liaison.auth.serviceTokens }}
            - name: ACCESS_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liaison.auth.hashKeySecret.name }}
                  key: {{ .Values.liaison.auth.hashKeySecret.key | default "hash-key" }}
            {{- end }}
            {{- end }}
            {{- if or .Values.liaison.auth.existingSecret .Values.liaison.auth.token }}
            - name: LIAISON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .Values.liaison.auth.key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.liaison.resources | nindent 12 }}
          volumeMounts:
            - name: install-ca
              mountPath: /etc/kubemoot/ca
              readOnly: true
            {{- if .Values.liaison.signIn.enabled }}
            - name: signin-seal-keys
              mountPath: /etc/kubemoot/signin
              readOnly: true
            {{- end }}
            {{- if $door }}
            - name: signin-identity
              mountPath: /etc/kubemoot/signin-identity
              readOnly: true
            {{- end }}
            {{- if $accts }}
            - name: accounts
              mountPath: /etc/kubemoot/accounts
              readOnly: true
            {{- if .Values.discussionGateway.tls.enabled }}
            - name: broker-tls
              mountPath: /etc/kubemoot/broker-tls
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if eq $backend "openbao" }}
            - name: openbao
              mountPath: /etc/kubemoot/openbao
              readOnly: true
            {{- end }}
            {{- if eq $backend "nats" }}
            {{- include "kubemoot-operator.natsConnBlock" (dict "name" "kubemoot-operator.natsConnMounts" "ctx" . "indent" 12) }}
            {{- end }}
      volumes:
        # The install CA's public certificates, which the operator publishes. The pod waits for
        # the ConfigMap to exist.
        - name: install-ca
          configMap:
            name: {{ .Values.global.installCA.configMap }}
        {{- if .Values.liaison.signIn.enabled }}
        - name: signin-seal-keys
          secret:
            secretName: {{ required "liaison.signIn.sealKeySecret.name is required when liaison.signIn.enabled" .Values.liaison.signIn.sealKeySecret.name }}
            items:
              - key: {{ .Values.liaison.signIn.sealKeySecret.key | default "seal-keys" }}
                path: seal-keys
        {{- end }}
        {{- if $door }}
        {{- $id := .Values.liaison.signIn.identity }}
        # The door's own secrets, each from a Secret the installer creates: the issuer's client
        # secret, the keys that sign access tokens, and (optional) the key that signs the
        # assertion of a person to a crew. No pod but the liaison mounts them.
        - name: signin-identity
          projected:
            sources:
              - secret:
                  name: {{ required "liaison.signIn.identity.oidc.clientSecret.name is required with identity.provider oidc" $id.oidc.clientSecret.name }}
                  items:
                    - key: {{ $id.oidc.clientSecret.key | default "client-secret" }}
                      path: oidc-client-secret
              - secret:
                  name: {{ required "liaison.signIn.identity.signingKeySecret.name is required with identity.provider oidc" $id.signingKeySecret.name }}
                  items:
                    - key: {{ $id.signingKeySecret.key | default "signing-keys" }}
                      path: signing-keys
              {{- if $id.hopKeySecret.name }}
              - secret:
                  name: {{ $id.hopKeySecret.name }}
                  items:
                    - key: {{ $id.hopKeySecret.key | default "hop-keys" }}
                      path: hop-keys
              {{- end }}
        {{- end }}
        {{- if $accts }}
        # The accounts' own secrets: the keys that seal what is kept, and each client's secret.
        # No pod but the liaison mounts them.
        - name: accounts
          projected:
            sources:
              - secret:
                  name: {{ $acct.sealKeySecret.name }}
                  items:
                    - key: {{ $acct.sealKeySecret.key | default "vault-keys" }}
                      path: vault-keys
              {{- range $name, $reg := $acct.accounts }}
              {{- if $reg.clientSecret }}
              {{- if $reg.clientSecret.name }}
              - secret:
                  name: {{ $reg.clientSecret.name }}
                  items:
                    - key: {{ $reg.clientSecret.key | default "client-secret" }}
                      path: {{ $name }}-client-secret
              {{- end }}
              {{- end }}
              {{- end }}
        {{- end }}
        {{- if and $accts .Values.discussionGateway.tls.enabled }}
        # The broker's serving certificate, which the operator signs from the install CA. The pod
        # waits for the Secret to exist.
        - name: broker-tls
          secret:
            secretName: {{ include "kubemoot-operator.brokerTLSSecret" . }}
        {{- end }}
        {{- if eq $backend "openbao" }}
        {{- $bao := .Values.liaison.state.openbao }}
        - name: openbao
          projected:
            sources:
              - secret:
                  name: {{ $bao.tokenSecret.name }}
                  items:
                    - key: {{ $bao.tokenSecret.key | default "token" }}
                      path: token
              {{- if $bao.caSecret.name }}
              - secret:
                  name: {{ $bao.caSecret.name }}
                  items:
                    - key: {{ $bao.caSecret.key | default "ca.crt" }}
                      path: ca.crt
              {{- end }}
        {{- end }}
        {{- if eq $backend "nats" }}
        {{- include "kubemoot-operator.natsConnBlock" (dict "name" "kubemoot-operator.natsConnVolumes" "ctx" . "indent" 8) }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crew-liaison
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kubemoot-operator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: crew-liaison
{{- if $accts }}
---
# The account broker, which a crew's discussion gateway asks for a person's token and connection
# state. Cluster-internal: it is never behind the route, and it checks the gateway's own
# ServiceAccount token.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemoot-operator.brokerService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crew-liaison
spec:
  ports:
    - name: broker
      port: {{ $acct.brokerPort }}
      targetPort: broker
      protocol: TCP
  selector:
    {{- include "kubemoot-operator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: crew-liaison
{{- end }}
{{- if $accts }}
---
# Only the crews' discussion gateways reach the broker port; the route's port stays open to all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-broker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubemoot-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: crew-liaison
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: discussion-gateway
              app.kubernetes.io/managed-by: kubemoot-operator
      ports:
        - port: broker
          protocol: TCP
{{- end }}
{{- if and .Values.liaison.expose.enabled .Values.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: {{ $name }}
          port: 80
    {{- if .Values.liaison.signIn.enabled }}
    # The sign-in front's own paths: the discovery documents and the OAuth endpoints.
    - matches:
        - path:
            type: PathPrefix
            value: /oauth
        - path:
            type: PathPrefix
            value: /.well-known
      backendRefs:
        - name: {{ $name }}
          port: 80
    {{- end }}
{{- end }}
{{- end }}
