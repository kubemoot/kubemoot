{{- /*
accelerator-mcp, a core MCP server: one copy in the operator's namespace, offered to
every crew (kubemoot.ai/core-mcp) and registered by any gateway whose
coreServerSelector matches. It runs as a ServiceAccount that may read ModelProviders
and Models and update ModelProvider status, where calibration is recorded.
*/ -}}
{{- if and .Values.acceleratorMcp.enabled .Values.nats.enabled }}
{{- $name := "accelerator-mcp" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}-accelerator-mcp
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubemoot.ai"]
    resources: ["modelproviders", "models"]
    verbs: ["get", "list"]
  - apiGroups: ["kubemoot.ai"]
    resources: ["modelproviders/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}-accelerator-mcp
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubemoot-operator.fullname" . }}-accelerator-mcp
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-mcp
    kubemoot.ai/core-mcp: "true"
    kubemoot.ai/tools: accelerators
spec:
  image: {{ include "kubemoot-operator.image" (dict "root" . "image" .Values.acceleratorMcp.image) | quote }}
  transport: stdio
  # The buildpacks launcher starts the binary; mcp-bridge wraps it for stdio.
  command: ["/cnb/process/web"]
  port: 3000
  replicas: 1
  serviceAccountName: {{ $name }}
  # Non-root, read-only root filesystem, no privilege escalation.
  securityMode: strict
  env:
    - name: NATS_URL
      value: {{ .Values.nats.url | quote }}
  capabilities: [accelerators, calibration, model-providers]
  resources:
    {{- toYaml .Values.acceleratorMcp.resources | nindent 4 }}
{{- end }}
