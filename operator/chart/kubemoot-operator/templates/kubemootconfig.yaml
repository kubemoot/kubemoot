{{- if .Values.kubemootConfig.create -}}
apiVersion: kubemoot.ai/v1alpha1
kind: KubemootConfig
metadata:
  name: default
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
spec:
  images:
    indexer: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.indexer) | quote }}
    queryService: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.queryService) | quote }}
    agentRuntime: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.agentRuntime) | quote }}
    agentSidecar: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.agentSidecar) | quote }}
    harnessGoose: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.harnessGoose) | quote }}
    mcpGateway: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.mcpGateway) | quote }}
    mcpBridge: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.mcpBridge) | quote }}
    discussionGateway: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.discussionGateway) | quote }}
    fitnessRunner: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.fitnessRunner) | quote }}
    artifactAccess: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.artifactAccess) | quote }}
    doclingServe: {{ include "kubemoot-operator.image" (dict "root" $ "image" .Values.kubemootConfig.images.doclingServe) | quote }}
  defaults:
    {{- with (include "kubemoot-operator.pullSecrets" . | fromYamlArray) }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    vectorStoreType: {{ .Values.kubemootConfig.defaults.vectorStoreType | quote }}
    embeddingModel: {{ .Values.kubemootConfig.defaults.embeddingModel | quote }}
    {{- if or .Values.kubemootConfig.defaults.scheduler (and .Values.placementService.enabled .Values.placementService.agentsUse) }}
    scheduler:
      {{- $sched := .Values.kubemootConfig.defaults.scheduler | default dict }}
      enabled: {{ $sched.enabled | default false }}
      strategy: {{ $sched.strategy | default "spread" | quote }}
      probeIntervalSeconds: {{ $sched.probeIntervalSeconds | default 30 }}
      placementPolicy: {{ $sched.placementPolicy | default "algorithm" | quote }}
      {{- if $sched.prometheusEndpoint }}
      prometheusEndpoint: {{ $sched.prometheusEndpoint | quote }}
      {{- end }}
      {{- if $sched.modelEquivalence }}
      modelEquivalence:
        {{- toYaml $sched.modelEquivalence | nindent 8 }}
      {{- end }}
      {{- if and .Values.placementService.enabled .Values.placementService.agentsUse }}
      placementService:
        enabled: true
        url: {{ .Values.placementService.url | default (printf "http://%s-placement-service.%s.svc:8080" (include "kubemoot-operator.fullname" .) .Release.Namespace) | quote }}
      {{- end }}
    {{- end }}
{{- end }}
