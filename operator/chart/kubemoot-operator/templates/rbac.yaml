---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}-manager
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
