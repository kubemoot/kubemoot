- apiGroups:
  - ""
  resources:
  - configmaps
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubemoot.ai
  resources:
  - agents
  - crewfitnesssuites
  - crews
  - crewschedulingpolicies
  - embeddingmodels
  - kubemootconfigs
  - mcpcatalogs
  - mcpgateways
  - mcpserverreports
  - mcpservers
  - modelproviders
  - models
  - mootarchetypes
  - notificationsinks
  - ragsources
  - skills
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubemoot.ai
  resources:
  - agents/finalizers
  - crewfitnesses/finalizers
  - crewfitnesssuites/finalizers
  - crews/finalizers
  - crewschedulingpolicies/finalizers
  - embeddingmodels/finalizers
  - kubemootconfigs/finalizers
  - mcpcatalogs/finalizers
  - mcpgateways/finalizers
  - mcpserverreports/finalizers
  - mcpservers/finalizers
  - modelproviders/finalizers
  - models/finalizers
  - mootarchetypes/finalizers
  - notificationsinks/finalizers
  - ragsources/finalizers
  - skills/finalizers
  verbs:
  - update
- apiGroups:
  - kubemoot.ai
  resources:
  - agents/status
  - crewfitnesses/status
  - crewfitnesssuites/status
  - crews/status
  - crewschedulingpolicies/status
  - embeddingmodels/status
  - kubemootconfigs/status
  - mcpcatalogs/status
  - mcpgateways/status
  - mcpqualitypolicies/status
  - mcpserverreports/status
  - mcpservers/status
  - modelproviders/status
  - models/status
  - mootarchetypes/status
  - notificationsinks/status
  - ragsources/status
  - skills/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kubemoot.ai
  resources:
  - crewfitnesses
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubemoot.ai
  resources:
  - mcpqualitypolicies
  - promptmodules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}-manager
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubemoot-operator.fullname" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "kubemoot-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Leader election Role - grants access to leases in the operator namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubemoot-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubemoot-operator.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "kubemoot-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
