{{- if .Values.security.secretUseGrants.enabled }}
{{- /*
  Secret use grants: an MCPServer or an Agent may reference a Secret or a ServiceAccount only
  when whoever creates or changes it holds the custom verb "use" on that exact object. The
  operator mounts Secrets and runs pods under ServiceAccounts for whoever applies the
  resource, so without this check anyone who can create an MCPServer can have the operator
  mount any Secret in its namespace. Kubernetes asks its own authorizer, so a grant is an
  ordinary Role (docs/concepts/secrets-and-tools.md).

  The operator's own ServiceAccount and security.secretUseGrants.exemptUsers are skipped. An
  update that leaves spec unchanged (the operator's finalizer and metadata writes) is skipped
  too, so enabling this never blocks an existing resource until its spec changes.
*/ -}}
{{- $operatorUser := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "kubemoot-operator.serviceAccountName" .) }}
{{- $exempt := toJson (concat (list $operatorUser) (.Values.security.secretUseGrants.exemptUsers | default list)) }}
{{- $secrets := "secrets" }}
{{- $accounts := "serviceaccounts" }}
{{- $mcpVars := list
      (dict "name" "envNames" "expr" (include "kubemoot-operator.useGrants.envSecrets" (dict "base" "object.spec")))
      (dict "name" "secretRefNames" "expr" "has(object.spec.secretRef) ? [object.spec.secretRef] : []")
      (dict "name" "volumeNames" "expr" "has(object.spec.secretVolumes) ? object.spec.secretVolumes.map(v, v.name) : []")
      (dict "name" "authNames" "expr" "has(object.spec.registry) && has(object.spec.registry.authSecretRef) ? [object.spec.registry.authSecretRef] : []")
      (dict "name" "sidecarNames" "expr" (printf "has(object.spec.sidecars) ? object.spec.sidecars.map(c, %s + (has(c.envFrom) ? c.envFrom.filter(f, has(f.secretRef)).map(f, f.secretRef.name) : [])) : []" (include "kubemoot-operator.useGrants.envSecrets" (dict "base" "c"))))
      (dict "name" "accountNames" "expr" "has(object.spec.serviceAccountName) ? [object.spec.serviceAccountName] : []") }}
{{- $mcpChecks := list
      (dict "field" "spec.env" "var" "envNames" "resource" $secrets)
      (dict "field" "spec.secretRef" "var" "secretRefNames" "resource" $secrets)
      (dict "field" "spec.secretVolumes" "var" "volumeNames" "resource" $secrets)
      (dict "field" "spec.registry.authSecretRef" "var" "authNames" "resource" $secrets)
      (dict "field" "spec.sidecars" "var" "sidecarNames" "resource" $secrets "nested" true)
      (dict "field" "spec.serviceAccountName" "var" "accountNames" "resource" $accounts) }}
{{- $agentVars := list
      (dict "name" "envNames" "expr" (printf "has(object.spec.deployment) ? %s : []" (include "kubemoot-operator.useGrants.envSecrets" (dict "base" "object.spec.deployment"))))
      (dict "name" "harnessEnvNames" "expr" (printf "has(object.spec.harness) ? %s : []" (include "kubemoot-operator.useGrants.envSecrets" (dict "base" "object.spec.harness"))))
      (dict "name" "memoryNames" "expr" "has(object.spec.memory) && has(object.spec.memory.secretRef) ? [object.spec.memory.secretRef] : []")
      (dict "name" "accountNames" "expr" "has(object.spec.deployment) && has(object.spec.deployment.serviceAccountName) ? [object.spec.deployment.serviceAccountName] : []") }}
{{- $agentChecks := list
      (dict "field" "spec.deployment.env" "var" "envNames" "resource" $secrets)
      (dict "field" "spec.harness.env" "var" "harnessEnvNames" "resource" $secrets)
      (dict "field" "spec.memory.secretRef" "var" "memoryNames" "resource" $secrets)
      (dict "field" "spec.deployment.serviceAccountName" "var" "accountNames" "resource" $accounts) }}
{{- $policies := list
      (dict "kind" "MCPServer" "resource" "mcpservers" "suffix" "mcpserver" "vars" $mcpVars "checks" $mcpChecks)
      (dict "kind" "Agent" "resource" "agents" "suffix" "agent" "vars" $agentVars "checks" $agentChecks) }}
{{- range $policies }}
---
{{ include "kubemoot-operator.useGrants.policy" (merge (dict "root" $ "exempt" $exempt) .) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubemoot-secret-use-{{ .suffix }}
  labels:
    {{- include "kubemoot-operator.labels" $ | nindent 4 }}
spec:
  policyName: kubemoot-secret-use-{{ .suffix }}
  validationActions: {{ toJson $.Values.security.secretUseGrants.validationActions }}
  {{- with $.Values.security.secretUseGrants.namespaceSelector }}
  matchResources:
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
{{- end }}
{{- if .Values.internalAgents.mcpServers.kubernetes.enabled }}
---
# The kubernetes MCP server's own ServiceAccount creates and updates MCPServers for onboarding
# and runs as kubemoot-kubernetes-mcp itself. It may name that one account; it holds no use
# grant on any Secret, so an MCPServer it creates that carries a Secret is denied by design.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubemoot-kubernetes-mcp-use
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["use"]
    resourceNames: ["kubemoot-kubernetes-mcp"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubemoot-kubernetes-mcp-use
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: kubemoot-kubernetes-mcp
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubemoot-kubernetes-mcp-use
{{- end }}
{{- end }}
