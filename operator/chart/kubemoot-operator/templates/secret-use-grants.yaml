{{- if .Values.security.secretUseGrants.enabled }}
{{- /*
  Secret use grants: an MCPServer or an Agent may reference a Secret or a ServiceAccount only
  when whoever creates or changes it holds the custom verb "use" on that exact object. The
  operator mounts Secrets and runs pods under ServiceAccounts for whoever applies the
  resource, so without this check anyone who can create an MCPServer can have the operator
  mount any Secret in its namespace. Kubernetes asks its own authorizer, so a grant is an
  ordinary Role (docs/concepts/secrets-and-tools.md).

  The policies live in files/secret-use-grants-policies.yaml, the same file the operator's
  envtest suite applies. The operator's own ServiceAccount and security.secretUseGrants.exemptUsers
  are skipped. An update that leaves spec unchanged (the operator's finalizer and metadata
  writes) is skipped too, so enabling this never blocks an existing resource until its spec changes.
*/ -}}
{{- $operatorUser := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "kubemoot-operator.serviceAccountName" .) }}
{{- $exempt := list }}
{{- range concat (list $operatorUser) (.Values.security.secretUseGrants.exemptUsers | default list) }}{{ $exempt = append $exempt (printf "'%s'" .) }}{{ end }}
{{ .Files.Get "files/secret-use-grants-policies.yaml" | replace "__EXEMPT_USERS__" (join ", " $exempt) }}
{{- range list "mcpserver" "agent" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubemoot-secret-use-{{ . }}
  labels:
    {{- include "kubemoot-operator.labels" $ | nindent 4 }}
spec:
  policyName: kubemoot-secret-use-{{ . }}
  validationActions: {{ toJson $.Values.security.secretUseGrants.validationActions }}
  {{- with $.Values.security.secretUseGrants.namespaceSelector }}
  matchResources:
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
{{- end }}
{{- end }}
