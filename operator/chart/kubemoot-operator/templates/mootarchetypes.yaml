{{/*
Default MootArchetypes shipped with the operator. These declare the phase
vocabulary that CrewSchedulingPolicy rules can reference.

`consent-3` is the default — sociocracy 3.0 consent decision making, the
archetype kubemoot has shipped since the discussion system was introduced.

To add a new archetype (Robert's Rules, debate, expert panel, etc.) without
modifying the operator: kubectl apply a new MootArchetype CR with the
desired phases. The archetype is cluster-scoped.
*/}}
{{- define "kubemoot-operator.consent3Spec" }}
  phases:
    - name: triaging
      role: gatekeeping
      description: "Coordinator probes which agents should join the thread."
    - name: mulling
      role: deliberation
      description: "Agents reason about the question with their full mulling model."
    - name: triage
      role: deliberation
      description: "Agents triage with a lighter model — quick 'should I contribute?' assessment."
    - name: evaluating
      role: deliberation
      description: "Active deliberation phase — agents emit agree / concern / stand_aside / block signals."
    - name: synthesis
      role: closure
      description: "Coordinator synthesizes the deliberation into a response."
  # The kinds of verdict an agent records with the signal tool. The runtime offers each
  # agent one tool, signal, whose kinds are these names and whose description carries
  # these meanings. The runtime knows what each of these names does in a phase; an
  # archetype may declare other kinds, which are recorded and shown to the synthesis.
  signals:
    - name: agree
      meaning: "Your finding stands: it answers your part of the question from what your tools returned."
    - name: concern
      meaning: "A finding on the table, yours or another agent's, is wrong or unverified. Say which claim, why, and what shows it. Name in to the agent whose claim you doubt: it is asked to recheck, answers, and you then signal again."
      addressed: true
      startsRecheck: true
    - name: question
      meaning: "You doubt a finding and want the agent that made it to recheck. Name that agent in to and ask what to check; it re-runs its assessment and answers, then you signal again."
      terminal: false
      addressed: true
    - name: stand_aside
      meaning: "You have nothing to add to this question."
    - name: tool_gap
      meaning: "Answering needs a tool you do not have. Say which tool."
    - name: no_data
      meaning: "Your tools ran but returned errors or nothing usable, so you have no finding. Say what was missing."
    - name: block
      meaning: "A finding or the emerging answer contradicts what your tools returned and must not stand."
  # One clarifying question per thread, started by a question or by a concern that names
  # the agent it doubts. 0 turns the round off: either is then recorded as a concern.
  recheck:
    maxRounds: 1
  # Only the analysts whose declared domains touch the question or the gathered data
  # review. With no match, the best-matching analyst reviews alone. Set convene: all
  # to have every analyst review. The analysts that declare no domain (a calculator
  # that computes over stored results) review first; the analysts that declare a
  # domain review after every one of them has replied, with their findings and the
  # working behind them in front of them. Set order: together to review at once.
  review:
    convene: domain
    fallback: primary
    order: generalistsFirst
  stateMachine:
    initial: triaging
    transitions:
      - from: triaging
        to: evaluating
        "on": all-triaged
      - from: evaluating
        to: synthesis
        "on": settled
{{- end }}

---
apiVersion: kubemoot.ai/v1alpha1
kind: MootArchetype
metadata:
  name: consent-3
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/builtin: "true"
spec:
  description: "Sociocracy 3.0 consent decision-making. Coordinator runs triaging, evaluating, synthesis."
{{- include "kubemoot-operator.consent3Spec" . }}
  ratify:
    enabled: false
---
{{- /*
consent-3-unratified is DEPRECATED and is removed in the next release. It is identical to
consent-3, which now ships with ratification off; point archetypeRef at consent-3.
*/}}
apiVersion: kubemoot.ai/v1alpha1
kind: MootArchetype
metadata:
  name: consent-3-unratified
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/builtin: "true"
spec:
  description: "DEPRECATED, removed in the next release: use consent-3, which now ships with ratification off."
{{- include "kubemoot-operator.consent3Spec" . }}
  ratify:
    enabled: false
