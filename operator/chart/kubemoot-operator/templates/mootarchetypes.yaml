{{/*
Default MootArchetypes shipped with the operator. These declare the phase
vocabulary that CrewSchedulingPolicy rules can reference.

`consent-3` is the default: consent decision making, the archetype Kubemoot
has shipped since the discussion system was introduced. The agent runtime does
not read it yet; its phases are the names CrewSchedulingPolicy rules use.

To add a new archetype (Robert's Rules, debate, expert panel, etc.) without
modifying the operator: kubectl apply a new MootArchetype CR with the
desired phases. The archetype is cluster-scoped.
*/}}
---
apiVersion: kubemoot.ai/v1alpha1
kind: MootArchetype
metadata:
  name: consent-3
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/builtin: "true"
spec:
  description: "Consent decision-making, the archetype Kubemoot ships. Today its phases are the scheduling phases a CrewSchedulingPolicy rule may name; the operator's per-phase model selection reads mulling and triage."
  phases:
    - name: triaging
      role: gatekeeping
      description: "Scheduling phase name for the coordinator's selection of the agents that join a discussion."
    - name: mulling
      role: deliberation
      description: "Scheduling phase: the model an agent's tool-calling evaluation runs on."
    - name: triage
      role: deliberation
      description: "Scheduling phase: the lighter model an agent's should-I-contribute check runs on."
    - name: evaluating
      role: deliberation
      description: "Scheduling phase name for the deliberation, where agents emit agree, concern, stand_aside, or block."
    - name: synthesis
      role: closure
      description: "Scheduling phase name for the coordinator's synthesis of the answer."
  signals:
    - triaging
    - evaluating
    - agree
    - concern
    - stand_aside
    - block
    - advisory
    - proposal
    - consent
  stateMachine:
    initial: triaging
    transitions:
      - from: triaging
        to: evaluating
        "on": all-triaged
      - from: evaluating
        to: synthesis
        "on": settled
