{{/*
Default MootArchetypes shipped with the operator. These declare the phase
vocabulary that CrewSchedulingPolicy rules can reference.

`consent-3` is the default — sociocracy 3.0 consent decision making, the
archetype kubemoot has shipped since the discussion system was introduced.

To add a new archetype (Robert's Rules, debate, expert panel, etc.) without
modifying the operator: kubectl apply a new MootArchetype CR with the
desired phases. The archetype is cluster-scoped.
*/}}
{{- define "kubemoot-operator.consent3Spec" }}
  phases:
    - name: triaging
      role: gatekeeping
      description: "Coordinator probes which agents should join the thread."
    - name: mulling
      role: deliberation
      description: "Agents reason about the question with their full mulling model."
    - name: triage
      role: deliberation
      description: "Agents triage with a lighter model — quick 'should I contribute?' assessment."
    - name: evaluating
      role: deliberation
      description: "Active deliberation phase — agents emit agree / concern / stand_aside / block signals."
    - name: synthesis
      role: closure
      description: "Coordinator synthesizes the deliberation into a response."
  signals:
    - triaging
    - evaluating
    - agree
    - concern
    - stand_aside
    - block
    - advisory
    - proposal
    - consent
  # Only the analysts whose declared domains touch the question or the gathered data
  # review. With no match, the best-matching analyst reviews alone. Set convene: all
  # to have every analyst review.
  review:
    convene: domain
    fallback: primary
  stateMachine:
    initial: triaging
    transitions:
      - from: triaging
        to: evaluating
        "on": all-triaged
      - from: evaluating
        to: synthesis
        "on": settled
{{- end }}

---
apiVersion: kubemoot.ai/v1alpha1
kind: MootArchetype
metadata:
  name: consent-3
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/builtin: "true"
spec:
  description: "Sociocracy 3.0 consent decision-making. Coordinator runs triaging, evaluating, synthesis."
{{- include "kubemoot-operator.consent3Spec" . }}
  ratify:
    enabled: false
---
{{- /*
consent-3-unratified is DEPRECATED and is removed in the next release. It is identical to
consent-3, which now ships with ratification off; point archetypeRef at consent-3.
*/}}
apiVersion: kubemoot.ai/v1alpha1
kind: MootArchetype
metadata:
  name: consent-3-unratified
  labels:
    {{- include "kubemoot-operator.labels" . | nindent 4 }}
    kubemoot.ai/builtin: "true"
spec:
  description: "DEPRECATED, removed in the next release: use consent-3, which now ships with ratification off."
{{- include "kubemoot-operator.consent3Spec" . }}
  ratify:
    enabled: false
