{{- range .Values.modelProviders }}
---
apiVersion: kubemoot.ai/v1alpha1
kind: ModelProvider
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "kubemoot-operator.labels" $ | nindent 4 }}
spec:
  type: {{ .type }}
  {{- with .endpoint }}
  endpoint: {{ . }}
  {{- end }}
  {{- with .serviceRef }}
  serviceRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .servers }}
  servers:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .sleepLevel }}
  sleepLevel: {{ . }}
  {{- end }}
  {{- if or .schedulingWeight .memoryMiB }}
  scheduling:
    {{- with .schedulingWeight }}
    weight: {{ . }}
    {{- end }}
    {{- with .memoryMiB }}
    memoryMiB: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
