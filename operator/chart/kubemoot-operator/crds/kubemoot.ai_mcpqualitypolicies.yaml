---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mcpqualitypolicies.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: MCPQualityPolicy
    listKind: MCPQualityPolicyList
    plural: mcpqualitypolicies
    shortNames:
    - mqp
    singular: mcpqualitypolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.considering.enabled
      name: AI
      type: boolean
    - jsonPath: .spec.considering.fallbackAction
      name: Fallback
      type: string
    - jsonPath: .status.serversEvaluated
      name: Evaluated
      type: integer
    - jsonPath: .status.serversAllowed
      name: Allowed
      type: integer
    - jsonPath: .status.serversBlocked
      name: Blocked
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MCPQualityPolicy defines quality and trust filtering for MCP
          servers
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MCPQualityPolicySpec defines the desired state of MCPQualityPolicy
              Evaluation order: allowing → blocking → tested → considering (AI evaluation)
            properties:
              allowing:
                description: |-
                  Allowing entries - accepted immediately without evaluation
                  Use for essential infrastructure MCPs that the evaluator Agent depends on
                  (e.g., GitHub MCP for fetching repo metrics during quality evaluation)
                items:
                  description: |-
                    AllowingEntry defines MCPs that are accepted immediately without evaluation
                    Use for essential infrastructure MCPs that the evaluator Agent depends on
                    (e.g., GitHub MCP for fetching repo metrics during evaluation)
                  properties:
                    author:
                      description: Author of the MCP server (exact match)
                      type: string
                    name:
                      description: Name of the MCP server (exact match)
                      type: string
                  type: object
                type: array
              blocking:
                description: |-
                  Blocking entries - rejected immediately without evaluation
                  Use for known bad actors, deprecated servers, or servers with security flaws
                items:
                  description: |-
                    BlockingEntry defines MCPs that are rejected immediately without evaluation
                    Use for known bad actors, deprecated servers, or servers with security flaws
                    Supports glob/regex matching and semver version constraints
                  properties:
                    author:
                      description: Author matcher for server author/publisher
                      properties:
                        negate:
                          description: Negate inverts the match result
                          type: boolean
                        type:
                          default: exact
                          description: 'Type of matching: exact, glob, or regex'
                          enum:
                          - exact
                          - glob
                          - regex
                          type: string
                        value:
                          description: Value to match against
                          type: string
                      required:
                      - value
                      type: object
                    name:
                      description: Name matcher for server name
                      properties:
                        negate:
                          description: Negate inverts the match result
                          type: boolean
                        type:
                          default: exact
                          description: 'Type of matching: exact, glob, or regex'
                          enum:
                          - exact
                          - glob
                          - regex
                          type: string
                        value:
                          description: Value to match against
                          type: string
                      required:
                      - value
                      type: object
                    reason:
                      description: Reason documents why this entry is blocked (for
                        audit/review)
                      type: string
                    version:
                      description: 'Version constraint (semver range: >=1.2.8, ^2.0.0,
                        ~1.5.0, 1.x, <2.0.0)'
                      type: string
                  type: object
                type: array
              considering:
                description: |-
                  Considering config - AI-based evaluation for MCPs not in allowing/blocking
                  This is the DEFAULT behavior for all MCPs not explicitly allowed or blocked
                properties:
                  agentRef:
                    description: AgentRef references the quality evaluator Agent CR
                    type: string
                  confidenceThreshold:
                    default: "0.7"
                    description: ConfidenceThreshold minimum confidence to accept
                      AI decision (0.0-1.0)
                    type: string
                  criteria:
                    description: Criteria inline evaluation criteria (alternative
                      to ConfigMap)
                    type: string
                  criteriaFromConfigMap:
                    description: CriteriaFromConfigMap loads evaluation criteria from
                      a ConfigMap
                    properties:
                      key:
                        description: Key within the ConfigMap
                        type: string
                      name:
                        description: Name of the ConfigMap
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  enabled:
                    default: true
                    description: |-
                      Enabled toggles AI-based evaluation (default: true)
                      If disabled, MCPs not in allowing/blocking use FallbackAction
                    type: boolean
                  fallbackAction:
                    default: deny
                    description: FallbackAction if AI unavailable, disabled, or below
                      confidence threshold
                    enum:
                    - allow
                    - deny
                    type: string
                  timeoutSeconds:
                    default: 30
                    description: TimeoutSeconds for AI evaluation
                    type: integer
                required:
                - agentRef
                - enabled
                type: object
              tested:
                description: |-
                  Tested config - evaluation based on MCPServerReport trial history
                  Inserted between blocking and considering in the evaluation pipeline
                properties:
                  blockBroken:
                    default: true
                    description: |-
                      BlockBroken automatically blocks servers with "avoid" verdict.
                      Unset means true.
                    type: boolean
                  enabled:
                    default: false
                    description: Enabled toggles tested-based evaluation
                    type: boolean
                  minSuccessRate:
                    default: "0.8"
                    description: MinSuccessRate is the minimum success rate to auto-allow
                      a server (0.0-1.0)
                    type: string
                  preferTested:
                    default: true
                    description: |-
                      PreferTested gives priority to servers with successful test history.
                      Unset means true.
                    type: boolean
                type: object
            type: object
          status:
            description: MCPQualityPolicyStatus defines the observed state of MCPQualityPolicy
            properties:
              conditions:
                description: Conditions represent the current state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastEvaluated:
                description: LastEvaluated timestamp
                format: date-time
                type: string
              serversAllowed:
                description: ServersAllowed count
                type: integer
              serversBlocked:
                description: ServersBlocked count
                type: integer
              serversEvaluated:
                description: ServersEvaluated count
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
