---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: mcpserverreports.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: MCPServerReport
    listKind: MCPServerReportList
    plural: mcpserverreports
    shortNames:
    - mcprpt
    singular: mcpserverreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverName
      name: Server
      type: string
    - jsonPath: .status.verdict
      name: Verdict
      type: string
    - jsonPath: .status.successRate
      name: Success%
      type: string
    - jsonPath: .status.recommendedTransport
      name: Transport
      type: string
    - jsonPath: .status.lastTested
      name: LastTested
      type: date
    - jsonPath: .spec.adminVerdict
      name: AdminVerdict
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPServerReport tracks deployment and runtime experience for an MCP server.
          One report per server name accumulates version-specific trial records,
          enabling the operator to learn which servers work reliably and which to avoid.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MCPServerReportSpec defines the identity and admin curation
              for an MCP server report
            properties:
              adminAuthor:
                description: AdminAuthor identifies who pinned the verdict
                type: string
              adminNotes:
                description: AdminNotes is a human-authored explanation for the pinned
                  verdict
                type: string
              adminVerdict:
                description: |-
                  AdminVerdict allows a human curator to pin a verdict, overriding automated assessment
                  When set, the controller preserves this verdict regardless of trial outcomes
                enum:
                - use
                - caution
                - avoid
                type: string
              githubUrl:
                description: GitHubURL is the GitHub repository URL
                type: string
              packageIdentifier:
                description: PackageIdentifier is the registry-specific package ID
                type: string
              registryType:
                description: RegistryType is the package registry (npm, docker, pip)
                type: string
              serverName:
                description: ServerName is the canonical name of the MCP server
                type: string
            required:
            - serverName
            type: object
          status:
            description: MCPServerReportStatus defines the continuously updated learning
              data
            properties:
              chroniclerNotes:
                description: ChroniclerNotes contains AI-generated analysis and recommendations
                type: string
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failureCount:
                description: FailureCount is the total number of failed trials
                format: int64
                type: integer
              lastSuccessful:
                description: LastSuccessful is when the most recent successful trial
                  was performed
                format: date-time
                type: string
              lastTested:
                description: LastTested is when the most recent trial was performed
                format: date-time
                type: string
              recommendedTransport:
                description: RecommendedTransport is the transport that has proven
                  most reliable
                type: string
              recommendedVersion:
                description: RecommendedVersion is the most recent version that succeeded
                type: string
              successCount:
                description: SuccessCount is the total number of successful trials
                format: int64
                type: integer
              successRate:
                description: SuccessRate is the computed success ratio (0.0-1.0)
                type: string
              trials:
                description: Trials is the recent trial history, capped at 20 entries
                items:
                  description: TrialRecord represents one attempt to deploy/connect/use
                    an MCP server version
                  properties:
                    errorMessage:
                      description: ErrorMessage contains the error if the trial failed
                      type: string
                    image:
                      description: Image is the container image used (if applicable)
                      type: string
                    phase:
                      description: Phase is where in the lifecycle the trial succeeded
                        or failed
                      enum:
                      - deploy
                      - connect
                      - initialize
                      - discover
                      - call
                      type: string
                    setupRecipe:
                      description: SetupRecipe is a YAML snippet of the working configuration
                      type: string
                    success:
                      description: Success indicates whether the trial passed
                      type: boolean
                    testedAt:
                      description: TestedAt is when this trial was performed
                      format: date-time
                      type: string
                    toolsFound:
                      description: ToolsFound is the number of tools discovered (for
                        discover phase)
                      type: integer
                    transport:
                      description: Transport used for the trial (http, sse, stdio)
                      enum:
                      - http
                      - sse
                      - stdio
                      type: string
                    version:
                      description: Version of the MCP server that was tested
                      type: string
                  required:
                  - phase
                  - success
                  - testedAt
                  - transport
                  - version
                  type: object
                type: array
              verdict:
                description: Verdict is the computed or admin-pinned reliability assessment
                enum:
                - use
                - caution
                - avoid
                - untested
                type: string
            required:
            - failureCount
            - successCount
            - successRate
            - verdict
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
