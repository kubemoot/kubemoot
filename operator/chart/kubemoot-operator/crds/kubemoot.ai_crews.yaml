---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: crews.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: Crew
    listKind: CrewList
    plural: crews
    shortNames:
    - crew
    singular: crew
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="CapacityAvailable")].status
      name: Capacity
      type: string
    - jsonPath: .status.coordinatorRef
      name: Coordinator
      type: string
    - jsonPath: .status.agentCount
      name: Agents
      type: integer
    - jsonPath: .status.discussionEndpoint
      name: Discussion
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Crew is the Schema for the crews API
          A Crew groups a coordinator and tooler agents into a named team.
          It optionally deploys a discussion gateway as the crew's HTTP entry point
          for external clients (CrewForge, Homelab Pilot, curl).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CrewSpec defines the desired state of Crew
            properties:
              description:
                description: Description is a human-readable description of the crew's
                  purpose
                type: string
              discussion:
                description: Discussion configures the crew's discussion gateway
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled controls whether a discussion gateway is deployed for this crew.
                      Unset means enabled.
                    type: boolean
                  resources:
                    description: Resources defines resource requirements for the gateway
                      pod
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              memory:
                description: |-
                  Memory configures the crew's working memory — facts the crew learns at
                  runtime (e.g. discovered label/topology mappings) and recalls later.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled turns crew working memory on. When false, agents neither recall
                      nor persist facts. Pointer so an explicit false is distinguishable from
                      unset (a plain bool + omitempty drops false and can't disable).
                    type: boolean
                  injectLimit:
                    default: 8
                    description: |-
                      InjectLimit caps how many facts are injected into an agent's context per
                      query. Small and SEPARATE from MaxFacts — large context degrades
                      tool-calling. Only domain+query-relevant facts are injected, up to this.
                    format: int32
                    minimum: 0
                    type: integer
                  maxFacts:
                    default: 5000
                    description: |-
                      MaxFacts is the per-crew storage cap. On write, least-recently-used facts
                      are evicted above this. Generous — facts are tiny and memory is cheap.
                    format: int32
                    minimum: 1
                    type: integer
                  ttlDays:
                    description: |-
                      TTLDays is deprecated: set retention.memory.purgeUnused instead. When set, it
                      overrides that value: a fact not used within this many days is removed.
                    format: int32
                    minimum: 1
                    type: integer
                  verifyOnAdd:
                    default: true
                    description: |-
                      VerifyOnAdd vets a new fact against existing memory before storing —
                      skips duplicates and supersedes conflicts (same-key) rather than blindly
                      accumulating. When false, REMEMBER writes straight through. Pointer so an
                      explicit false is distinguishable from unset.
                    type: boolean
                type: object
              network:
                description: |-
                  Network configures who may reach the crew's discussion gateway when the operator
                  generates network policies.
                properties:
                  allowedIngress:
                    description: |-
                      AllowedIngress lists namespaces whose pods may reach the crew's discussion gateway,
                      for example the namespace of the web server that fronts the crew. Each entry is a
                      namespace selector; an empty selector matches every namespace.
                    items:
                      description: |-
                        A label selector is a label query over a set of resources. The result of matchLabels and
                        matchExpressions are ANDed. An empty label selector matches all objects. A null
                        label selector matches no objects.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    maxItems: 16
                    type: array
                type: object
              retention:
                default: {}
                description: |-
                  Retention declares how long the crew's data is kept in NATS: conversations, working
                  memory and the crew's other messages. The operator removes what has expired on the
                  declared schedule. Unset fields take the defaults on this schema.
                properties:
                  conversations:
                    default: {}
                    description: Conversations governs the earlier turns the crew
                      keeps for follow-up questions.
                    properties:
                      window:
                        default: 30d
                        description: |-
                          Window is how long a conversation is kept after its last turn; the oldest go first.
                          never is not accepted: conversations are people's data and always age out.
                        minLength: 2
                        pattern: ^(never|([1-9][0-9]*y)?([1-9][0-9]*w)?([1-9][0-9]*d)?([1-9][0-9]*h)?([1-9][0-9]*m)?([1-9][0-9]*s)?)$
                        type: string
                    type: object
                  memory:
                    default: {}
                    description: Memory governs the facts the crew learns.
                    properties:
                      purgeUnused:
                        description: |-
                          PurgeUnused removes a fact not written or recalled for this long. never keeps
                          every fact until it is superseded, invalidated, evicted by the size cap, or deleted.
                          Unset takes the crew-wide purgeUnused.
                        minLength: 2
                        pattern: ^(never|([1-9][0-9]*y)?([1-9][0-9]*w)?([1-9][0-9]*d)?([1-9][0-9]*h)?([1-9][0-9]*m)?([1-9][0-9]*s)?)$
                        type: string
                    type: object
                  other:
                    description: |-
                      Other governs the crew's remaining NATS data: its discussion messages and the
                      coordinators' logs. These streams also keep the size and age limits the install
                      sets on them, so this can only shorten what the streams keep.
                    properties:
                      window:
                        description: |-
                          Window is how long a message of the crew is kept. Unset leaves the streams' own limits.
                          never is not accepted.
                        minLength: 2
                        pattern: ^(never|([1-9][0-9]*y)?([1-9][0-9]*w)?([1-9][0-9]*d)?([1-9][0-9]*h)?([1-9][0-9]*m)?([1-9][0-9]*s)?)$
                        type: string
                    type: object
                  purgeUnused:
                    default: 90d
                    description: |-
                      PurgeUnused removes anything with no activity (written or recalled) for this long.
                      It applies to conversations (their last turn is their activity) and to memory,
                      unless memory sets its own.
                    minLength: 2
                    pattern: ^(never|([1-9][0-9]*y)?([1-9][0-9]*w)?([1-9][0-9]*d)?([1-9][0-9]*h)?([1-9][0-9]*m)?([1-9][0-9]*s)?)$
                    type: string
                  schedule:
                    default: '@daily'
                    description: |-
                      Schedule is when the cleanup runs, in UTC: a cron expression of five fields, or @hourly,
                      @daily, @weekly, @monthly, @yearly. The operator reports a duration finer than the
                      interval between runs.
                    type: string
                type: object
              workspace:
                description: |-
                  Workspace declares the default workspace access of the crew's agents. An Agent's own
                  workspace.access overrides it.
                properties:
                  defaultAccess:
                    description: DefaultAccess is the access of every agent of the
                      crew that does not declare its own.
                    enum:
                    - none
                    - read
                    - write
                    - readWrite
                    type: string
                type: object
            type: object
          status:
            description: CrewStatus defines the observed state of Crew
            properties:
              agentCount:
                description: AgentCount is the number of agents that belong to this
                  crew
                format: int32
                type: integer
              conditions:
                description: |-
                  Conditions represent the latest available observations: Ready (reconciled as
                  declared) and CapacityAvailable (a model in the cluster catalog can run the
                  crew's agents now).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              coordinatorRef:
                description: CoordinatorRef is the name of the coordinator Agent for
                  this crew
                type: string
              discussionEndpoint:
                description: |-
                  DiscussionEndpoint is the HTTP endpoint for the discussion gateway
                  Clients POST here to start discussions and GET SSE streams
                type: string
              message:
                description: Message provides additional status information
                type: string
              observedGeneration:
                description: ObservedGeneration is the Crew generation the status
                  describes.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is the crew lifecycle: Pending while the coordinator is not yet running,
                  Ready when the crew is reconciled and a model can run its agents, WaitingForCapacity
                  when the crew is reconciled but no model in the cluster catalog can run its
                  coordinator (or any specialist) now, and Error when a reconcile step failed.
                type: string
              ready:
                description: |-
                  Ready mirrors the Ready condition: the crew is reconciled as declared (its agents,
                  gateways and policies exist as specified). It stays true while the crew waits for
                  capacity; the CapacityAvailable condition and the WaitingForCapacity phase say that
                  the crew cannot answer yet.
                type: boolean
              retention:
                description: Retention reports the crew's last retention cleanup.
                properties:
                  error:
                    description: Error is why the last run did not finish, empty when
                      it did.
                    type: string
                  lastRunTime:
                    description: LastRunTime is when the last cleanup run finished.
                    format: date-time
                    type: string
                  removed:
                    description: Removed counts what the last run removed.
                    properties:
                      conversations:
                        format: int32
                        type: integer
                      memory:
                        format: int32
                        type: integer
                      other:
                        format: int32
                        type: integer
                    required:
                    - conversations
                    - memory
                    - other
                    type: object
                type: object
              revisions:
                description: |-
                  Revisions records the crew's deployments, newest first, capped at 10.
                  The operator appends an entry when the Crew's revision annotation,
                  deployed-at annotation, or crew-version label changes.
                items:
                  description: |-
                    CrewRevision is one observed deployment of a Crew. Revision, Source, Owner,
                    Channel and DeployedAt come from the crewforge.kubemoot.ai/* annotations a
                    CrewForge deploy stamps; CrewVersion comes from the kubemoot.ai/crew-version
                    label a chart deploy stamps.
                  properties:
                    channel:
                      description: Channel is how the crew was deployed (helm, bundle,
                        flux)
                      type: string
                    crewVersion:
                      description: CrewVersion is the crew chart version from the
                        kubemoot.ai/crew-version label
                      type: string
                    deployedAt:
                      description: DeployedAt is the RFC3339 deploy time the deployer
                        stamped
                      type: string
                    observedAt:
                      description: ObservedAt is when the operator first observed
                        this revision
                      format: date-time
                      type: string
                    owner:
                      description: Owner is the email of the developer who deployed
                        the crew
                      type: string
                    revision:
                      description: Revision is the git short hash of the crew source,
                        optionally suffixed "-dirty"
                      type: string
                    source:
                      description: Source is the crew source location as repo//path
                      type: string
                  required:
                  - observedAt
                  type: object
                maxItems: 10
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
