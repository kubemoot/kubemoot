---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: models.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: Model
    listKind: ModelList
    plural: models
    shortNames:
    - mdl
    singular: model
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef
      name: Provider
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.modelInfo.size
      name: Size
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Model is the Schema for the models API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSpec defines the desired state of Model.
            properties:
              contextLength:
                description: ContextLength is the maximum context window size (optional
                  override)
                type: integer
              model:
                description: Model is the model identifier (e.g., "qwen2.5:7b", "gpt-4o")
                type: string
              providerRef:
                description: ProviderRef references the parent ModelProvider
                type: string
              quantization:
                description: Quantization specifies the quantization method (e.g.,
                  q4_K_M)
                type: string
              vramMib:
                description: |-
                  VRAMMib declares the VRAM footprint (in MiB) this Model needs when
                  loaded on a Provider. Used by the Scheduler v2 filter step to enforce
                  capacity: a Model is feasible on a Provider only when
                  VRAMMib <= ModelProvider.status.capacity.vramTotalMiB after eviction
                  of any displaceable resident models. Required for CrewSchedulingPolicy
                  matching; if unset, the Model is treated as best-fit-unknown and may
                  be filtered out under strict policies.

                  See kubemoot/docs/scheduler-v2.md for the scheduling algorithm.
                format: int32
                minimum: 0
                type: integer
            required:
            - model
            - providerRef
            type: object
          status:
            description: ModelStatus defines the observed state of Model.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: Endpoint is the inference endpoint for this model
                type: string
              message:
                description: Message provides additional status information
                type: string
              modelInfo:
                description: ModelInfo contains metadata discovered after download
                properties:
                  contextLength:
                    description: ContextLength is the maximum context window
                    type: integer
                  digest:
                    description: Digest is the model digest/hash
                    type: string
                  family:
                    description: Family is the model family (e.g., "llama", "qwen",
                      "mistral")
                    type: string
                  format:
                    description: Format is the model format (e.g., "gguf", "safetensors")
                    type: string
                  modifiedAt:
                    description: ModifiedAt is when the model was last modified
                    type: string
                  parameters:
                    description: Parameters is the parameter count (e.g., "7B", "70B")
                    type: string
                  quantization:
                    description: Quantization is the detected quantization (e.g.,
                      "Q4_K_M", "F16")
                    type: string
                  size:
                    description: Size is the model size on disk (e.g., "4.7GB")
                    type: string
                type: object
              ready:
                description: Ready indicates if the model is ready for inference
                type: boolean
              state:
                description: |-
                  State is the current state (Pending, Pulling, Available, Loaded, Error)
                  Available = downloaded, Loaded = in GPU memory
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
