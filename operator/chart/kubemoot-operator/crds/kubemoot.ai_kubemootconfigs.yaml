---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: kubemootconfigs.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: KubemootConfig
    listKind: KubemootConfigList
    plural: kubemootconfigs
    shortNames:
    - wc
    singular: kubemootconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.images.indexer
      name: Indexer
      priority: 1
      type: string
    - jsonPath: .spec.images.queryService
      name: QueryService
      priority: 1
      type: string
    - jsonPath: .spec.images.agentRuntime
      name: AgentRuntime
      priority: 1
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubemootConfig is the Schema for the kubemootconfigs API
          KubemootConfig is a cluster-scoped singleton that centralizes default images
          and configuration for all Kubemoot components. It eliminates hardcoded image
          versions in operator source code and enables GitOps-friendly version management.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubemootConfigSpec defines the desired state of KubemootConfig
            properties:
              defaults:
                description: Defaults defines default configurations for Kubemoot
                  components
                properties:
                  agentResources:
                    description: |-
                      AgentResources is the default resource requirements for the agent container of every
                      Agent (the agent runtime, or the harness in sidecar mode). It is merged per resource
                      name over the operator's built-in default and under an Agent's own
                      spec.deployment.resources (legacy mode) or spec.harness.resources (sidecar mode).
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  agentRuntimeClassName:
                    description: |-
                      AgentRuntimeClassName is the default Kubernetes RuntimeClass for the pods of every
                      Agent, for example gvisor. Empty, the pods set no runtimeClassName and run under the
                      node's default runtime. An Agent's own spec.deployment.runtimeClassName wins, and an
                      explicit empty string there turns the default off for that Agent. The class and its
                      runtime are installed by the cluster owner; see concepts/isolation in the docs.
                    maxLength: 253
                    pattern: ^([a-z0-9]([-a-z0-9.]*[a-z0-9])?)?$
                    type: string
                  embeddingModel:
                    default: nomic-embed
                    description: EmbeddingModel is the default EmbeddingModel CR name
                      referenced by RAGSources
                    type: string
                  imagePullSecrets:
                    description: ImagePullSecrets are the default image pull secrets
                      for all operator-managed workloads
                    items:
                      description: |-
                        LocalObjectReference contains enough information to let you locate the
                        referenced object inside the same namespace.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                  maxIndexBuildsPerServer:
                    default: 2
                    description: |-
                      MaxIndexBuildsPerServer is the most RAGSource index builds that run at once against
                      one embedding server. Further builds wait in the Queued phase and start when a
                      build on that server finishes.
                    format: int32
                    minimum: 1
                    type: integer
                  otelCollectorEndpoint:
                    description: |-
                      OTelCollectorEndpoint is the default OpenTelemetry collector endpoint for all agents
                      Agents use this as their tracing endpoint
                    type: string
                  scheduler:
                    description: Scheduler configures the GPU-aware agent scheduler
                    properties:
                      enabled:
                        description: Enabled turns on automatic agent scheduling.
                          Default false.
                        type: boolean
                      placementPolicy:
                        default: algorithm
                        description: |-
                          PlacementPolicy is the realm default for how agents decide where each
                          model call runs: "algorithm" (the hand-written placement order),
                          "learned" (placement learned from observed performance), or "shadow"
                          (the algorithm places; the learned policy's choice is recorded beside
                          it). A crew's CrewSchedulingPolicy spec.placementPolicy overrides it.
                          Independent of Enabled.
                        enum:
                        - algorithm
                        - learned
                        - shadow
                        type: string
                      placementService:
                        description: |-
                          PlacementService points agents at the placement service. When enabled,
                          agents call the service at its URL for placement and ticket ownership;
                          when off (the default), agents place in-process.
                        properties:
                          enabled:
                            description: Enabled makes agents call the placement service.
                              Default false.
                            type: boolean
                          url:
                            description: |-
                              URL is the placement service base URL, for example
                              http://placement-service.kubemoot-system.svc:8080. Agents get no
                              service setting when it is empty.
                            type: string
                        type: object
                      probeIntervalSeconds:
                        default: 30
                        description: ProbeIntervalSeconds is how often to probe servers
                          for capacity. Default 30.
                        type: integer
                      prometheusEndpoint:
                        description: PrometheusEndpoint for DCGM metric queries
                        type: string
                      strategy:
                        default: spread
                        description: 'Strategy is the scheduling strategy: "spread"
                          (default) or "bin-pack"'
                        enum:
                        - spread
                        - bin-pack
                        type: string
                    type: object
                  vectorStoreEndpoint:
                    description: |-
                      VectorStoreEndpoint is the default vector store endpoint for tool indexing
                      When empty, automatic tool indexing on MCPServers is disabled
                      Example: "homelab-pilot-db.homelab-pilot:5432/homelab_pilot"
                    type: string
                  vectorStoreType:
                    default: pgvector
                    description: VectorStoreType is the default vector store type
                      (pgvector, qdrant, milvus, chroma)
                    enum:
                    - pgvector
                    - qdrant
                    - milvus
                    - chroma
                    type: string
                type: object
              images:
                description: Images defines the default container images for Kubemoot
                  components
                properties:
                  agentRuntime:
                    default: ghcr.io/kubemoot/agent-runtime:latest
                    description: AgentRuntime is the default agent runtime image for
                      Agent deployments
                    type: string
                  agentSidecar:
                    default: ghcr.io/kubemoot/agent-sidecar:latest
                    description: |-
                      AgentSidecar is the Moot Mesh sidecar image the operator adds to the pod of an Agent
                      whose harness mode is sidecar. The chart stamps it from the release; a floating tag
                      would break version pinning.
                    type: string
                  artifactAccess:
                    description: |-
                      ArtifactAccess is the artifact-access image: the read-ops MCP server a crew
                      runs (ARTIFACT_MODE=mcp) to read the artifact store when a tool result spills
                      over the inline limit. An MCPServer selects it with spec.kubemootImage
                      instead of naming an image. The operator chart stamps it from the release;
                      there is no default, because a floating tag would break version pinning.
                    type: string
                  discussionGateway:
                    default: ghcr.io/kubemoot/discussion-gateway:latest
                    description: DiscussionGateway is the default Discussion Gateway
                      image
                    type: string
                  doclingServe:
                    default: quay.io/docling-project/docling-serve-cpu:latest
                    description: DoclingServe is the docling-serve image for document
                      source RAGSource indexing
                    type: string
                  fitnessRunner:
                    default: ghcr.io/kubemoot/fitness-runner:latest
                    description: FitnessRunner is the default fitness runner image
                      for CrewFitness test jobs
                    type: string
                  harnessGoose:
                    default: ghcr.io/kubemoot/harness-goose:latest
                    description: |-
                      HarnessGoose is the harness-goose image: the harness shim and the goose binary. An Agent
                      whose harness is named goose and sets no image of its own runs it. The chart stamps it
                      from the release; a floating tag would break version pinning.
                    type: string
                  indexer:
                    default: ghcr.io/kubemoot/indexer:latest
                    description: Indexer is the default indexer image for RAGSource
                      indexing jobs
                    type: string
                  mcpBridge:
                    default: ghcr.io/kubemoot/mcp-bridge:latest
                    description: McpBridge is the default MCP bridge image for stdio-to-HTTP
                      proxy injection
                    type: string
                  mcpGateway:
                    default: ghcr.io/kubemoot/mcp-gateway:latest
                    description: McpGateway is the default MCP Gateway image
                    type: string
                  queryService:
                    default: ghcr.io/kubemoot/query-service:latest
                    description: QueryService is the default query service image for
                      RAGSource
                    type: string
                type: object
            type: object
          status:
            description: KubemootConfigStatus defines the observed state of KubemootConfig
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastUpdated:
                description: LastUpdated is the timestamp of the last configuration
                  update
                format: date-time
                type: string
              message:
                description: Message provides additional status information
                type: string
              ready:
                description: Ready indicates if the configuration has been successfully
                  applied
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
