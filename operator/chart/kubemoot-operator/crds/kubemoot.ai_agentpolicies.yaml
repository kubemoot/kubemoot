---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: agentpolicies.kubemoot.ai
spec:
  group: kubemoot.ai
  names:
    kind: AgentPolicy
    listKind: AgentPolicyList
    plural: agentpolicies
    shortNames:
    - ap
    singular: agentpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - description: Number of agents referencing this policy
      jsonPath: .status.referencedBy
      name: Refs
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentPolicy defines behavioral configuration for Agents.
          Behavioral config (guardrails, A2A, observability, prompt, inference) is
          hot-reloaded via ConfigMap without pod restart, unlike structural config
          in the Agent CRD which triggers pod restart on change.
          One AgentPolicy can be shared across many Agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentPolicySpec defines the desired state of AgentPolicy
            properties:
              a2a:
                description: A2A defines agent-to-agent coordination settings
                properties:
                  discussionTimeoutSeconds:
                    description: 'DiscussionTimeoutSeconds is how long a coordinator
                      waits for contributions (default: 30)'
                    format: int32
                    type: integer
                  enabled:
                    description: Enabled toggles A2A coordination
                    type: boolean
                  maxInferencesPerMinute:
                    description: MaxInferencesPerMinute limits how many discussion
                      contributions per minute (0 = unlimited)
                    format: int32
                    type: integer
                  role:
                    default: specialist
                    description: Role defines how this agent participates in coordination
                    enum:
                    - coordinator
                    - specialist
                    - peer
                    type: string
                  skills:
                    description: Skills are capabilities advertised to other agents
                    items:
                      description: AgentSkill describes a capability advertised to
                        other agents
                      properties:
                        description:
                          description: Description explains what this skill does
                          type: string
                        id:
                          description: ID is the unique identifier for this skill
                          type: string
                        name:
                          description: Name is the human-readable skill name
                          type: string
                      required:
                      - id
                      - name
                      type: object
                    type: array
                  subscribeChannels:
                    description: |-
                      SubscribeChannels lists NATS discussion channels this agent subscribes to
                      (e.g., kubernetes, observability, proxmox, general)
                    items:
                      type: string
                    type: array
                type: object
              guardrails:
                description: Guardrails define operational safety constraints
                properties:
                  allowedNamespaces:
                    description: AllowedNamespaces restricts agent scope (empty =
                      all namespaces)
                    items:
                      type: string
                    type: array
                  auditLog:
                    default: true
                    description: AuditLog enables logging all tool invocations
                    type: boolean
                  confirmDestructive:
                    default: true
                    description: ConfirmDestructive requires user confirmation for
                      delete/update operations
                    type: boolean
                  deniedResources:
                    description: DeniedResources blocks access to resource types (e.g.,
                      "secrets", "nodes")
                    items:
                      type: string
                    type: array
                  maxTokensPerRequest:
                    description: MaxTokensPerRequest caps LLM token usage for cost
                      control (0 = unlimited)
                    format: int32
                    type: integer
                  maxToolCallsPerTurn:
                    default: 25
                    description: MaxToolCallsPerTurn prevents runaway loops (0 = unlimited)
                    format: int32
                    type: integer
                  readBeforeWrite:
                    default: true
                    description: ReadBeforeWrite requires capturing current state
                      before mutations
                    type: boolean
                type: object
              inference:
                description: Inference defines inference parameters
                properties:
                  maxTokens:
                    default: 2048
                    description: MaxTokens is the maximum tokens to generate
                    format: int32
                    type: integer
                  stopSequences:
                    description: StopSequences are tokens that stop generation
                    items:
                      type: string
                    type: array
                  temperature:
                    default: "0.7"
                    description: Temperature controls randomness (0.0-2.0)
                    type: string
                  topK:
                    description: TopK is top-k sampling parameter
                    format: int32
                    type: integer
                  topP:
                    default: "0.9"
                    description: TopP is nucleus sampling parameter
                    type: string
                type: object
              observability:
                description: Observability defines tracing and metrics settings
                properties:
                  metrics:
                    description: Metrics configures Prometheus metrics exposure
                    properties:
                      enabled:
                        default: true
                        description: Enabled toggles metrics exposure
                        type: boolean
                      port:
                        default: 9090
                        description: Port for the metrics endpoint
                        format: int32
                        type: integer
                    type: object
                  serviceMonitor:
                    description: ServiceMonitor enables creation of a Prometheus ServiceMonitor
                    type: boolean
                  tracing:
                    description: Tracing configures OpenTelemetry trace collection
                    properties:
                      enabled:
                        description: Enabled toggles trace collection
                        type: boolean
                      endpoint:
                        description: Endpoint is the OTel collector endpoint (falls
                          back to KubemootConfig default)
                        type: string
                      samplingRate:
                        default: "1.0"
                        description: SamplingRate controls trace sampling (0.0-1.0)
                        type: string
                    type: object
                type: object
              prompt:
                description: Prompt defines system prompts and instructions
                properties:
                  promptRefs:
                    description: |-
                      PromptRefs are references to PromptModule resources by name (in the same namespace).
                      Modules are sorted by their Order field and concatenated before prompt.system.
                    items:
                      type: string
                    type: array
                  system:
                    description: |-
                      System is the inline system prompt text.
                      Deprecated: Use PromptModules instead. Will be removed in a future version.
                    type: string
                  systemConfigMapKey:
                    default: system.txt
                    description: 'SystemConfigMapKey is the key in the ConfigMap (default:
                      "system.txt")'
                    type: string
                  systemConfigMapRef:
                    description: SystemConfigMapRef references a ConfigMap containing
                      the system prompt
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  variables:
                    additionalProperties:
                      type: string
                    description: Variables are template variables to substitute in
                      the prompt
                    type: object
                type: object
            type: object
          status:
            description: AgentPolicyStatus defines the observed state of AgentPolicy
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastUpdated:
                description: LastUpdated is when the policy was last reconciled
                format: date-time
                type: string
              message:
                description: Message provides additional status information
                type: string
              ready:
                description: Ready indicates the policy is valid and available
                type: boolean
              referencedBy:
                description: ReferencedBy lists Agent names using this policy
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
