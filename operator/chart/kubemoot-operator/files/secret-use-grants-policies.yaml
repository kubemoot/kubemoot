# Rendered into the chart by templates/secret-use-grants.yaml; the operator envtest suite applies
# this same file. The exempt-users placeholder in the first matchCondition is replaced by the
# quoted, comma-separated user names the API server uses.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubemoot-secret-use-mcpserver
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kubemoot.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mcpservers"]
  matchConditions:
    - name: not-exempt-user
      expression: "!(request.userInfo.username in [__EXEMPT_USERS__])"
    - name: spec-changed
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  # The names are collected into variables; each validation checks one field. A message cannot
  # see the authorizer, so it names the Secrets or ServiceAccounts in that field the requester
  # needs the verb "use" on.
  variables:
    - name: envNames
      expression: >-
        (has(object.spec.env) ? object.spec.env.filter(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)).map(e, e.valueFrom.secretKeyRef.name) : [])
    - name: secretRefNames
      expression: >-
        has(object.spec.secretRef) ? [object.spec.secretRef] : []
    - name: volumeNames
      expression: >-
        has(object.spec.secretVolumes) ? object.spec.secretVolumes.map(v, v.name) : []
    - name: authNames
      expression: >-
        has(object.spec.registry) && has(object.spec.registry.authSecretRef) ? [object.spec.registry.authSecretRef] : []
    - name: sidecarNames
      expression: >-
        has(object.spec.sidecars) ? object.spec.sidecars.map(c, (has(c.env) ? c.env.filter(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)).map(e, e.valueFrom.secretKeyRef.name) : []) + (has(c.envFrom) ? c.envFrom.filter(f, has(f.secretRef)).map(f, f.secretRef.name) : [])) : []
    - name: accountNames
      expression: >-
        has(object.spec.serviceAccountName) ? [object.spec.serviceAccountName] : []
  validations:
    - expression: "variables.envNames.all(n, n == '' || authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'MCPServer spec.env: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.envNames.map(n, 'secrets/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
    - expression: "variables.secretRefNames.all(n, n == '' || authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'MCPServer spec.secretRef: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.secretRefNames.map(n, 'secrets/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
    - expression: "variables.volumeNames.all(n, n == '' || authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'MCPServer spec.secretVolumes: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.volumeNames.map(n, 'secrets/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
    - expression: "variables.authNames.all(n, n == '' || authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'MCPServer spec.registry.authSecretRef: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.authNames.map(n, 'secrets/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
    - expression: "variables.sidecarNames.all(l, l.all(n, n == '' || authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('use').allowed()))"
      reason: Forbidden
      messageExpression: >-
        'MCPServer spec.sidecars: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.sidecarNames.map(l, l.map(n, 'secrets/' + n).join(', ')).filter(t, t != '').join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
    - expression: "variables.accountNames.all(n, n == '' || n == 'default' || authorizer.group('').resource('serviceaccounts').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'MCPServer spec.serviceAccountName: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.accountNames.map(n, 'serviceaccounts/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubemoot-secret-use-agent
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kubemoot.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agents"]
  matchConditions:
    - name: not-exempt-user
      expression: "!(request.userInfo.username in [__EXEMPT_USERS__])"
    - name: spec-changed
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  # The names are collected into variables; each validation checks one field. A message cannot
  # see the authorizer, so it names the Secrets or ServiceAccounts in that field the requester
  # needs the verb "use" on.
  variables:
    - name: envNames
      expression: >-
        has(object.spec.deployment) ? (has(object.spec.deployment.env) ? object.spec.deployment.env.filter(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)).map(e, e.valueFrom.secretKeyRef.name) : []) : []
    - name: harnessEnvNames
      expression: >-
        has(object.spec.harness) ? (has(object.spec.harness.env) ? object.spec.harness.env.filter(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)).map(e, e.valueFrom.secretKeyRef.name) : []) : []
    - name: memoryNames
      expression: >-
        has(object.spec.memory) && has(object.spec.memory.secretRef) ? [object.spec.memory.secretRef] : []
    - name: accountNames
      expression: >-
        has(object.spec.deployment) && has(object.spec.deployment.serviceAccountName) ? [object.spec.deployment.serviceAccountName] : []
  validations:
    - expression: "variables.envNames.all(n, n == '' || authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'Agent spec.deployment.env: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.envNames.map(n, 'secrets/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
    - expression: "variables.harnessEnvNames.all(n, n == '' || authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'Agent spec.harness.env: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.harnessEnvNames.map(n, 'secrets/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
    - expression: "variables.memoryNames.all(n, n == '' || authorizer.group('').resource('secrets').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'Agent spec.memory.secretRef: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.memoryNames.map(n, 'secrets/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
    - expression: "variables.accountNames.all(n, n == '' || n == 'default' || authorizer.group('').resource('serviceaccounts').namespace(object.metadata.namespace).name(n).check('use').allowed())"
      reason: Forbidden
      messageExpression: >-
        'Agent spec.deployment.serviceAccountName: ' + request.userInfo.username + ' needs the verb "use" on every one of: ' +
        variables.accountNames.map(n, 'serviceaccounts/' + n).join(', ') + '. Ask an admin for a Role with that verb and resourceNames.'
