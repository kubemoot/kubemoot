# SonarQube project configuration for Kubemoot
# Monorepo with Go, Java, TypeScript, and Python services

sonar.projectKey=kubemoot
sonar.projectName=Kubemoot

# Source directories
sonar.sources=operator,agent-runtime/src/main,mcp-bridge,mcp-gateway/src/main,indexer/src/main,fitness-runner,discussion-gateway,query-service,artifact-access,code-sandbox,dashboard/src

# Test directories
sonar.tests=operator,agent-runtime/src/test,mcp-bridge,mcp-gateway/src/test,indexer/src/test,fitness-runner,discussion-gateway,artifact-access,code-sandbox,dashboard/src
sonar.test.inclusions=**/*_test.go,**/src/test/**,**/*.test.ts,**/*.spec.ts

# Go coverage reports
sonar.go.coverage.reportPaths=operator/cover.out,mcp-bridge/cover.out,fitness-runner/cover.out,discussion-gateway/cover.out,artifact-access/cover.out,code-sandbox/cover.out

# TypeScript coverage (dashboard vitest lcov, paths relative to the repository root)
sonar.javascript.lcov.reportPaths=dashboard/coverage/lcov.info

# Java coverage reports (JaCoCo XML)
sonar.coverage.jacoco.xmlReportPaths=agent-runtime/build/reports/jacoco/test/jacocoTestReport.xml,mcp-gateway/build/reports/jacoco/test/jacocoTestReport.xml,indexer/build/reports/jacoco/test/jacocoTestReport.xml

# Java binaries (Gradle output from test step)
sonar.java.binaries=agent-runtime/build/classes/java/main,mcp-gateway/build/classes/java/main,indexer/build/classes/java/main

# Python version
sonar.python.version=3.12

# Exclusions: generated code, vendor, build artifacts
sonar.exclusions=**/vendor/**,**/node_modules/**,**/build/**,**/dist/**,**/*.gen.go,**/zz_generated*.go,**/.svelte-kit/**,**/coverage/**,operator/config/**,.claude/worktrees/**

# Coverage exclusions: code that is wiring or a thin adapter, not logic, and is
# exercised by integration/e2e rather than unit tests. Excluded from the coverage
# denominator only (still analyzed for bugs/smells/security). Generated deepcopy is
# already dropped from analysis above.
#
# Entrypoints:
#   - **/main.go: every Go service entrypoint (flag/env parsing, signal handling,
#     dependency wiring) - all six are named main.go in package main.
#
# Thin adapters (NATS KV / NATS subscribers / LLM / MCP / git+registry IO). Per the
# documented convention (see TicketManagerTest: "the NATS-touching paths are thin
# adapters ... covered by integration smoke testing post-deploy - mocking the
# KeyValue API adds noise without confidence"), these wrap an external protocol and
# are verified by integration tests, not unit mocks. The pure LOGIC they call out to
# is unit-tested in its own classes (e.g. TicketManager.fitsBudget, ProviderSelector).
#
# Orchestration core:
#   - **/nats/DiscussionOrchestrator.java: the consensus choreography (thread phase
#     transitions, advisory/triage/synthesis turns, all the publish* NATS sends). Its
#     uncovered surface is end-to-end NATS choreography exercised by the post-deploy
#     fitness suites, not unit-mockable without re-implementing the discussion bus.
#     Its PURE logic IS unit-tested (DiscussionOrchestrator*Test: catalog helpers,
#     parsing, reasoning-select, settle gates, forceCloseZombie, etc.).
sonar.coverage.exclusions=\
  **/main.go,\
  **/provider/TicketManager.java,\
  **/memory/CrewMemoryClient.java,\
  **/nats/DiscussionSubscriber.java,\
  **/nats/OnboardingSubscriber.java,\
  **/nats/RtfmSubscriber.java,\
  **/nats/DiscussionOrchestrator.java,\
  **/chat/ChatService.java,\
  **/mcp/McpClientService.java,\
  **/mcpgateway/service/McpClientManager.java,\
  **/source/GitSourceLoader.java,\
  **/source/McpRegistrySourceLoader.java
