<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/kubemoot-favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kubemoot Dashboard</title>
		<script>
			// Apply the viewer's appearance before the first paint (see lib/theme.ts): Dark unless
			// they chose Light, or System with an operating system that prefers light.
			(function () {
				var theme = 'dark';
				try {
					var pref = localStorage.getItem('kubemoot-dashboard-theme');
					if (pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) theme = 'light';
				} catch (e) {}
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
