<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.8 0 685.5 192.9" width="686" height="193" role="img" aria-label="Kubemoot: a round table with seven water drops gathered around it, and the name kubemoot">
  <title>Kubemoot</title>
  <!-- No background: the lockup sits on whatever is behind it. -->
  <!-- Keyline: a light rim behind the table. Faint on white, it outlines the table on dark. -->
  <circle cx="100" cy="100" r="43" fill="#e5e7eb"/>
  <!-- The table: a round table, seen from above. -->
  <circle cx="100" cy="100" r="40" fill="#1f2a37"/>
  <circle cx="100" cy="100" r="32" fill="none" stroke="#5b8def" stroke-width="5"/>
