# Default values for kubemoot-dashboard
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Application image configuration
image:
  # Public releases are published to GHCR; a private mirror overrides registry
  # (e.g. harbor.example.com) and adds its pull secret below.
  registry: ghcr.io
  repository: kubemoot/dashboard
  # Empty: the tag is .Chart.AppVersion, which the chart release stamps from git tags
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for image.registry. Empty for the public registry.
imagePullSecrets: []

# Number of replicas
replicaCount: 1

# Service account configuration
serviceAccount:
  create: true
  name: kubemoot-dashboard
  annotations: {}

# RBAC configuration
rbac:
  create: true
  # Off by default: the dashboard's ServiceAccount holds only the right to create TokenReviews.
  # The namespaces that hold crews are found from the bus the dashboard already reads (the agent
  # heartbeat keys), then each is checked with the signed-in person's own token (a
  # SelfSubjectAccessReview for get on crews there). On, the ServiceAccount may also `list` Crews
  # cluster-wide as a second source, so a crew whose agents are all down still shows its history.
  # Nothing it lists reaches a person who may not read it.
  crewNamespaceDiscovery: false
  # Sign-in needs only the right to create TokenReviews, which the chart always grants. This
  # ClusterRole, for reading Kubemoot CRDs and K8s resources, is created only when
  # auth.anonymousReadOnly is true: signed-in people read with their own token. Every rule
  # holds get, list and watch only: a test in the operator chart fails on any other verb.
  clusterRole:
    name: kubemoot-dashboard-reader
    rules:
      # Core K8s resources
      - apiGroups: [""]
        resources: ["nodes", "namespaces", "pods"]
        verbs: ["get", "list", "watch"]
      # Node CPU and memory use for the Overview and Nodes pages (metrics-server)
      - apiGroups: ["metrics.k8s.io"]
        resources: ["nodes"]
        verbs: ["get", "list"]
      # Pod logs - needed for verify job log streaming
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get"]
      # ConfigMaps - needed to read agent <name>-policy bundles
      # (assembled system.txt, generated application.properties) for the
      # Agent detail page's Prompt section
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list"]
      # Deployments - needed by the SystemInfoPopover to read the
      # kubemoot-operator's app.kubernetes.io/version label.
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "watch"]
      # Kubemoot CRDs - read all
      - apiGroups: ["kubemoot.ai"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]

# Where the dashboard reads how busy each accelerator is and how much accelerator memory is in
# use. Empty (the default): the Nodes, Overview and Model servers pages show only what Kubemoot
# knows (which model server holds an accelerator and which models are loaded) and draw no busy or
# memory bars. A Prometheus that scrapes an accelerator exporter (NVIDIA DCGM today) fills them in.
# Prometheus cannot carry a Kubernetes identity, so the dashboard server reads it with its own
# access, asks for node-level accelerator measures only, and shows a node only to a person who can
# list that node.
metrics:
  # For example http://prometheus-operated.monitoring.svc:9090
  prometheusUrl: ""

# Sign-in. The dashboard asks every visitor to paste a Kubernetes bearer token, checks it with a
# TokenReview, and then makes every Kubernetes call with that token, so the person's own RBAC
# decides what they see and which crews they may ask. The session lives in the pod's memory
# (a restart signs everyone out; with replicaCount above 1 use session affinity).
auth:
  # false: no one sees anything before signing in. true: a visitor who has not signed in sees
  # the read views with the dashboard's own ServiceAccount (the chart then creates the read-only
  # ClusterRole below) and can never ask or change anything.
  anonymousReadOnly: false
  # The public origin people reach the dashboard at, for example https://dashboard.example.com.
  # Every sign-in, sign-out and ask must carry an Origin header equal to the origin the dashboard
  # expects. Set this behind a proxy that ends TLS (it becomes adapter-node's ORIGIN and wins).
  # Empty derives the origin from the request: the connection's scheme (plain HTTP for a
  # kubectl port-forward to http://localhost:8080) with the Host the client asked for.
  origin: ""
  # Instead of origin: trust the proxy's X-Forwarded-Proto and X-Forwarded-Host headers. Only
  # turn it on when the proxy sets them and no client can reach the dashboard around it.
  trustForwardedHeaders: false
  # The longest a sign-in lasts; a token that expires sooner ends it sooner.
  sessionMaxMinutes: 480
  # Where a crew's discussion gateway is, with {crew} and {namespace} replaced. Empty uses the
  # crew's in-cluster Service, http://<crew>-discussion.<namespace>.svc.cluster.local.
  gatewayUrl: ""
  # Sign-in through a proxy that vouches for people (off by default). On, the dashboard accepts
  # "Authorization: Bearer <token>" from the proxy's addresses and from no one else, checks the
  # token with the same TokenReview as a pasted one, and opens the usual in-memory session.
  # auth.oidc.enabled turns this on for the proxy it renders; set this alone only to put your own
  # proxy in front, and then list its addresses, and block every other way in with a
  # NetworkPolicy. Off, an incoming Authorization header is ignored.
  trustedProxy:
    enabled: false
    # Addresses of the proxy, in addition to the ones the chart's own proxy has.
    addresses: []
  # OIDC sign-in for people who have no Kubernetes account of their own: oauth2-proxy (an
  # adopted project) signs them in with your identity provider and passes the ID token to the
  # dashboard. The cluster's API server must trust the same issuer (kube-apiserver --oidc-issuer-url,
  # --oidc-client-id and the claim flags): the dashboard makes every call with that token, so what
  # the person may see is decided by RBAC for their OIDC user and groups. Without that, every
  # sign-in is refused. Off by default: nothing below renders.
  oidc:
    enabled: false
    # The identity provider's issuer URL, the same as the API server's --oidc-issuer-url.
    issuerUrl: ""
    # The client id registered for the dashboard at the provider, and its redirect URL:
    # https://<public host>/<proxy prefix>/callback, for example https://dashboard.example.com/dashboard/oauth2/callback
    clientId: ""
    redirectUrl: ""
    # A Secret in this namespace that you create, holding the key client-secret (the provider's
    # client secret) and the key cookie-secret (32 random bytes, base64: for example
    # `openssl rand -base64 32 | tr -- '+/' '-_'`). The chart never creates it and never holds a
    # value.
    existingSecret: ""
    # Where the proxy answers (its sign-in, callback and sign-out). Empty is the gateway
    # pathPrefix followed by /oauth2, so a route for the dashboard's prefix reaches it too.
    proxyPrefix: ""
    scope: "openid email profile"
    # Which e-mail domains the proxy lets through; * lets any person the provider signs in
    # reach the dashboard, and what they may see is still decided by RBAC.
    emailDomains:
      - "*"
    # The session cookie is sent only over HTTPS. Turn off only for a plain-HTTP test.
    cookieSecure: true
    # Extra oauth2-proxy arguments, for example --oidc-groups-claim=roles.
    extraArgs: []
    replicaCount: 1
    # Pinned by digest, and updated like every dependency. A private mirror overrides it.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

# The install CA that signed the certificates of the services the dashboard sends a token to (the
# operator's report service): the name of a ConfigMap in this namespace whose ca.crt the operator
# publishes. The dashboard pod mounts it and refuses a certificate this CA did not sign. The
# default is the operator chart's default; the operator chart's global.installCA.configMap, when
# set, wins, so the two cannot drift. Empty trusts only the system roots, and the report calls to
# the operator then fail verification.
installCA:
  configMap: kubemoot-ca

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

# Ingress configuration (disabled — replaced by Gateway API)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# Gateway API configuration (replaces Ingress)
gateway:
  enabled: false  # opt-in: the dashboard has no authentication; publish it only behind an authenticating proxy
  name: gateway
  namespace: default
  hostnames:
    - kubemoot.example.com
  pathPrefix: /dashboard

# Application environment variables
env:
  nodeEnv: production

# NATS connection. Off by default: with none of these set the dashboard connects to its default
# in-cluster URL plainly and anonymously. Same shape and meaning as the operator chart's nats.tls
# and nats.auth; the Secrets are in the dashboard's namespace.
nats:
  url: ""            # tls:// accepted; empty keeps the default
  tls:
    caSecret: ""
    caKey: ca.crt
    clientSecret: ""
  auth:
    secret: ""
    credsKey: ""
    userKey: ""
    passwordKey: ""
    tokenKey: ""

# Resource limits and requests
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Security context for the pod
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /dashboard/api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /dashboard/api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Verify feature configuration
verify:
  # Test runner image for verification jobs. Full reference; a private mirror overrides
  # it alongside image.registry. The public registry holds releases only, so the chart
  # release stamps the tag (0.0.0 in git) with the latest released test-runner.
  image: ghcr.io/kubemoot/test-runner:0.0.0

# Workshop instance: a second Deployment and Service of this same image and tag (never a
# separate tag), read-only and limited to the namespaces matching one label selector, with
# its own ServiceAccount that can only read. Meant for a kubectl port-forward by workshop
# attendees; the main dashboard shows every namespace. Both are read-only. Off by default.
workshop:
  enabled: false
  # Only namespaces matching this label selector are shown. Resolved against the live
  # cluster every few seconds, so a namespace gains or loses access with its label.
  namespaceSelector: kubemoot.ai/workshop-team=true
  # The operator namespace, whose shared model servers, models, embedding models, MCP
  # catalogs and quality policies stay visible. Empty means the release namespace.
  infraNamespace: ""
  replicaCount: 1
  # Empty uses the main dashboard's resources.
  resources: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}
