# Default values for kubemoot-dashboard
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Application image configuration
image:
  # Public releases are published to GHCR; a private mirror overrides registry
  # (e.g. harbor.example.com) and adds its pull secret below.
  registry: ghcr.io
  repository: kubemoot/dashboard
  # Empty: the tag is .Chart.AppVersion, which the chart release stamps from git tags
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for image.registry. Empty for the public registry.
imagePullSecrets: []

# Number of replicas
replicaCount: 1

# Service account configuration
serviceAccount:
  create: true
  name: kubemoot-dashboard
  annotations: {}

# RBAC configuration
rbac:
  create: true
  # Sign-in needs only the right to create TokenReviews, which the chart always grants. This
  # ClusterRole, for reading Kubemoot CRDs and K8s resources, is created only when
  # auth.anonymousReadOnly is true: signed-in people read with their own token. Every rule
  # holds get, list and watch only: a test in the operator chart fails on any other verb.
  clusterRole:
    name: kubemoot-dashboard-reader
    rules:
      # Core K8s resources
      - apiGroups: [""]
        resources: ["nodes", "namespaces", "pods"]
        verbs: ["get", "list", "watch"]
      # Node CPU and memory use for the Overview and Nodes pages (metrics-server)
      - apiGroups: ["metrics.k8s.io"]
        resources: ["nodes"]
        verbs: ["get", "list"]
      # Pod logs - needed for verify job log streaming
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get"]
      # ConfigMaps - needed to read agent <name>-policy bundles
      # (assembled system.txt, generated application.properties) for the
      # Agent detail page's Prompt section
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list"]
      # Deployments - needed by the SystemInfoPopover to read the
      # kubemoot-operator's app.kubernetes.io/version label.
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "watch"]
      # Kubemoot CRDs - read all
      - apiGroups: ["kubemoot.ai"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]

# Sign-in. The dashboard asks every visitor to paste a Kubernetes bearer token, checks it with a
# TokenReview, and then makes every Kubernetes call with that token, so the person's own RBAC
# decides what they see and which crews they may ask. The session lives in the pod's memory
# (a restart signs everyone out; with replicaCount above 1 use session affinity).
auth:
  # false: no one sees anything before signing in. true: a visitor who has not signed in sees
  # the read views with the dashboard's own ServiceAccount (the chart then creates the read-only
  # ClusterRole below) and can never ask or change anything.
  anonymousReadOnly: false
  # The public origin people reach the dashboard at, for example https://dashboard.example.com.
  # Every sign-in, sign-out and ask must carry an Origin header equal to the origin the server
  # sees, so behind a proxy that ends TLS set this (it becomes adapter-node's ORIGIN). Empty
  # derives the origin from the request, which suits a kubectl port-forward.
  origin: ""
  # Instead of origin: trust the proxy's X-Forwarded-Proto and X-Forwarded-Host headers. Only
  # turn it on when the proxy sets them and no client can reach the dashboard around it.
  trustForwardedHeaders: false
  # The longest a sign-in lasts; a token that expires sooner ends it sooner.
  sessionMaxMinutes: 480
  # Where a crew's discussion gateway is, with {crew} and {namespace} replaced. Empty uses the
  # crew's in-cluster Service, http://<crew>-discussion.<namespace>.svc.cluster.local.
  gatewayUrl: ""

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

# Ingress configuration (disabled — replaced by Gateway API)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# Gateway API configuration (replaces Ingress)
gateway:
  enabled: false  # opt-in: the dashboard has no authentication; publish it only behind an authenticating proxy
  name: gateway
  namespace: default
  hostnames:
    - kubemoot.example.com
  pathPrefix: /dashboard

# Application environment variables
env:
  nodeEnv: production

# NATS connection. Off by default: with none of these set the dashboard connects to its default
# in-cluster URL plainly and anonymously. Same shape and meaning as the operator chart's nats.tls
# and nats.auth; the Secrets are in the dashboard's namespace.
nats:
  url: ""            # tls:// accepted; empty keeps the default
  tls:
    caSecret: ""
    caKey: ca.crt
    clientSecret: ""
  auth:
    secret: ""
    credsKey: ""
    userKey: ""
    passwordKey: ""
    tokenKey: ""

# Resource limits and requests
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Security context for the pod
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /dashboard/api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /dashboard/api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Verify feature configuration
verify:
  # Test runner image for verification jobs. Full reference; a private mirror overrides
  # it alongside image.registry. The public registry holds releases only, so the chart
  # release stamps the tag (0.0.0 in git) with the latest released test-runner.
  image: ghcr.io/kubemoot/test-runner:0.0.0

# Workshop instance: a second Deployment and Service of this same image and tag (never a
# separate tag), read-only and limited to the namespaces matching one label selector, with
# its own ServiceAccount that can only read. Meant for a kubectl port-forward by workshop
# attendees; the main dashboard shows every namespace. Both are read-only. Off by default.
workshop:
  enabled: false
  # Only namespaces matching this label selector are shown. Resolved against the live
  # cluster every few seconds, so a namespace gains or loses access with its label.
  namespaceSelector: kubemoot.ai/workshop-team=true
  # The operator namespace, whose shared model servers, models, embedding models, MCP
  # catalogs and quality policies stay visible. Empty means the release namespace.
  infraNamespace: ""
  replicaCount: 1
  # Empty uses the main dashboard's resources.
  resources: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}
