# Default values for kubemoot-dashboard
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Application image configuration
image:
  # Public releases are published to GHCR; a private mirror overrides registry
  # (e.g. harbor.example.com) and adds its pull secret below.
  registry: ghcr.io
  repository: kubemoot/dashboard
  # Empty: the tag is .Chart.AppVersion, which the chart release stamps from git tags
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for image.registry. Empty for the public registry.
imagePullSecrets: []

# Number of replicas
replicaCount: 1

# Service account configuration
serviceAccount:
  create: true
  name: kubemoot-dashboard
  annotations: {}

# RBAC configuration
rbac:
  create: true
  # ClusterRole for reading Kubemoot CRDs and K8s resources
  clusterRole:
    name: kubemoot-dashboard-reader
    rules:
      # Core K8s resources
      - apiGroups: [""]
        resources: ["nodes", "namespaces", "pods"]
        verbs: ["get", "list", "watch"]
      # Pod logs - needed for verify job log streaming
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get"]
      # ConfigMaps - needed to read agent <name>-policy bundles
      # (assembled system.txt, generated application.properties) for the
      # Agent detail page's Prompt section
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list"]
      # Deployments - needed by the SystemInfoPopover to read the
      # kubemoot-operator's app.kubernetes.io/version label.
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "watch"]
      # Kubemoot CRDs - read all
      - apiGroups: ["kubemoot.ai"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      # Delete fitness suite runs from the Fitness page "remove run" action, and
      # patch spec.suspend / spec.cancel for its Pause, Resume and Stop actions.
      # Scoped to crewfitnesssuites only; owned children (CrewFitness CRs)
      # cascade via owner refs, so no separate delete grant is needed for them.
      - apiGroups: ["kubemoot.ai"]
        resources: ["crewfitnesssuites"]
        verbs: ["delete", "patch"]

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

# Ingress configuration (disabled — replaced by Gateway API)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# Gateway API configuration (replaces Ingress)
gateway:
  enabled: false  # opt-in: the dashboard has no authentication; publish it only behind an authenticating proxy
  name: gateway
  namespace: default
  hostnames:
    - kubemoot.example.com
  pathPrefix: /dashboard

# Application environment variables
env:
  nodeEnv: production

# Resource limits and requests
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Security context for the pod
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /dashboard/api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /dashboard/api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Verify feature configuration
verify:
  # Test runner image for verification jobs. Full reference; a private mirror overrides
  # it alongside image.registry. The public registry holds releases only, so the chart
  # release stamps the tag (0.0.0 in git) with the latest released test-runner.
  image: ghcr.io/kubemoot/test-runner:0.0.0

# Workshop instance: a second Deployment and Service of this same image and tag (never a
# separate tag), read-only and limited to the namespaces matching one label selector, with
# its own ServiceAccount that can only read. Meant for a kubectl port-forward by workshop
# attendees; the main dashboard stays as it is. Off by default.
workshop:
  enabled: false
  # Only namespaces matching this label selector are shown. Resolved against the live
  # cluster every few seconds, so a namespace gains or loses access with its label.
  namespaceSelector: kubemoot.ai/workshop-team=true
  # The operator namespace, whose shared model providers, models, embedding models, MCP
  # catalogs and quality policies stay visible. Empty means the release namespace.
  infraNamespace: ""
  replicaCount: 1
  # Empty uses the main dashboard's resources.
  resources: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}
