{{- if .Values.auth.oidc.enabled -}}
{{- include "kubemoot-dashboard.oidc.check" . -}}
{{- $o := .Values.auth.oidc -}}
{{- $name := include "kubemoot-dashboard.oidc.fullname" . -}}
{{- $prefix := include "kubemoot-dashboard.oidc.proxyPrefix" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-dashboard.oidc.labels" . | nindent 4 }}
spec:
  replicas: {{ $o.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubemoot-dashboard.oidc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubemoot-dashboard.oidc.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with (include "kubemoot-dashboard.pullSecrets" . | fromYamlArray) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: oauth2-proxy
          image: {{ $o.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --provider=oidc
            - {{ printf "--oidc-issuer-url=%s" $o.issuerUrl | quote }}
            - {{ printf "--client-id=%s" $o.clientId | quote }}
            - {{ printf "--redirect-url=%s" $o.redirectUrl | quote }}
            - {{ printf "--scope=%s" $o.scope | quote }}
            - {{ printf "--proxy-prefix=%s" $prefix | quote }}
            - --http-address=0.0.0.0:4180
            - --upstream=http://{{ include "kubemoot-dashboard.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
            # The ID token goes to the dashboard as "Authorization: Bearer", the form the API server's OIDC check reads.
            - --pass-authorization-header=true
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --cookie-secure={{ $o.cookieSecure }}
            - --cookie-samesite=lax
            {{- range $o.emailDomains }}
            - {{ printf "--email-domain=%s" . | quote }}
            {{- end }}
            {{- range $o.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $o.existingSecret | quote }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $o.existingSecret | quote }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-dashboard.oidc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kubemoot-dashboard.oidc.selectorLabels" . | nindent 4 }}
---
# Headless: its DNS answer is the proxy pods' addresses, the ones the dashboard accepts a bearer token from.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemoot-dashboard.oidc.podsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-dashboard.oidc.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: 4180
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kubemoot-dashboard.oidc.selectorLabels" . | nindent 4 }}
---
# The proxy is the only way in: without this, any pod could send the dashboard a bearer token of
# its own. (The dashboard also checks the sender's address, and the API server checks the token.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubemoot-dashboard.fullname" . }}-only-oidc-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-dashboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubemoot-dashboard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kubemoot-dashboard.oidc.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
