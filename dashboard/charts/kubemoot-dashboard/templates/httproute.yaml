{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kubemoot-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-dashboard.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
  hostnames:
  {{- range .Values.gateway.hostnames }}
  - {{ . | quote }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.gateway.pathPrefix }}
    backendRefs:
    - name: {{ include "kubemoot-dashboard.fullname" . }}
      port: {{ .Values.service.port }}
{{- end }}
