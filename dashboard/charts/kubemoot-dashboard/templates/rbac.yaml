{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubemoot-dashboard.clusterRoleName" . }}
  labels:
    {{- include "kubemoot-dashboard.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.clusterRole.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubemoot-dashboard.fullname" . }}-reader
  labels:
    {{- include "kubemoot-dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubemoot-dashboard.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubemoot-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
