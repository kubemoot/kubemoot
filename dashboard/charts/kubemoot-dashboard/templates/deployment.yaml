apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubemoot-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemoot-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubemoot-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubemoot-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubemoot-dashboard.serviceAccountName" . }}
      {{- with (include "kubemoot-dashboard.pullSecrets" . | fromYamlArray) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "kubemoot-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.env.nodeEnv }}
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: KUBEMOOT_DASHBOARD_ANONYMOUS_READ_ONLY
              value: {{ .Values.auth.anonymousReadOnly | quote }}
            - name: KUBEMOOT_DASHBOARD_CREW_NAMESPACE_DISCOVERY
              value: {{ .Values.rbac.crewNamespaceDiscovery | quote }}
            - name: KUBEMOOT_DASHBOARD_SESSION_MAX_MINUTES
              value: {{ .Values.auth.sessionMaxMinutes | quote }}
            {{- with .Values.auth.origin }}
            - name: ORIGIN
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.trustForwardedHeaders }}
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            {{- end }}
            {{- if include "kubemoot-dashboard.trustedProxy" . }}
            - name: KUBEMOOT_DASHBOARD_TRUSTED_PROXY
              value: "true"
            {{- if .Values.auth.oidc.enabled }}
            - name: KUBEMOOT_DASHBOARD_TRUSTED_PROXY_HOST
              value: {{ printf "%s.%s.svc" (include "kubemoot-dashboard.oidc.podsName" .) .Release.Namespace | quote }}
            {{- end }}
            {{- with .Values.auth.trustedProxy.addresses }}
            - name: KUBEMOOT_DASHBOARD_TRUSTED_PROXY_ADDRESSES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.metrics.prometheusUrl }}
            - name: KUBEMOOT_DASHBOARD_PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.gatewayUrl }}
            - name: KUBEMOOT_DASHBOARD_GATEWAY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if include "kubemoot-dashboard.installCAConfigMap" . }}
            # The install CA's public certificates. The dashboard calls the operator's report service
            # over https and refuses a certificate this CA did not sign.
            - name: KUBEMOOT_DASHBOARD_CA_FILE
              value: /etc/kubemoot/ca/ca.crt
            {{- end }}
            {{- if .Values.verify.image }}
            - name: VERIFY_IMAGE
              value: {{ .Values.verify.image | quote }}
            {{- end }}
            {{- with (include "kubemoot-dashboard.natsEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $mounts := include "kubemoot-dashboard.natsMounts" . | trim }}
          {{- if or $mounts (include "kubemoot-dashboard.installCAConfigMap" .) }}
          volumeMounts:
            {{- with $mounts }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if (include "kubemoot-dashboard.installCAConfigMap" .) }}
            - name: install-ca
              mountPath: /etc/kubemoot/ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- $volumes := include "kubemoot-dashboard.natsVolumes" . | trim }}
      {{- if or $volumes (include "kubemoot-dashboard.installCAConfigMap" .) }}
      volumes:
        {{- with $volumes }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if (include "kubemoot-dashboard.installCAConfigMap" .) }}
        # Published by the operator. Optional so a dashboard still starts before the operator has
        # published it; a call over https with no CA yet fails instead of going unverified.
        - name: install-ca
          configMap:
            name: {{ include "kubemoot-dashboard.installCAConfigMap" . }}
            optional: true
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
