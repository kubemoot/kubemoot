{{- include "kubemoot-vllm.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubemoot-vllm.fullname" . }}-launcher
  labels:
    {{- include "kubemoot-vllm.labels" . | nindent 4 }}
data:
  launcher.py: |
    {{- .Files.Get "files/launcher.py" | nindent 4 }}
  servers.json: |
    {{- include "kubemoot-vllm.launcherConfig" . | nindent 4 }}
