# A CPU-only Ollama for the quickstart. No GPU, no persistent volume: the model is
# pulled once per cluster lifetime, which is what a quickstart wants. For a lasting
# install, run Ollama wherever your GPU is and point the ModelProvider at it.
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.30.10
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "1h"        # keep the model resident between discussion phases
          resources:
            requests:
              cpu: 500m       # a scheduling floor only; no CPU limit, so inference uses every idle core
              memory: 3Gi
            limits:
              memory: 6Gi     # the ModelProvider declares this as its memory budget
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
