# Kubemoot Indexer Configuration
# All settings can be overridden via KUBEMOOT_* environment variables

# Source configuration
kubemoot.source-type=${KUBEMOOT_SOURCE_TYPE:git}
kubemoot.git-url=${KUBEMOOT_GIT_URL:}
kubemoot.git-branch=${KUBEMOOT_GIT_BRANCH:main}
kubemoot.git-paths=${KUBEMOOT_GIT_PATHS:}
kubemoot.s3-bucket=${KUBEMOOT_S3_BUCKET:}
kubemoot.s3-prefix=${KUBEMOOT_S3_PREFIX:}
kubemoot.s3-region=${KUBEMOOT_S3_REGION:us-east-1}
kubemoot.url=${KUBEMOOT_URL:}
kubemoot.mcp-registry-url=${KUBEMOOT_MCP_REGISTRY_URL:}
kubemoot.mcp-registry-filter=${KUBEMOOT_MCP_REGISTRY_FILTER:}

# Vector store configuration
kubemoot.vectorstore-type=${KUBEMOOT_VECTORSTORE_TYPE:pgvector}
kubemoot.vectorstore-endpoint=${KUBEMOOT_VECTORSTORE_ENDPOINT:}
kubemoot.vectorstore-collection=${KUBEMOOT_VECTORSTORE_COLLECTION:default}
kubemoot.vectorstore-dimensions=${KUBEMOOT_VECTORSTORE_DIMENSIONS:768}

# Collections to delete instead of indexing (retired indexes)
kubemoot.drop-collections=${KUBEMOOT_DROP_COLLECTIONS:}

# Embedding configuration
kubemoot.embedding-endpoint=${KUBEMOOT_EMBEDDING_ENDPOINT:http://localhost:11434}
kubemoot.embedding-model=${KUBEMOOT_EMBEDDING_MODEL:nomic-embed-text}

# Chunking configuration
kubemoot.chunk-size=${KUBEMOOT_CHUNK_SIZE:512}
kubemoot.chunk-overlap=${KUBEMOOT_CHUNK_OVERLAP:50}

# File filtering
kubemoot.include-patterns=${KUBEMOOT_INCLUDE_PATTERNS:}
kubemoot.exclude-patterns=${KUBEMOOT_EXCLUDE_PATTERNS:}
kubemoot.max-file-size=${KUBEMOOT_MAX_FILE_SIZE:100000}

# Working directory
kubemoot.work-dir=${KUBEMOOT_WORK_DIR:/data}

# Spring AI embeddings: the OpenAI-compatible /v1/embeddings API every model server serves
# (Ollama, vLLM). The server needs no key; the client wants one set.
spring.ai.model.embedding=openai
spring.ai.model.chat=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${KUBEMOOT_EMBEDDING_API_KEY:none}
spring.ai.openai.base-url=${KUBEMOOT_EMBEDDING_ENDPOINT:http://localhost:11434}/v1
spring.ai.openai.embedding.model=${KUBEMOOT_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.openai.embedding.encoding-format=float

# Spring AI PgVector Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=${KUBEMOOT_VECTORSTORE_DIMENSIONS:768}
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=data_${KUBEMOOT_VECTORSTORE_COLLECTION:default}

# PostgreSQL DataSource (parsed from KUBEMOOT_VECTORSTORE_ENDPOINT)
# Format: postgres://user:password@host:port/database
spring.datasource.url=${KUBEMOOT_VECTORSTORE_ENDPOINT:jdbc:postgresql://localhost:5432/vectors}
spring.datasource.username=${KUBEMOOT_VECTORSTORE_USER:postgres}
spring.datasource.password=${KUBEMOOT_VECTORSTORE_PASSWORD:postgres}

# Disable web server (this is a CLI application)
spring.main.web-application-type=none

# Logging
logging.level.ai.kubemoot=INFO
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36}: %msg%n
